    .app{display:flex;min-height:100vh}

    .tag.orange{color:var(--orange);background:rgba(251,146,60,.13);border-color:rgba(251,146,60,.25)}
    .tag.green{color:var(--green);background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.25)}
    .tag.purple{color:var(--purple);background:rgba(129,140,248,.12);border-color:rgba(129,140,248,.25)}
    .tag.cyan{color:var(--cyan);background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.25)}
    .btnOutline{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:9px;font-size:13px}
    .btnSmall{padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:800}

    .cardName{font-size:15px;font-weight:900}
    .pct{font-size:16px;font-weight:900;font-family:'IBM Plex Mono',monospace;color:var(--purple)}

<body>
  <div id="root"></div>

<script>
/******************************************************************
 * STORAGE + SETTINGS
 ******************************************************************/
const STORAGE_KEY = "recall_full_final_v1";
const DEFAULT_DAILY_GOAL = 150;

const INIT = {
  decks:{},
  stats:{},
  settings:{
    appStartDate:null,
    mutedDecksByDay:{},
    dailyGoal: DEFAULT_DAILY_GOAL,
    studyMode: "mixed_random",
    strictness: "balanced",
    masteredReviewPerDay: 15,
    masteredHandling: "mix"
  }
};

let DATA = loadData();
let SCREEN = "dashboard";
let CURRENT_DAY = todayStr();

// ── Custom Study State ────────────────────────────────────────
let CUSTOM_SELECTED = new Set();   // card IDs currently checked
let CUSTOM_FILTER_DECK   = "all";  // "all" or a deckId
let CUSTOM_FILTER_STATUS = "all";  // all|unseen|due|mastered|wrong|starred
let CUSTOM_SHUFFLE       = true;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : structuredClone(INIT);
    return normalizeData(parsed);
  }catch{
    return normalizeData(structuredClone(INIT));
  }
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch{}
}
function updateData(mutator){
  const next = structuredClone(DATA);
  mutator(next);
  normalizeData(next);
  DATA = next;
  saveData(DATA);
  render();
}
function hardResetAll(){
  if (!confirm("Fresh start will wipe ALL decks + stats in this app. Continue?")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch{}
  DATA = normalizeData(structuredClone(INIT));
  saveData(DATA);
  SCREEN = "dashboard";
  CURRENT_DAY = todayStr();
  render();
}

function setScreen(s){
  if (window.__studyInterval){
    clearInterval(window.__studyInterval);
    window.__studyInterval = null;
  }
  if (window.__studyKeyHandler){
    window.removeEventListener("keydown", window.__studyKeyHandler);
    window.__studyKeyHandler = null;
  }
  // Clear custom queue when leaving study
  if (s !== "study"){
    window.__customQueue = null;
    window.__customMode  = false;
  }
  SCREEN = s;
  render();
}

function handleDayRollover(){
  const nowDay = todayStr();
  if (nowDay === CURRENT_DAY) return;
  CURRENT_DAY = nowDay;
  if (SCREEN === "study"){
    alert("New day detected. Study queue refreshed at midnight.");
    setScreen("dashboard");
    return;
  }
  render();
}

/******************************************************************
 * DATE + DUE
 ******************************************************************/
function localDateStr(input=new Date()){
  const d = (input instanceof Date) ? input : new Date(input);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayStr(){ return localDateStr(new Date()); }
function nowMs(){ return Date.now(); }

function normalizeData(d){
  if (!d.settings) d.settings = structuredClone(INIT.settings);
  if (!d.settings.appStartDate) d.settings.appStartDate = todayStr();
  if (!d.settings.mutedDecksByDay) d.settings.mutedDecksByDay = {};
  if (!d.settings.dailyGoal) d.settings.dailyGoal = DEFAULT_DAILY_GOAL;
  if (!d.settings.studyMode) d.settings.studyMode = "mixed_random";
  if (!d.settings.strictness) d.settings.strictness = "balanced";
  if (d.settings.masteredReviewPerDay == null) d.settings.masteredReviewPerDay = 15;
  if (!d.settings.masteredHandling) d.settings.masteredHandling = "mix";
  if (!d.decks) d.decks = {};
  for (const deck of Object.values(d.decks)){
    if (!deck.studyOrder) deck.studyOrder = "random";
    deck.cards = (deck.cards||[]).map(c=>normalizeCard(c));
  }
  return d;
}

function getDailyGoal(){ return Number(DATA.settings?.dailyGoal || DEFAULT_DAILY_GOAL); }
function getMasteredReviewPerDay(){ return Number(DATA.settings?.masteredReviewPerDay ?? 15); }
function getMutedToday(){ return DATA.settings?.mutedDecksByDay?.[todayStr()] || []; }
function isDeckMuted(deckId){ return getMutedToday().includes(deckId); }

function isDue(card){
  return !card.mastered && (!card.nextReview || localDateStr(card.nextReview) <= todayStr());
}
function isMasteredDue(card){
  return card.mastered && (!card.nextReview || localDateStr(card.nextReview) <= todayStr());
}

/******************************************************************
 * SM-2
 ******************************************************************/
function sm2(card, quality){
  let {interval=1, easeFactor=2.5, repetitions=0} = card;
  if (quality < 3){ repetitions = 0; interval = 1; }
  else{
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetitions++;
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5-quality) * (0.08 + (5-quality)*0.02));
  const nr = new Date();
  nr.setDate(nr.getDate() + interval);
  const mastered = quality === 5 ? true : (quality < 3 ? false : card.mastered);
  return {...card, interval, easeFactor, repetitions, nextReview: nr.toISOString(), mastered};
}

/******************************************************************
 * ANSWER MATCHING
 ******************************************************************/
function normalizeStr(s){
  return (s||"")
    .toLowerCase()
    .replace(/[^a-z0-9\s\+\-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function levenshtein(a,b){
  const dp = Array.from({length:a.length+1}, (_,i)=>Array.from({length:b.length+1},(_,j)=> i===0?j : j===0?i : 0));
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}
function splitAlternatives(s){
  const raw = String(s||"").trim();
  if (!raw) return [];
  return raw.split(/\s*(?:\/|;|\bor\b|,)\s*/gi).map(x=>x.trim()).filter(Boolean);
}
function getAnswerVariants(answer){
  const raw = String(answer||"");
  const variants = new Set();
  const push = (v)=>{ const n = normalizeStr(v); if (n) variants.add(n); };
  const baseForms = [
    raw,
    raw.replace(/^\s*(answer|ans|a)\s*[:.)-]?\s*/i, ""),
    raw.replace(/\([^)]*\)/g, " "),
    raw.replace(/\[[^\]]*\]/g, " "),
    raw.replace(/^\s*(answer|ans|a)\s*[:.)-]?\s*/i, "").replace(/\([^)]*\)|\[[^\]]*\]/g, " "),
  ];
  for (const bf of baseForms){
    push(bf);
    for (const alt of splitAlternatives(bf)) push(alt);
  }
  const base = Array.from(variants);
  for (const v of base) push(v.replace(/^\s*(the|an?)\s+/, ""));
  return Array.from(variants);
}
function tokenize(s){ return normalizeStr(s).split(" ").filter(Boolean); }
function jaccard(aTokens, bTokens){
  const A = new Set(aTokens); const B = new Set(bTokens);
  if (!A.size || !B.size) return 0;
  let inter = 0; for (const t of A) if (B.has(t)) inter++;
  const union = A.size + B.size - inter;
  return union ? inter/union : 0;
}
function normalizedEditSim(a, b){
  if (!a || !b) return 0;
  const d = levenshtein(a,b);
  const m = Math.max(a.length, b.length);
  return m ? (1 - d/m) : 0;
}
function getStrictnessThresholds(){
  const s = DATA.settings?.strictness || "balanced";
  if (s === "lenient") return {correct:0.82, close:0.66};
  if (s === "strict")  return {correct:0.90, close:0.76};
  return {correct:0.86, close:0.72};
}
function checkAnswer(input, answer){
  const inp = normalizeStr(input);
  if (!inp) return "wrong";
  const variants = getAnswerVariants(answer);
  if (!variants.length) return "wrong";
  for (const v of variants){
    if (inp === v) return "correct";
    if (inp.includes(v) && v.length >= 3) return "correct";
    if (v.includes(inp) && inp.length >= Math.floor(v.length * 0.6)) return "correct";
  }
  let best = 0;
  for (const v of variants){
    const aTok = tokenize(inp);
    const bTok = tokenize(v);
    const jac = jaccard(aTok, bTok);
    const ed  = normalizedEditSim(inp, v);
    const w = (bTok.length >= 2) ? (0.7*jac + 0.3*ed) : (0.45*jac + 0.55*ed);
    if (w > best) best = w;
  }
  const th = getStrictnessThresholds();
  if (best >= th.correct) return "correct";
  if (best >= th.close) return "close";
  return "wrong";
}

/******************************************************************
 * CLOZE + MC
 ******************************************************************/
function makeCloze(text){
  const words = (text||"").split(" ");
  if (words.length < 3) return {clozeText:"___", answer:text||""};
  let idx=1, max=0;
  words.forEach((w,i)=>{
    const l = w.replace(/[^a-z]/gi,"").length;
    if (l>max && i>0){ max=l; idx=i; }
  });
  return {clozeText: words.map((w,i)=> i===idx ? "___" : w).join(" "), answer: words[idx]};
}
function decideAdaptiveMode(card){
  return card.adaptivePref || "cloze";
}
function buildMCOptions(currentCard, deckCards, n=4){
  const correct = (currentCard.back||"").trim();
  const pool = deckCards
    .map(c => (c.back||"").trim())
    .filter(b => b && b !== correct && b.length >= 2 && b.length <= 140);
  const picks = [];
  const used = new Set([normalizeStr(correct)]);
  let guard = 0;
  while (picks.length < (n-1) && guard < 500){
    guard++;
    if (!pool.length) break;
    const cand = pool[Math.floor(Math.random()*pool.length)];
    const nk = normalizeStr(cand);
    if (nk && !used.has(nk)){ used.add(nk); picks.push(cand); }
  }
  const opts = [correct, ...picks].slice(0,n);
  for (let i=opts.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return { options: opts, correct };
}

function makeCard({id, front, back, frontImage=null, backImage=null, createdAtIdx=0}){

}
function normalizeCard(card){
  if (card.seenCount == null) card.seenCount = 0;
  if (card.lastSeenOn == null) card.lastSeenOn = null;
  if (card.inWrongDeck == null) card.inWrongDeck = false;

  if (!card.adaptiveMode) card.adaptiveMode = "typed";
  if (!card.adaptivePref) card.adaptivePref = "cloze";
  if (card.starred == null) card.starred = false;
  return card;
}

/******************************************************************
 * SHUFFLE + QUEUE BUILDING
 ******************************************************************/
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function deckOrderCards(deck, cards){
  const order = deck.studyOrder || "random";
  if (order === "inorder"){
    return cards
      .slice()
      .sort((a,b)=> (a.createdAtIdx ?? 0) - (b.createdAtIdx ?? 0) || String(a.id).localeCompare(String(b.id)));
  }
  return shuffle(cards);
}

function interleaveBuckets(listByDeck){
  const queues = Object.entries(listByDeck)
    .filter(([,cards])=>cards.length)
    .map(([deckId,cards])=>({deckId,cards,i:0}));
  const mode = DATA.settings?.studyMode || "mixed_random";
  const base = (mode === "mixed_random") ? shuffle(queues) : queues;
  const out = [];
  let moved = true;
  while (moved){
    moved = false;
    const cycle = (mode === "mixed_random") ? shuffle(base) : base;
    for (const q of cycle){
      if (q.i < q.cards.length){
        out.push({...q.cards[q.i], deckId:q.deckId});
        q.i++;
        moved = true;
      }
    }
  }
  return (mode === "mixed_random") ? shuffle(out) : out;
}

function buildDailyQueue(decks, limit){
  const wrongByDeck    = {};
  const dueByDeck      = {};
  const unseenByDeck   = {};
  const masteredByDeck = {};

  for (const [id, deck] of Object.entries(decks)){
    if (isDeckMuted(id)) continue;
    const cards = (deck.cards||[]).map(c=>normalizeCard(c));
    const wrong    = cards.filter(c=>!c.mastered && c.inWrongDeck);
    const due      = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)>0 && isDue(c));
    const unseen   = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)===0);
    const mastered = cards.filter(c=>isMasteredDue(c));

    wrongByDeck[id]    = deckOrderCards(deck, wrong);
    dueByDeck[id]      = deckOrderCards(deck, due);
    unseenByDeck[id]   = deckOrderCards(deck, unseen);
    masteredByDeck[id] = deckOrderCards(deck, mastered);
  }

  const wrongQueue   = interleaveBuckets(wrongByDeck);
  const dueQueue     = interleaveBuckets(dueByDeck);
  const masteredCap   = getMasteredReviewPerDay();
  const masteredQueue = interleaveBuckets(masteredByDeck).slice(0, masteredCap);
  const newSlots      = Math.max(0, limit - wrongQueue.length - dueQueue.length - masteredQueue.length);
  const cappedByDeck  = {};

  if (newSlots > 0){
    const activeIds = Object.keys(unseenByDeck).filter(id => unseenByDeck[id].length > 0);
    let remaining   = newSlots;
    let pool        = [...activeIds];
    for (let pass = 0; pass < 5 && pool.length > 0 && remaining > 0; pass++){
      const perDeck = Math.ceil(remaining / pool.length);
      const nextPool = [];
      for (const id of pool){
        const give = Math.min(perDeck, unseenByDeck[id].length, remaining);
        cappedByDeck[id] = (cappedByDeck[id] || 0) + give;
        remaining -= give;
        if (unseenByDeck[id].length > cappedByDeck[id]) nextPool.push(id);
      }
      pool = nextPool;
    }
  }

  const slicedByDeck = {};
  for (const [id, count] of Object.entries(cappedByDeck)){
    slicedByDeck[id] = unseenByDeck[id].slice(0, count);
  }

  const unseenQueue = interleaveBuckets(slicedByDeck);
  const masteredHandling = DATA.settings?.masteredHandling || "mix";
  let tail;
  if (masteredHandling === "mute"){
    tail = unseenQueue;
  } else if (masteredHandling === "front"){
    tail = [...masteredQueue, ...unseenQueue];
  } else {
    tail = shuffle([...masteredQueue, ...unseenQueue]);
  }

  return {
    wrongQueue, dueQueue, masteredQueue, unseenQueue,
    perDeckNewSlots: Object.fromEntries(
      Object.entries(slicedByDeck).map(([id,arr])=>[id,arr.length])
    ),
    queue: [...wrongQueue, ...dueQueue, ...tail]
  };
}

function getFilteredCustomCards(){
  const result = [];
  for (const [deckId, deck] of Object.entries(DATA.decks)){
    if (CUSTOM_FILTER_DECK !== "all" && deckId !== CUSTOM_FILTER_DECK) continue;
    for (const rawCard of (deck.cards||[])){
      const c = normalizeCard({...rawCard});
      // status filter
      if (CUSTOM_FILTER_STATUS === "unseen"   && (c.seenCount||0) > 0) continue;
      if (CUSTOM_FILTER_STATUS === "due"      && !isDue(c)) continue;
      if (CUSTOM_FILTER_STATUS === "mastered" && !c.mastered) continue;
      if (CUSTOM_FILTER_STATUS === "wrong"    && !c.inWrongDeck) continue;
      if (CUSTOM_FILTER_STATUS === "starred"  && !c.starred) continue;
      result.push({...c, deckId, deckName: deck.name});
    }
  }
  return result;
}

function fileToBase64(file){
  return new Promise((resolve)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.readAsDataURL(file);
  });
}
async function clipboardImageToBase64(e){
  const items = e.clipboardData?.items || [];
  for (const it of items){
    if (it.type && it.type.startsWith("image/")){
      const file = it.getAsFile();
      if (!file) continue;
      return await fileToBase64(file);
    }
  }
  return null;
}

/******************************************************************
 * PDF + TEXT + SPREADSHEET EXTRACTION
 ******************************************************************/
async function extractLinesFromPDF(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const byY = {};
    for (const item of content.items){
      const y = Math.round(item.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push(item.str);
    }
    const sortedYs = Object.keys(byY).map(Number).sort((a,b)=>b-a);
    for (const y of sortedYs){
      const line = byY[y].join(" ").trim();
      if (line) lines.push(line);
    }
  }
  return lines;
}

function cardsFromLinesLineByLine(lines){
  const cards = [];
  const filtered = lines.filter(l=>l.trim().length > 0);
  for (let i = 0; i+1 < filtered.length; i+=2){
    const front = filtered[i].trim();
    const back = filtered[i+1].trim();
    if (front && back) cards.push({front, back});
  }
  return cards;
}

function parseCardsFromTextSmart(text){
  const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const tabCards = [];
  for (const line of lines){
    const parts = line.split(/\t/);
    if (parts.length >= 2){
      const front = parts[0].trim();
      const back = parts.slice(1).join(" ").trim();
      if (front && back) tabCards.push({front, back});
    }
  }
  if (tabCards.length >= Math.floor(lines.length * 0.6)) return tabCards;
  const qaPattern = /^(?:Q(?:uestion)?[\s:.)\-]+)(.+)/i;
  const ansPattern = /^(?:A(?:nswer)?[\s:.)\-]+)(.+)/i;
  const qaCards = [];
  let i = 0;
  while (i < lines.length){
    const qm = lines[i].match(qaPattern);
    if (qm){
      let front = qm[1];
      let back = "";
      i++;
      while (i < lines.length){
        const am = lines[i].match(ansPattern);
        if (am){ back = am[1]; i++; break; }
        else if (lines[i].match(qaPattern)) break;
        else { front += " " + lines[i]; i++; }
      }
      if (front && back) qaCards.push({front: front.trim(), back: back.trim()});
    } else { i++; }
  }
  if (qaCards.length > 0) return qaCards;
  const sepCards = [];
  for (const line of lines){
    const m = line.match(/^(.{3,}?)\s*(?:\t| - | \| |: )\s*(.+)$/);
    if (m) sepCards.push({front: m[1].trim(), back: m[2].trim()});
  }
  if (sepCards.length >= Math.floor(lines.length * 0.5)) return sepCards;
  return cardsFromLinesLineByLine(lines);
}

async function extractCardsFromSpreadsheet(file){
  const arrayBuffer = await file.arrayBuffer();
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
  const cards = [];
  for (const row of rows){
    if (!row || row.length < 2) continue;
    const front = String(row[0]||"").trim();
    const back = String(row[1]||"").trim();
    if (front && back) cards.push({front, back});
  }
  return cards;
}

  });

  // Shuffle toggle
  const shuffleToggle = document.getElementById("shuffleToggle");
  if (shuffleToggle) shuffleToggle.onchange = ()=>{ CUSTOM_SHUFFLE = shuffleToggle.checked; };

  // Select all visible
  const selAllBtn = document.getElementById("selectAllVisible");
  if (selAllBtn) selAllBtn.onclick = ()=>{
    const filtered = getFilteredCustomCards();
    filtered.forEach(c=>CUSTOM_SELECTED.add(c.id));
    render();
  };

  // Deselect all
  const deselBtn = document.getElementById("deselectAll");
  if (deselBtn) deselBtn.onclick = ()=>{ CUSTOM_SELECTED.clear(); render(); };

  // Invert selection (among currently visible filtered cards)
  const invertBtn = document.getElementById("invertSelection");
  if (invertBtn) invertBtn.onclick = ()=>{
    const filtered = getFilteredCustomCards();
    for (const c of filtered){
      if (CUSTOM_SELECTED.has(c.id)) CUSTOM_SELECTED.delete(c.id);
      else CUSTOM_SELECTED.add(c.id);
    }
    render();
  };

  // Per-deck "Select All" buttons
  document.querySelectorAll("[data-select-deck]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const dId = btn.dataset.selectDeck;
      const filtered = getFilteredCustomCards().filter(c=>c.deckId===dId);
      const allSel = filtered.every(c=>CUSTOM_SELECTED.has(c.id));
      if (allSel) filtered.forEach(c=>CUSTOM_SELECTED.delete(c.id));
      else filtered.forEach(c=>CUSTOM_SELECTED.add(c.id));
      render();
    };
  });

  // Individual card checkboxes
  document.querySelectorAll("[data-cid]").forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.cid;
      if (cb.checked) CUSTOM_SELECTED.add(id);
      else CUSTOM_SELECTED.delete(id);
      // Lightweight update: just re-render (fast)
      render();
    };
  });

  function startCustomStudy(){
    if (CUSTOM_SELECTED.size === 0){ alert("Select at least one card."); return; }

    // Build queue from selected cards with deckId attached
    const allCards = [];
    for (const [deckId, deck] of Object.entries(DATA.decks)){
      for (const rawCard of (deck.cards||[])){
        if (CUSTOM_SELECTED.has(rawCard.id)){
          allCards.push({...normalizeCard({...rawCard}), deckId});
        }
      }
    }

    window.__customQueue = CUSTOM_SHUFFLE ? shuffle(allCards) : allCards;
    window.__customMode  = true;
    setScreen("study");
  }

  const topBtn = document.getElementById("startCustomStudyTop");
  if (topBtn) topBtn.onclick = startCustomStudy;
  const botBtn = document.getElementById("startCustomStudyBottom");
  if (botBtn) botBtn.onclick = startCustomStudy;
}

 * CALENDAR
 ******************************************************************/
function dayStatus(day){
  const st = DATA.stats[day] || {reviewed:0};
  const reviewed = Number(st.reviewed || 0);
  const goal = getDailyGoal();
  if (!reviewed) return "nodata";
  if (reviewed >= goal) return "hit";
  if (reviewed >= Math.ceil(goal * 0.5)) return "partial";
  return "missed";
}
function calendarHTML(){
  const start = DATA.settings?.appStartDate || todayStr();
  const startDate = new Date(start+"T00:00:00");
  const today = new Date(todayStr()+"T00:00:00");
  const days = [];
  for (let d = new Date(startDate); d <= today; d.setDate(d.getDate()+1)){
    days.push(localDateStr(d));
  }
  const firstDow = new Date(days[0]+"T00:00:00").getDay();
  const labels = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  let hit=0, partial=0, missed=0;
  let grid = labels.map(x=>`<div class="calLabel">${x}</div>`).join("");
  for (let i=0;i<firstDow;i++) grid += `<div class="calDay empty"></div>`;
  for (const ds of days){
    const s = dayStatus(ds);
    if (s === "hit") hit++;
    if (s === "partial") partial++;
    if (s === "missed") missed++;
    const dd = Number(ds.slice(-2));
    const cls = `calDay ${s}${ds===todayStr()?" today":""}`;
    grid += `<div class="${cls}" title="${ds}">${dd}</div>`;
  }
  return `
    ${headerHTML(false)}
    <div class="section">Calendar</div>
    <div class="row" style="margin-bottom:14px">
      ${stat("Started", start, "var(--purple)")}
      ${stat("Hit Goal", hit, "var(--green)")}
      ${stat("Partial", partial, "var(--orange)")}
      ${stat("Missed", missed, "var(--red)")}
    </div>
    <div class="calWrap">
      <div style="font-size:13px;color:var(--muted);font-weight:900;margin-bottom:10px">Tracking from ${start}</div>
      <div class="calGrid">${grid}</div>
      <div class="tiny" style="margin-top:10px;color:var(--muted)">Green=goal · Orange=partial · Red=missed · Gray=no data</div>
    </div>
  `;
}

function bindAdd(){
  document.getElementById("backDash").onclick = ()=> setScreen("dashboard");
  let mode = "pdf";
  let files = [];
  let textContent = "";
  let busy = false;
  let pdfLineByLine = false;
  const modeButtons = [...document.querySelectorAll("[data-mode]")];
  const modeArea = document.getElementById("modeArea");
  const msgArea = document.getElementById("msgArea");
  const buildBtn = document.getElementById("buildBtn");
  const deckOrderSel = document.getElementById("deckOrder");

  function setMode(m){
    mode = m;
    modeButtons.forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
    files = [];
    textContent = "";
    pdfLineByLine = false;
    msgArea.innerHTML = "";
    renderModeArea();
    buildBtn.textContent = (mode==="manual") ? "Create Empty Deck" : "Extract & Create Deck";
  }

  function pushMsg(kind, text){
    const cls = kind==="err" ? "box err" : kind==="ok" ? "box ok" : "box";
    msgArea.innerHTML = `<div class="${cls}">${escapeHTML(text)}</div>` + msgArea.innerHTML;
  }

  function renderModeArea(){
    if (mode==="pdf"){
      modeArea.innerHTML = `
        <div style="margin-bottom:16px">
          <div class="tiny" style="font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)">PDF Files</div>
          <div class="upload" id="uploadZone">
            <div style="font-size:30px;margin-bottom:8px">◉</div>
            <div style="color:var(--muted);font-weight:900">Click to upload PDF(s)</div>
          </div>
          <input type="file" id="fileInput" accept=".pdf" multiple style="display:none" />
          <label style="display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--muted);font-size:12px;font-weight:900">
            <input type="checkbox" id="lineByLine" />
            Line-by-line mode (pairs adjacent lines into cards)
          </label>
        </div>
      `;
      const input = document.getElementById("fileInput");
      document.getElementById("uploadZone").onclick = ()=> input.click();
      input.onchange = (e)=>{
        files = [...e.target.files];
        pushMsg("ok", `Loaded ${files.length} PDF(s): ${files.map(f=>f.name).join(", ")}`);
      };
      document.getElementById("lineByLine").onchange = (e)=>{ pdfLineByLine = !!e.target.checked; };
    }
    if (mode==="excel"){
      modeArea.innerHTML = `
        <div style="margin-bottom:16px">
          <div class="tiny" style="font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)">Excel / CSV</div>
          <div class="upload" id="uploadZone">
            <div style="font-size:30px;margin-bottom:8px">▦</div>
            <div style="color:var(--muted);font-weight:900">Click to upload .xlsx / .csv</div>
          </div>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" />
        </div>
      `;
      const input = document.getElementById("fileInput");
      document.getElementById("uploadZone").onclick = ()=> input.click();
      input.onchange = (e)=>{
        files = [...e.target.files];
        pushMsg("ok", `Loaded spreadsheet: ${files[0]?.name || "(none)"}`);
      };
    }
    if (mode==="text"){
      modeArea.innerHTML = `
        <div style="margin-bottom:16px">
          <div class="tiny" style="font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)">Paste Content</div>
          <textarea class="textarea" id="textArea" rows="10" placeholder="Paste Q/A pairs, term-definition lines, or tab-separated content..."></textarea>
        </div>
      `;
      document.getElementById("textArea").oninput = (e)=>{ textContent = e.target.value; };
    }
    if (mode==="manual"){
      modeArea.innerHTML = `<div class="box">Deck created empty — add cards in Manage.</div>`;
    }
  }

  async function buildDeck(){
    if (busy) return;
    const name = document.getElementById("deckName").value.trim();
    if (!name){ pushMsg("err","Enter a deck name"); return; }
    busy = true;
    buildBtn.disabled = true;
    buildBtn.textContent = "Processing…";
    try{
      let rawCards = [];
      if (mode==="pdf"){
        if (!files.length) throw new Error("Upload at least one PDF");
        for (const f of files){
          pushMsg("ok", `Extracting: ${f.name}`);
          const lines = await extractLinesFromPDF(f);
          rawCards = rawCards.concat(pdfLineByLine ? cardsFromLinesLineByLine(lines) : parseCardsFromTextSmart(lines.join("\n")));
        }
      }
      if (mode==="excel"){
        if (!files.length) throw new Error("Upload an Excel/CSV file");
        rawCards = await extractCardsFromSpreadsheet(files[0]);
      }
      if (mode==="text"){
        if (!textContent.trim()) throw new Error("Paste some text");
        rawCards = parseCardsFromTextSmart(textContent);
      }
      if (mode==="manual") rawCards = [];
      const seen = new Set();
      const clean = [];
      for (const c of rawCards){
        const front = (c.front||"").trim();
        const back  = (c.back||"").trim();
        if (!front || !back) continue;
        const k = front+"||"+back;
        if (seen.has(k)) continue;
        seen.add(k);
        clean.push({front: front.slice(0,500), back: back.slice(0,500)});
      }
      const cards = clean.map((c,i)=>makeCard({
        id: `${Date.now()}_${i}`,
        front: c.front,
        back: c.back,
        createdAtIdx: i
      }));
      const deckId = `deck_${Date.now()}`;
      const order = deckOrderSel.value;
      updateData(d=>{
        d.decks[deckId] = { name, studyOrder: order, cards, createdAt: new Date().toISOString() };
      });
      pushMsg("ok", `Created deck "${name}" with ${cards.length} cards`);
      setScreen("manage");
    }catch(e){
      pushMsg("err", e.message || "Error");
    }finally{
      busy = false;
      buildBtn.disabled = false;
      buildBtn.textContent = (mode==="manual") ? "Create Empty Deck" : "Extract & Create Deck";
    }
  }

  modeButtons.forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));
  buildBtn.onclick = buildDeck;
  renderModeArea();
}

function bindManage(){
  document.getElementById("backDash").onclick = ()=> setScreen("dashboard");
  const deckList = document.getElementById("deckList");
  const deckPanel = document.getElementById("deckPanel");
  let selected = null;
  let filter = "all";
  let editingCardId = null;

  function renderDeckList(){
    const entries = Object.entries(DATA.decks);
    if (!entries.length){
      deckList.innerHTML = `<div class="box" style="color:var(--muted)">No decks yet</div>`;
      deckPanel.innerHTML = `<div class="box" style="color:var(--muted)">Create a deck first</div>`;
      return;
    }
    if (!selected) selected = entries[0][0];
    deckList.innerHTML = entries.map(([id, deck])=>{
      const cards = (deck.cards||[]).map(c=>normalizeCard(c));
      const mastered = cards.filter(c=>c.mastered).length;
      const seen = cards.filter(c=>(c.seenCount||0)>0).length;
      const pctSeen = cards.length ? Math.round((seen/cards.length)*100) : 0;
      return `
        <div class="deckItem ${selected===id?'active':''}" data-deck="${id}">
          <div style="font-weight:900">${escapeHTML(deck.name)}</div>
          <div class="tiny" style="color:var(--muted)">${cards.length} cards · ${mastered} mastered</div>
          <div class="tiny" style="color:var(--cyan);margin-top:3px">Seen: ${seen}/${cards.length} (${pctSeen}%)</div>
        </div>
      `;
    }).join("");
    deckList.querySelectorAll("[data-deck]").forEach(el=>{
      el.onclick = ()=>{ selected = el.dataset.deck; editingCardId=null; renderDeckList(); renderPanel(); };
    });
    renderPanel();
  }

    if (!selected || !DATA.decks[selected]){

      return;

      filter==="mastered" ? c.mastered :

    const masteredCount = cardsAll.filter(c=>c.mastered).length;

function bindStudy(){
  const exit = document.getElementById("exitStudy");
  if (exit) exit.onclick = ()=> setScreen("dashboard");

  const st = window.__study;
  if (!st) return;

  const qtext        = document.getElementById("qtext");
  const ansInput     = document.getElementById("ansInput");
  const checkBtn     = document.getElementById("checkBtn");
  const typedPane    = document.getElementById("typedPane");
  const revealPane   = document.getElementById("revealPane");
  const banner       = document.getElementById("banner");
  const youAns       = document.getElementById("youAns");
  const trueAns      = document.getElementById("trueAns");
  const reqBadge     = document.getElementById("reqBadge");
  const masterBadge  = document.getElementById("masterBadge");
  const pfill        = document.getElementById("pfill");
  const ptext        = document.getElementById("ptext");
  const deckName     = document.getElementById("deckName");
  const modeTagWrap  = document.getElementById("modeTagWrap");
  const mcOptions    = document.getElementById("mcOptions");
  const starBtn      = document.getElementById("starBtn");
  const seenBadge    = document.getElementById("seenBadge");
  const frontImg     = document.getElementById("frontImg");
  const backImg      = document.getElementById("backImg");
  const sc           = document.getElementById("sc");
  const sw           = document.getElementById("sw");
  const srq          = document.getElementById("srq");
  const sst          = document.getElementById("sst");
  const sleft        = document.getElementById("sleft");
  const stimer       = document.getElementById("stimer");

  st.sessionStartedAt = st.sessionStartedAt || nowMs();

  function getDeckCards(deckId){ return DATA.decks[deckId]?.cards || []; }

  function pickNextActive(){
    const li = st.learning.findIndex(x => x.dueTimeMs <= nowMs());
    if (li >= 0){
      st.active = { card: st.learning[li].card, source: "learning", learningIndex: li };
      return st.active.card;
    }
    if (st.isRequeue){
      const c = st.requeue[st.reqIdx];
      st.active = c ? { card: c, source: "requeue", learningIndex: -1 } : null;
      return c || null;
    }
    const c = st.primaryQueue[st.idx];
    st.active = c ? { card: c, source: "primary", learningIndex: -1 } : null;
    return c || null;
  }

  function currentCard(){
    if (st.active?.card) return st.active.card;
    return pickNextActive();
  }

  function getModeForCard(card){
    if (card.mastered) return "typed";
    let mode = card.adaptiveMode || "typed";
    const threshold = card.adaptiveThreshold ?? 3;
    const wrongs = card.wrongCount || 0;
    if (mode === "typed" && wrongs >= threshold) mode = decideAdaptiveMode(card);
    return mode;
  }

  function isMasteredCard(card){
    const liveCard = DATA.decks[card.deckId]?.cards?.find(c=>c.id===card.id);
    return (liveCard || card).mastered;
  }

  function refresh(){
    if (st.dayKey !== todayStr() && !st.isCustomMode){
      setScreen("dashboard");
      return;
    }

    const card = currentCard();
    if (!card){
      document.getElementById("root").innerHTML = `
        <div class="app" style="background:var(--bg)">
          <div class="studyWrap">
            <div class="done">
              <div class="ic">✦</div>
              <div class="t">${st.isCustomMode ? "Custom Session Done!" : "Session Complete!"}</div>
              <div class="s">${st.sess.total?Math.round((st.sess.correct/st.sess.total)*100):0}% accuracy · ${st.sess.requeues} requeue(s) · ${st.sess.starred} star(s)</div>
              ${st.isCustomMode ? `
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px">
                  <button class="btnPrimary" id="restartCustom">↺ Restart Same Cards</button>
                  <button class="btnOutline" id="backToCustom">⊕ Back to Custom Study</button>
                </div>
              ` : ''}
              <button class="btnOutline" id="exitStudy">← Back to Dashboard</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("exitStudy").onclick = ()=> setScreen("dashboard");
      if (st.isCustomMode){
        document.getElementById("backToCustom").onclick = ()=> setScreen("custom");
        document.getElementById("restartCustom").onclick = ()=>{
          // Restart with the same cards (re-shuffle if needed)
          window.__customQueue = CUSTOM_SHUFFLE
            ? shuffle(window.__customQueue || [])
            : (window.__customQueue || []);
          window.__customMode = true;
          setScreen("study");
        };
      }
      return;
    }

    const mode = getModeForCard(card);
    const isCardMastered = isMasteredCard(card);

    modeTagWrap.innerHTML = "";
    if (isCardMastered) modeTagWrap.innerHTML += `<div class="clozeTag" style="background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.25);color:var(--green)">★ MASTERED REVIEW</div>`;
    if (mode === "cloze") modeTagWrap.innerHTML += `<div class="clozeTag">CLOZE MODE</div>`;
    if (mode === "mc")    modeTagWrap.innerHTML += `<div class="mcTag">MULTIPLE CHOICE</div>`;
    if (!isCardMastered && (card.wrongCount||0) > 0) modeTagWrap.innerHTML += `<div class="clozeTag" style="background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.25);color:var(--red)">Wrong: ${card.wrongCount||0}</div>`;
    if (card.starred) modeTagWrap.innerHTML += `<div class="clozeTag" style="background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.25);color:var(--orange)">★ Starred</div>`;

    const completed = st.isRequeue ? (st.primaryQueue.length + st.reqIdx) : st.idx;
    const total = st.primaryQueue.length + (st.requeue.length || 0);
    const pct = total ? (completed/total) : 0;
    pfill.style.width = (pct*100).toFixed(1)+"%";
    ptext.textContent = `${completed}/${st.primaryQueue.length}`;

    reqBadge.style.display = st.isRequeue ? "inline-flex" : "none";
    if (st.isRequeue) reqBadge.textContent = `🔁 Requeue — ${st.requeue.length - st.reqIdx} left`;

    masterBadge.style.display = isCardMastered ? "inline-flex" : "none";
    deckName.textContent = DATA.decks[card.deckId]?.name || "";

    if (seenBadge){
      seenBadge.style.display = "inline-flex";
      seenBadge.textContent = `Seen ×${card.seenCount||0}`;
    }

    if (starBtn){
      starBtn.textContent = card.starred ? "★ Unstar" : "★ Star";
      starBtn.onclick = ()=>{
        updateData(d=>{
          const c = d.decks[card.deckId]?.cards?.find(x=>x.id===card.id);
          if (c) c.starred = !c.starred;
        });
        st.sess.starred += 1;
        refresh();
      };
    }

    if (card.frontImage){ frontImg.src = card.frontImage; frontImg.style.display="block"; }
    else frontImg.style.display="none";

    if (mode === "cloze"){
      const cl = makeCloze(card.back);
      qtext.textContent = cl.clozeText;
    } else {
      qtext.textContent = card.front;
    }

    if (mode === "mc" && st.phase === "question"){
      typedPane.style.display = "none";
      mcOptions.style.display = "flex";
      const deckCards = getDeckCards(card.deckId);
      st.mc = buildMCOptions(card, deckCards, 4);
      st.mcPicked = null;
      mcOptions.innerHTML = st.mc.options.map((opt,i)=>`
        <button class="mcBtn" data-mc="${i}">
          ${String.fromCharCode(65+i)}. ${escapeHTML(opt)}
        </button>
      `).join("");
      mcOptions.querySelectorAll("[data-mc]").forEach(btn=>{
        btn.onclick = ()=>{
          const pick = st.mc.options[Number(btn.dataset.mc)];
          st.mcPicked = pick;
          st.result = (normalizeStr(pick) === normalizeStr(st.mc.correct)) ? "correct" : "wrong";
          st.phase = "revealed";
          refresh();
        };
      });
    } else {
      mcOptions.style.display = "none";
      typedPane.style.display = (st.phase === "question") ? "block" : "none";
    }

    revealPane.style.display = (st.phase === "revealed") ? "flex" : "none";

    if (st.phase === "question" && mode !== "mc"){
      ansInput.placeholder = (mode==="cloze") ? "Fill in the blank…" : "Type your answer…";
      const isTypingHere = (document.activeElement === ansInput);
      if (!isTypingHere && ansInput.value !== (st.input || "")) ansInput.value = st.input || "";
      if (st.justAdvanced){
        st.justAdvanced = false;
        setTimeout(()=>ansInput.focus(), 0);
      }
    }

    if (st.phase === "revealed"){
      banner.className = "banner " + st.result;
      banner.textContent =
        st.result==="correct" ? "✓ Correct!" :
        st.result==="close"   ? "≈ Close — review full answer" :
                                "✗ Incorrect";
      const you = (mode==="mc") ? (st.mcPicked||"") : (st.input || (st.revealedBySpace?"(revealed)":""));
      youAns.textContent = you;
      youAns.style.color = (st.result==="wrong") ? "var(--red)" : "var(--text)";
      trueAns.textContent = card.back;
      if (card.backImage){ backImg.src = card.backImage; backImg.style.display="block"; }
      else backImg.style.display="none";
    }

    sc.textContent = st.sess.correct;
    sw.textContent = st.sess.wrong;
    srq.textContent = st.requeue.length;
    sst.textContent = st.sess.starred;

    if (sleft){
      const already = (DATA.stats[todayStr()]?.reviewed||0);
      sleft.textContent = Math.max(0, getDailyGoal() - already);
    }

    const sec = Math.floor((nowMs() - st.sessionStartedAt)/1000);
    stimer.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
  }

  function doCheckTyped(){
    const card = currentCard();
    if (!card) return;
    const mode = getModeForCard(card);
    if (mode === "mc") return;
    const input = ansInput.value.trim();
    if (!input) return;
    st.input = input;
    const ans = (mode === "cloze") ? makeCloze(card.back).answer : card.back;
    st.result = checkAnswer(input, ans);
    st.phase = "revealed";
    refresh();
  }

  function revealBySpace(){
    const card = currentCard();
    if (!card || st.phase === "revealed") return;
    st.input = "";
    st.revealedBySpace = true;
    st.result = "wrong";
    st.phase = "revealed";
    refresh();
  }

  function advance(){
    st.input = "";
    st.result = null;
    st.mc = null;
    st.mcPicked = null;
    st.phase = "question";
    st.revealedBySpace = false;
    st.active = null;
    st.justAdvanced = true;

    if (st.isRequeue){
      if (st.reqIdx + 1 < st.requeue.length) st.reqIdx++;
      else { st.isRequeue = false; st.idx = st.primaryQueue.length; }
    } else {
      if (st.idx + 1 < st.primaryQueue.length) st.idx++;
      else if (st.requeue.length){ st.isRequeue = true; st.reqIdx = 0; }
      else st.idx = st.primaryQueue.length;
    }

    pickNextActive();
    refresh();
  }

  function rateWithLabel(label, quality){
    const card = currentCard();
    if (!card) return;

    const ok = quality >= 3;
    const newCard = sm2(card, quality);
    newCard.seenCount = (card.seenCount || 0) + 1;
    newCard.lastSeenOn = todayStr();

    const wasWrong = (st.result === "wrong");
    if (wasWrong || label==="again" || label==="hard"){
      newCard.wrongCount = (card.wrongCount||0) + 1;
    } else if (quality >= 4){
      newCard.wrongCount = 0;
    } else {
      newCard.wrongCount = card.wrongCount || 0;
    }

    if (card.mastered && (label === "again" || label === "hard")){
      newCard.mastered = false;
      newCard.inWrongDeck = true;
    } else if (label === "again"){
      newCard.inWrongDeck = true;
    } else if (label === "mastered"){
      newCard.inWrongDeck = false;
      newCard.mastered = true;
    }

    const threshold = newCard.adaptiveThreshold ?? 3;
    newCard.adaptiveMode = ((newCard.wrongCount||0) >= threshold) ? decideAdaptiveMode(newCard) : "typed";

    updateData(d=>{
      const dk = d.decks[card.deckId];
      const ci = dk?.cards?.findIndex(c=>c.id===card.id);
      if (ci>=0) dk.cards[ci] = newCard;

      const t = st.today;
      if (!d.stats[t]) d.stats[t] = {reviewed:0,correct:0,wrong:0};
      d.stats[t].reviewed += 1;
      if (ok) d.stats[t].correct += 1; else d.stats[t].wrong += 1;
    });

    st.sess.total += 1;
    st.sess.correct += ok ? 1 : 0;
    st.sess.wrong += ok ? 0 : 1;

    if (st.isCustomMode){
      // Custom mode: Again/Hard = requeue (repeat later). Good/Easy/Mastered = done forever.
      if (label === "again" || label === "hard"){
        st.sess.requeues += 1;
        if (!st.requeue.some(c=>c.id===card.id)){
          st.requeue.push({...newCard, deckId: card.deckId});
        }
      }
      // No learning delays in custom mode
    } else {
      const delay = computeLearningDelayMs(label);
      if (delay > 0){
        st.learning.push({ card: {...newCard, deckId: card.deckId}, dueTimeMs: nowMs() + delay });
      }
      if (newCard.inWrongDeck && label !== "mastered"){
        st.sess.requeues += 1;
        if (!st.requeue.some(c=>c.id===newCard.id)){
          st.requeue.push({...newCard, deckId: card.deckId});
        }
      }
    }

    if (st.active?.source === "learning" && st.active.learningIndex >= 0){
      st.learning.splice(st.active.learningIndex, 1);
    }

    advance();
  }

  checkBtn.onclick = doCheckTyped;
  ansInput.oninput = (e)=>{ st.input = e.target.value; };
  ansInput.onkeydown = (e)=>{ if (e.key === "Enter") doCheckTyped(); };

  document.querySelectorAll("[data-rate]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.rate;
      if (id==="again")    rateWithLabel("again", 0);
      if (id==="hard")     rateWithLabel("hard",  1);
      if (id==="good")     rateWithLabel("good",  3);
      if (id==="easy")     rateWithLabel("easy",  4);
      if (id==="mastered") rateWithLabel("mastered", 5);
    };
  });

  window.__studyKeyHandler = (e)=>{
    if (SCREEN !== "study") return;
    if (e.target && (e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT")) return;

    const card = currentCard();
    if (!card) return;

    if (e.key.toLowerCase() === "s"){
      e.preventDefault();
      updateData(d=>{
        const c = d.decks[card.deckId]?.cards?.find(x=>x.id===card.id);
        if (c) c.starred = !c.starred;
      });
      st.sess.starred += 1;
      refresh();
      return;
    }

    if (e.code === "Space"){
      e.preventDefault();
      if (st.phase === "question") revealBySpace();
      return;
    }

    if (st.phase === "revealed"){
      if (e.key === "1") { e.preventDefault(); rateWithLabel("again", 0); return; }
      if (e.key === "2") { e.preventDefault(); rateWithLabel("hard", 1); return; }
      if (e.key === "3") { e.preventDefault(); rateWithLabel("good", 3); return; }
      if (e.key === "4") { e.preventDefault(); rateWithLabel("easy", 4); return; }
      if (e.key === "5") { e.preventDefault(); rateWithLabel("mastered", 5); return; }
    }
  };
  window.addEventListener("keydown", window.__studyKeyHandler);

  pickNextActive();
  window.__studyInterval = setInterval(()=>{ refresh(); }, 800);
  refresh();
}


/******************************************************************
 * IMPORT / EXPORT
 ******************************************************************/
function exportData(){
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  const date = todayStr();
  a.href     = url;
  a.download = `recall-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if (!parsed || typeof parsed !== "object" || !parsed.decks){
        alert("Invalid backup file — missing deck data.");
        return;
      }
      if (!confirm(`Import backup? This will MERGE with your current data.\n\nDecks in backup: ${Object.keys(parsed.decks||{}).length}\n\nExisting decks with the same ID will be overwritten. Continue?`)) return;
      updateData(d=>{
        for (const [id, deck] of Object.entries(parsed.decks||{})) d.decks[id] = deck;
        for (const [day, st] of Object.entries(parsed.stats||{})){
          if (!d.stats[day]){
            d.stats[day] = st;
          } else {
            d.stats[day].reviewed = Math.max(d.stats[day].reviewed||0, st.reviewed||0);
            d.stats[day].correct  = Math.max(d.stats[day].correct||0,  st.correct||0);
            d.stats[day].wrong    = Math.max(d.stats[day].wrong||0,    st.wrong||0);
          }
        }
        if (parsed.settings?.appStartDate){
          const cur = d.settings.appStartDate || todayStr();
          d.settings.appStartDate = parsed.settings.appStartDate < cur ? parsed.settings.appStartDate : cur;
        }
      });
      alert("Import successful! Your data has been merged.");
    }catch(err){
      alert("Failed to parse backup file: " + err.message);
    }
  };
  r.readAsText(file);
}

/******************************************************************
 * NAV + BOOT
 ******************************************************************/
function bindNav(){
  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.onclick = ()=> setScreen(btn.dataset.nav);
  });

  const resetAllBtn = document.getElementById("resetAllBtn");
  if (resetAllBtn) resetAllBtn.onclick = hardResetAll;

  const exportBtn = document.getElementById("exportBtn");
  if (exportBtn) exportBtn.onclick = exportData;

  const importFile = document.getElementById("importFile");
  if (importFile) importFile.onchange = (e)=>{ importData(e.target.files?.[0]); e.target.value=""; };

  const modeSel = document.getElementById("studyModeSel");
  if (modeSel) modeSel.onchange = ()=> updateData(d=>{ d.settings.studyMode = modeSel.value; });

  const strictSel = document.getElementById("strictSel");
  if (strictSel) strictSel.onchange = ()=> updateData(d=>{ d.settings.strictness = strictSel.value; });

  const saveGoal = document.getElementById("saveGoal");
  if (saveGoal){
    saveGoal.onclick = ()=>{
      const v = Number(document.getElementById("goalInput")?.value || DEFAULT_DAILY_GOAL);
      updateData(d=>{ d.settings.dailyGoal = Math.min(9999, Math.max(10, v)); });
    };
  }

  const saveMasteredGoal = document.getElementById("saveMasteredGoal");
  if (saveMasteredGoal){
    saveMasteredGoal.onclick = ()=>{
      const v = Number(document.getElementById("masteredGoalInput")?.value ?? 15);
      updateData(d=>{ d.settings.masteredReviewPerDay = Math.min(200, Math.max(0, v)); });
    };
  }

  const masteredHandlingSel = document.getElementById("masteredHandlingSel");
  if (masteredHandlingSel){
    // Set selected value after render
    masteredHandlingSel.value = DATA.settings?.masteredHandling || "mix";
    masteredHandlingSel.onchange = ()=> updateData(d=>{
      d.settings.masteredHandling = masteredHandlingSel.value;
    });
  }
}

setInterval(handleDayRollover, 30000);
render();
