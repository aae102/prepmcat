function studyHTML(){
  const today = todayStr();

  // Use custom queue if set, otherwise build daily queue
  let primaryQueue;
  const isCustomMode = !!(window.__customMode && window.__customQueue?.length);
  if (isCustomMode){
    primaryQueue = window.__customQueue;
  } else {
    const daily = buildDailyQueue(DATA.decks, getDailyGoal());
    primaryQueue = daily.queue;
  }

  if (!primaryQueue.length){
    return `
      <div class="studyWrap">
        <div class="done">
          <div class="ic">◈</div>
          <div class="t">Nothing due!</div>
          <div class="s">All cards up to date. See you tomorrow.</div>
          <button class="btnOutline" id="exitStudy">← Back to Dashboard</button>
        </div>
      </div>
    `;
  }

  // For custom mode: updateData() triggers render() on every card rating which would
  // reset idx back to 0 and replay cards. Preserve live session state across re-renders.
  if (isCustomMode && window.__study && window.__study.isCustomMode) {
    // Preserve ALL progress state — only the HTML shell re-renders around it
  } else {
    window.__study = {
      today,
      dayKey: today,
      primaryQueue,
      requeue: [],
      learning: [],
      idx: 0,
      isRequeue: false,
      reqIdx: 0,
      phase: "question",
      input: "",
      result: null,
      sess: {correct:0,wrong:0,total:0,requeues:0,starred:0},
      mc: null,
      mcPicked: null,
      revealedBySpace: false,
      active: null,
      justAdvanced: true,
      isCustomMode
    };
  }

  return `
    <div class="studyWrap">
      <div class="studyTop">
        <button class="btnOutline" id="exitStudy">← Exit</button>
        <div class="progressZone">
          <span id="reqBadge" class="reqBadge" style="display:none">🔁 Requeue</span>
          <span id="masterBadge" class="masterBadge" style="display:none">★ Mastered Review</span>
          ${isCustomMode ? `<span class="customBadge">⊕ Custom Study</span>` : ''}
          <div class="track" style="flex:1;min-width:240px"><div class="fill" id="pfill"></div></div>
          <span class="mono" id="ptext" style="font-size:12px;color:var(--muted);white-space:nowrap"></span>
        </div>
       <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <div style="font-size:12px;color:var(--muted);font-weight:900;white-space:nowrap" id="deckName"></div>
  <button class="btnSmall" id="editStudyCardBtn">Edit</button>
  <button class="btnSmall" id="starBtn">★ Star</button>
  <span class="tag purple" id="seenBadge" style="display:none"></span>
</div>
      </div>

      <div class="cardZone">
        <div id="modeTagWrap" style="display:flex;gap:8px;flex-wrap:wrap"></div>

        <div class="flash">
          <img id="frontImg" class="imgLarge" style="display:none" />
          <div class="q" id="qtext"></div>
          <div id="mcOptions" class="mcOptions" style="display:none"></div>
        </div>

        <div id="typedPane">
          <input class="ansInput" id="ansInput" placeholder="Type your answer…" autocomplete="off" spellcheck="false" />
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap">
            <span class="hint">Enter=check · Space=reveal · 1-5=rate · S=star</span>
            <button class="btnPrimary" id="checkBtn">Check →</button>
          </div>
        </div>

        <div id="revealPane" class="reveal" style="display:none">
          <div class="banner" id="banner"></div>
          <div class="compare">
            <div class="ansRow"><span class="ansLabel">You:</span><span id="youAns"></span></div>
            <div class="ansRow"><span class="ansLabel">Answer:</span><span style="color:var(--green)" id="trueAns"></span></div>
          </div>
          <img id="backImg" class="imgLarge" style="display:none" />
          <div class="rating">
            ${rateBtn("Again","~1m","var(--red)","again")}
            ${rateBtn("Hard","~2–3m","var(--orange)","hard")}
            ${rateBtn("Good","few d","#60a5fa","good")}
            ${rateBtn("Easy","week+","var(--green)","easy")}
            ${rateBtn("Mastered","retire","var(--purple)","mastered",true)}
          </div>
          <div class="hint" style="text-align:center">Again/Hard repeat soon · wrong-deck requeue until Mastered</div>
        </div>
      </div>

      <div class="studyFoot">
        <span style="color:var(--green);font-weight:900">✓ <span id="sc"></span></span>
        <span style="color:var(--red);font-weight:900">✗ <span id="sw"></span></span>
        <span style="color:var(--orange);font-weight:900">🔁 <span id="srq"></span> requeue</span>
        <span style="color:var(--orange);font-weight:900">★ <span id="sst"></span></span>
        ${isCustomMode
          ? `<span style="color:var(--cyan);font-weight:900">⊕ Custom · no limit</span>`
          : `<span style="color:var(--muted);font-weight:900"><span id="sleft"></span> left today</span>`}
        <span style="color:var(--purple);font-weight:900">⏱ <span id="stimer">00:00</span></span>
      </div>
    </div>
  `;
}

function rateBtn(label, sub, col, id, wide=false){
  return `
    <button class="rBtn" data-rate="${id}"
      style="flex:${wide?1.5:1}; border-color:${col}; color:${col}; background:rgba(255,255,255,0.05);">
      <span>${label}</span><span>${sub}</span>
    </button>
  `;
}

function bindStudy(){
  const exit = document.getElementById("exitStudy");
  if (exit) exit.onclick = ()=> setScreen("dashboard");

  const st = window.__study;
  if (!st) return;

  const qtext        = document.getElementById("qtext");
  const ansInput     = document.getElementById("ansInput");
  const checkBtn     = document.getElementById("checkBtn");
  const typedPane    = document.getElementById("typedPane");
  const revealPane   = document.getElementById("revealPane");
  const banner       = document.getElementById("banner");
  const youAns       = document.getElementById("youAns");
  const trueAns      = document.getElementById("trueAns");
  const reqBadge     = document.getElementById("reqBadge");
  const masterBadge  = document.getElementById("masterBadge");
  const pfill        = document.getElementById("pfill");
  const ptext        = document.getElementById("ptext");
  const deckName     = document.getElementById("deckName");
  const modeTagWrap  = document.getElementById("modeTagWrap");
  const mcOptions    = document.getElementById("mcOptions");
  const editStudyCardBtn = document.getElementById("editStudyCardBtn");
  const starBtn      = document.getElementById("starBtn");
  const seenBadge    = document.getElementById("seenBadge");
  const frontImg     = document.getElementById("frontImg");
  const backImg      = document.getElementById("backImg");
  const sc           = document.getElementById("sc");
  const sw           = document.getElementById("sw");
  const srq          = document.getElementById("srq");
  const sst          = document.getElementById("sst");
  const sleft        = document.getElementById("sleft");
  const stimer       = document.getElementById("stimer");

  st.sessionStartedAt = st.sessionStartedAt || nowMs();

  function getDeckCards(deckId){ return DATA.decks[deckId]?.cards || []; }

  function syncStudyCardEverywhere(updatedCard){
    if (!updatedCard) return;

    st.primaryQueue = (st.primaryQueue || []).map(c =>
      c.id === updatedCard.id ? {...c, ...updatedCard} : c
    );

    st.requeue = (st.requeue || []).map(c =>
      c.id === updatedCard.id ? {...c, ...updatedCard} : c
    );

    st.learning = (st.learning || []).map(x => ({
      ...x,
      card: x.card?.id === updatedCard.id ? {...x.card, ...updatedCard} : x.card
    }));

    if (st.active?.card?.id === updatedCard.id){
      st.active.card = {...st.active.card, ...updatedCard};
    }
  }

  function openStudyEditModal(card){
    if (!card) return;

    const existing = document.getElementById("studyEditModal");
    if (existing) existing.remove();

    let frontImg = card.frontImage || null;
    let backImg = card.backImage || null;

    const modal = document.createElement("div");
    modal.id = "studyEditModal";
    modal.className = "modalBack";
    modal.innerHTML = `
      <div class="modalCard">
        <div class="modalHead">
          <div class="modalTitle">Edit Card</div>
          <button class="btnSmall" id="closeStudyEdit">Close</button>
        </div>

        <div class="editGrid">
          <div class="editSection">
            <div class="tiny" style="font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)">Front</div>
            <textarea class="textarea" id="studyEditFront" rows="3" placeholder="Front text">${escapeHTML(htmlToText(card.front))}</textarea>

            <div class="tiny" style="margin-top:10px;color:var(--muted);margin-bottom:8px">
              Paste image, drag/drop, or upload
            </div>
            <div id="studyFrontPaste" class="upload" style="padding:14px" tabindex="0">Paste or drop front image here</div>
            <input type="file" id="studyFrontFile" accept="image/*" style="margin-top:10px" />
            <div id="studyFrontPreview" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"></div>
          </div>

          <div class="editSection">
            <div class="tiny" style="font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)">Back</div>
            <textarea class="textarea" id="studyEditBack" rows="3" placeholder="Back text">${escapeHTML(htmlToText(card.back))}</textarea>

            <div class="tiny" style="margin-top:10px;color:var(--muted);margin-bottom:8px">
              Paste image, drag/drop, or upload
            </div>
            <div id="studyBackPaste" class="upload" style="padding:14px" tabindex="0">Paste or drop back image here</div>
            <input type="file" id="studyBackFile" accept="image/*" style="margin-top:10px" />
            <div id="studyBackPreview" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"></div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px">
          <div class="tiny" style="color:var(--muted)">Tip: use **double asterisks** for bold</div>
          <button class="btnPrimary" id="saveStudyEdit">Save Changes</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);

    const close = ()=> modal.remove();

    const frontPreview = modal.querySelector("#studyFrontPreview");
    const backPreview = modal.querySelector("#studyBackPreview");
    const frontPaste = modal.querySelector("#studyFrontPaste");
    const backPaste = modal.querySelector("#studyBackPaste");

    function renderFrontPreview(){
      frontPreview.innerHTML = `
        ${frontImg ? `<img class="imgThumb" src="${frontImg}" />` : `<span class="tiny" style="color:var(--muted)">No image</span>`}
        <button class="btnSmall btnDanger" id="clearStudyFrontImg">Clear</button>
      `;
      frontPreview.querySelector("#clearStudyFrontImg").onclick = ()=>{
        frontImg = null;
        renderFrontPreview();
      };
    }

    function renderBackPreview(){
      backPreview.innerHTML = `
        ${backImg ? `<img class="imgThumb" src="${backImg}" />` : `<span class="tiny" style="color:var(--muted)">No image</span>`}
        <button class="btnSmall btnDanger" id="clearStudyBackImg">Clear</button>
      `;
      backPreview.querySelector("#clearStudyBackImg").onclick = ()=>{
        backImg = null;
        renderBackPreview();
      };
    }

    frontPaste.onclick = ()=> frontPaste.focus();
    backPaste.onclick = ()=> backPaste.focus();

    frontPaste.addEventListener("paste", async (e)=>{
      const b64 = await clipboardImageToBase64(e);
      if (b64){
        e.preventDefault();
        frontImg = b64;
        renderFrontPreview();
      }
    });

    backPaste.addEventListener("paste", async (e)=>{
      const b64 = await clipboardImageToBase64(e);
      if (b64){
        e.preventDefault();
        backImg = b64;
        renderBackPreview();
      }
    });

    [frontPaste, backPaste].forEach((el, idx)=>{
      el.addEventListener("dragover", (e)=> e.preventDefault());
      el.addEventListener("drop", async (e)=>{
        e.preventDefault();
        const file = e.dataTransfer.files?.[0];
        if (file && file.type.startsWith("image/")){
          const b64 = await fileToBase64(file);
          if (idx === 0){
            frontImg = b64;
            renderFrontPreview();
          } else {
            backImg = b64;
            renderBackPreview();
          }
        }
      });
    });

    modal.querySelector("#studyFrontFile").onchange = async (e)=>{
      const file = e.target.files?.[0];
      if (file){
        frontImg = await fileToBase64(file);
        renderFrontPreview();
      }
    };

    modal.querySelector("#studyBackFile").onchange = async (e)=>{
      const file = e.target.files?.[0];
      if (file){
        backImg = await fileToBase64(file);
        renderBackPreview();
      }
    };

    modal.querySelector("#closeStudyEdit").onclick = close;
    modal.addEventListener("click", (e)=>{
      if (e.target === modal) close();
    });

    modal.querySelector("#saveStudyEdit").onclick = ()=>{
      const newFront = modal.querySelector("#studyEditFront").value.trim();
      const newBack  = modal.querySelector("#studyEditBack").value.trim();

      if (!newFront && !frontImg){
        alert("Add front text or image.");
        return;
      }
      if (!newBack && !backImg){
        alert("Add back text or image.");
        return;
      }

      updateData(d=>{
        const liveCard = d.decks[card.deckId]?.cards?.find(x=>x.id===card.id);
        if (liveCard){
          liveCard.front = newFront;
          liveCard.back = newBack;
          liveCard.frontImage = frontImg;
          liveCard.backImage = backImg;
        }
      });

      syncStudyCardEverywhere({
        ...card,
        front: newFront,
        back: newBack,
        frontImage: frontImg,
        backImage: backImg
      });

      close();
      refresh();
    };

    renderFrontPreview();
    renderBackPreview();
  }

  function pickNextActive(){
    const li = st.learning.findIndex(x => x.dueTimeMs <= nowMs());
    if (li >= 0){
      st.active = { card: st.learning[li].card, source: "learning", learningIndex: li };
      return st.active.card;
    }
    if (st.isRequeue){
      const c = st.requeue[st.reqIdx];
      st.active = c ? { card: c, source: "requeue", learningIndex: -1 } : null;
      return c || null;
    }
    const c = st.primaryQueue[st.idx];
    st.active = c ? { card: c, source: "primary", learningIndex: -1 } : null;
    return c || null;
  }

  function currentCard(){
    if (st.active?.card) return st.active.card;
    return pickNextActive();
  }

  function getModeForCard(card){
    if (card.mastered) return "typed";
    let mode = card.adaptiveMode || "typed";
    const threshold = card.adaptiveThreshold ?? 3;
    const wrongs = card.wrongCount || 0;
    if (mode === "typed" && wrongs >= threshold) mode = decideAdaptiveMode(card);
    return mode;
  }

  function isMasteredCard(card){
    const liveCard = DATA.decks[card.deckId]?.cards?.find(c=>c.id===card.id);
    return (liveCard || card).mastered;
  }

  function refresh(){
    if (st.dayKey !== todayStr() && !st.isCustomMode){
      setScreen("dashboard");
      return;
    }

    const card = currentCard();
    if (!card){
      document.getElementById("root").innerHTML = `
        <div class="app" style="background:var(--bg)">
          <div class="studyWrap">
            <div class="done">
              <div class="ic">✦</div>
              <div class="t">${st.isCustomMode ? "Custom Session Done!" : "Session Complete!"}</div>
              <div class="s">${st.sess.total?Math.round((st.sess.correct/st.sess.total)*100):0}% accuracy · ${st.sess.requeues} requeue(s) · ${st.sess.starred} star(s)</div>
              ${st.isCustomMode ? `
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px">
                  <button class="btnPrimary" id="restartCustom">↺ Restart Same Cards</button>
                  <button class="btnOutline" id="backToCustom">⊕ Back to Custom Study</button>
                </div>
              ` : ''}
              <button class="btnOutline" id="exitStudy">← Back to Dashboard</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("exitStudy").onclick = ()=> setScreen("dashboard");
      if (st.isCustomMode){
        document.getElementById("backToCustom").onclick = ()=> setScreen("custom");
        document.getElementById("restartCustom").onclick = ()=>{
          // Restart with the same cards (re-shuffle if needed)
          window.__customQueue = CUSTOM_SHUFFLE
            ? shuffle(window.__customQueue || [])
            : (window.__customQueue || []);
          window.__customMode = true;
          setScreen("study");
        };
      }
      return;
    }

    const mode = getModeForCard(card);
    const isCardMastered = isMasteredCard(card);

    modeTagWrap.innerHTML = "";
    if (isCardMastered) modeTagWrap.innerHTML += `<div class="clozeTag" style="background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.25);color:var(--green)">★ MASTERED REVIEW</div>`;
    if (mode === "cloze") modeTagWrap.innerHTML += `<div class="clozeTag">CLOZE MODE</div>`;
    if (mode === "mc")    modeTagWrap.innerHTML += `<div class="mcTag">MULTIPLE CHOICE</div>`;
    if (!isCardMastered && (card.wrongCount||0) > 0) modeTagWrap.innerHTML += `<div class="clozeTag" style="background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.25);color:var(--red)">Wrong: ${card.wrongCount||0}</div>`;
    if (card.starred) modeTagWrap.innerHTML += `<div class="clozeTag" style="background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.25);color:var(--orange)">★ Starred</div>`;

    const completed = st.isRequeue ? (st.primaryQueue.length + st.reqIdx) : st.idx;
    const total = st.primaryQueue.length + (st.requeue.length || 0);
    const pct = total ? (completed/total) : 0;
    pfill.style.width = (pct*100).toFixed(1)+"%";
    ptext.textContent = `${completed}/${st.primaryQueue.length}`;

    reqBadge.style.display = st.isRequeue ? "inline-flex" : "none";
    if (st.isRequeue) reqBadge.textContent = `🔁 Requeue — ${st.requeue.length - st.reqIdx} left`;

    masterBadge.style.display = isCardMastered ? "inline-flex" : "none";
    deckName.textContent = DATA.decks[card.deckId]?.name || "";

    if (seenBadge){
      seenBadge.style.display = "inline-flex";
      seenBadge.textContent = `Seen ×${card.seenCount||0}`;
    }

    if (editStudyCardBtn){
      editStudyCardBtn.onclick = ()=> openStudyEditModal(card);
    }

    if (starBtn){
      starBtn.textContent = card.starred ? "★ Unstar" : "★ Star";
      starBtn.onclick = ()=>{
        updateData(d=>{
          const c = d.decks[card.deckId]?.cards?.find(x=>x.id===card.id);
          if (c) c.starred = !c.starred;
        });
        st.sess.starred += 1;
        refresh();
      };
    }

    if (card.frontImage){ frontImg.src = card.frontImage; frontImg.style.display="block"; }
    else frontImg.style.display="none";

 if (mode === "cloze"){
  if (card.importedCloze){
    qtext.innerHTML = formatCardHTML(card.front);
  } else {
    const cl = makeCloze(htmlToText(card.back));
    qtext.textContent = cl.clozeText;
  }
} else {
  qtext.innerHTML = formatCardHTML(card.front);
}

    if (mode === "mc" && st.phase === "question"){
      typedPane.style.display = "none";
      mcOptions.style.display = "flex";
      const deckCards = getDeckCards(card.deckId);
      st.mc = buildMCOptions(card, deckCards, 4);
      st.mcPicked = null;
      mcOptions.innerHTML = st.mc.options.map((opt,i)=>`
        <button class="mcBtn" data-mc="${i}">
          ${String.fromCharCode(65+i)}. ${escapeHTML(opt)}
        </button>
      `).join("");
      mcOptions.querySelectorAll("[data-mc]").forEach(btn=>{
        btn.onclick = ()=>{
          const pick = st.mc.options[Number(btn.dataset.mc)];
          st.mcPicked = pick;
          st.result = (normalizeStr(pick) === normalizeStr(st.mc.correct)) ? "correct" : "wrong";
          st.phase = "revealed";
          refresh();
        };
      });
    } else {
      mcOptions.style.display = "none";
      typedPane.style.display = (st.phase === "question") ? "block" : "none";
    }

    revealPane.style.display = (st.phase === "revealed") ? "flex" : "none";

    if (st.phase === "question" && mode !== "mc"){
      ansInput.placeholder = (mode==="cloze") ? "Fill in the blank…" : "Type your answer…";
      const isTypingHere = (document.activeElement === ansInput);
      if (!isTypingHere && ansInput.value !== (st.input || "")) ansInput.value = st.input || "";
      if (st.justAdvanced){
        st.justAdvanced = false;
        setTimeout(()=>ansInput.focus(), 0);
      }
    }

    if (st.phase === "revealed"){
      banner.className = "banner " + st.result;
      banner.textContent =
        st.result==="correct" ? "✓ Correct!" :
        st.result==="close"   ? "≈ Close — review full answer" :
                                "✗ Incorrect";
      const you = (mode==="mc") ? (st.mcPicked||"") : (st.input || (st.revealedBySpace?"(revealed)":""));
      youAns.textContent = you;
      youAns.style.color = (st.result==="wrong") ? "var(--red)" : "var(--text)";
      trueAns.innerHTML = formatCardHTML(card.back);
      if (card.backImage){ backImg.src = card.backImage; backImg.style.display="block"; }
      else backImg.style.display="none";
    }

    sc.textContent = st.sess.correct;
    sw.textContent = st.sess.wrong;
    srq.textContent = st.requeue.length;
    sst.textContent = st.sess.starred;

    if (sleft){
      const already = (DATA.stats[todayStr()]?.reviewed||0);
      sleft.textContent = Math.max(0, getDailyGoal() - already);
    }

    
    const sec = Math.floor((nowMs() - st.sessionStartedAt)/1000);
    stimer.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
  }

  function doCheckTyped(){
    const card = currentCard();
    if (!card) return;
    const mode = getModeForCard(card);
    if (mode === "mc") return;
    const input = ansInput.value.trim();
    if (!input) return;
    st.input = input;
    const ansText = htmlToText(card.back);
    const ans = (mode === "cloze" && !card.importedCloze)
      ? makeCloze(ansText).answer
      : ansText;
    st.result = checkAnswer(input, ans);
    st.phase = "revealed";
    refresh();
  }

  
  function revealBySpace(){
    const card = currentCard();
    if (!card || st.phase === "revealed") return;
    st.input = "";
    st.revealedBySpace = true;
    st.result = "wrong";
    st.phase = "revealed";
    refresh();
  }

  function advance(){
    st.input = "";
    st.result = null;
    st.mc = null;
    st.mcPicked = null;
    st.phase = "question";
    st.revealedBySpace = false;
    st.active = null;
    st.justAdvanced = true;

    if (st.isRequeue){
      if (st.reqIdx + 1 < st.requeue.length) st.reqIdx++;
      else { st.isRequeue = false; st.idx = st.primaryQueue.length; }
    } else {
      if (st.idx + 1 < st.primaryQueue.length) st.idx++;
      else if (st.requeue.length){ st.isRequeue = true; st.reqIdx = 0; }
      else st.idx = st.primaryQueue.length;
    }

    pickNextActive();
    refresh();
  }

  function rateWithLabel(label, quality){
    const card = currentCard();
    if (!card) return;

    const ok = quality >= 3;
    const newCard = sm2(card, quality);
    newCard.seenCount = (card.seenCount || 0) + 1;
    newCard.lastSeenOn = todayStr();

    const wasWrong = (st.result === "wrong");
    if (wasWrong || label==="again" || label==="hard"){
      newCard.wrongCount = (card.wrongCount||0) + 1;
    } else if (quality >= 4){
      newCard.wrongCount = 0;
    } else {
      newCard.wrongCount = card.wrongCount || 0;
    }

    if (card.mastered && (label === "again" || label === "hard")){
      newCard.mastered = false;
      newCard.inWrongDeck = true;
    } else if (label === "again"){
      newCard.inWrongDeck = true;
    } else if (label === "mastered"){
      newCard.inWrongDeck = false;
      newCard.mastered = true;
    }

    const threshold = newCard.adaptiveThreshold ?? 3;
    newCard.adaptiveMode = ((newCard.wrongCount||0) >= threshold) ? decideAdaptiveMode(newCard) : "typed";

    updateData(d=>{
      const dk = d.decks[card.deckId];
      const ci = dk?.cards?.findIndex(c=>c.id===card.id);
      if (ci>=0) dk.cards[ci] = newCard;

      const t = st.today;
      if (!d.stats[t]) d.stats[t] = {reviewed:0,correct:0,wrong:0};
      d.stats[t].reviewed += 1;
      if (ok) d.stats[t].correct += 1; else d.stats[t].wrong += 1;
    });

    st.sess.total += 1;
    st.sess.correct += ok ? 1 : 0;
    st.sess.wrong += ok ? 0 : 1;

    if (st.isCustomMode){
      // Custom mode: Again/Hard = requeue (repeat later). Good/Easy/Mastered = done forever.
      if (label === "again" || label === "hard"){
        st.sess.requeues += 1;
        if (!st.requeue.some(c=>c.id===card.id)){
          st.requeue.push({...newCard, deckId: card.deckId});
        }
      }
      // No learning delays in custom mode
    } else {
      const delay = computeLearningDelayMs(label);
      if (delay > 0){
        st.learning.push({ card: {...newCard, deckId: card.deckId}, dueTimeMs: nowMs() + delay });
      }
      if (newCard.inWrongDeck && label !== "mastered"){
        st.sess.requeues += 1;
        if (!st.requeue.some(c=>c.id===newCard.id)){
          st.requeue.push({...newCard, deckId: card.deckId});
        }
      }
    }

    if (st.active?.source === "learning" && st.active.learningIndex >= 0){
      st.learning.splice(st.active.learningIndex, 1);
    }

    advance();
  }

  checkBtn.onclick = doCheckTyped;
  ansInput.oninput = (e)=>{ st.input = e.target.value; };
  ansInput.onkeydown = (e)=>{ if (e.key === "Enter") doCheckTyped(); };

  document.querySelectorAll("[data-rate]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.rate;
      if (id==="again")    rateWithLabel("again", 0);
      if (id==="hard")     rateWithLabel("hard",  1);
      if (id==="good")     rateWithLabel("good",  3);
      if (id==="easy")     rateWithLabel("easy",  4);
      if (id==="mastered") rateWithLabel("mastered", 5);
    };
  });

  window.__studyKeyHandler = (e)=>{
    if (SCREEN !== "study") return;
    if (e.target && (e.target.tagName==="TEXTAREA" || e.target.tagName==="INPUT")) return;

    const card = currentCard();
    if (!card) return;

    if (e.key.toLowerCase() === "s"){
      e.preventDefault();
      updateData(d=>{
        const c = d.decks[card.deckId]?.cards?.find(x=>x.id===card.id);
        if (c) c.starred = !c.starred;
      });
      st.sess.starred += 1;
      refresh();
      return;
    }

    if (e.code === "Space"){
      e.preventDefault();
      if (st.phase === "question") revealBySpace();
      return;
    }

    if (st.phase === "revealed"){
      if (e.key === "1") { e.preventDefault(); rateWithLabel("again", 0); return; }
      if (e.key === "2") { e.preventDefault(); rateWithLabel("hard", 1); return; }
      if (e.key === "3") { e.preventDefault(); rateWithLabel("good", 3); return; }
      if (e.key === "4") { e.preventDefault(); rateWithLabel("easy", 4); return; }
      if (e.key === "5") { e.preventDefault(); rateWithLabel("mastered", 5); return; }
    }
  };
  window.addEventListener("keydown", window.__studyKeyHandler);

  pickNextActive();
  // Only update the timer text — no full re-render every tick
  window.__studyInterval = setInterval(()=>{
    const timerEl = document.getElementById("stimer");
    if (timerEl && st.sessionStartedAt){
      const sec = Math.floor((nowMs() - st.sessionStartedAt)/1000);
      timerEl.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
    }
    // Also drain learning queue when cards become due
    if (st && st.learning?.length){
      const hasDue = st.learning.some(x => x.dueTimeMs <= nowMs());
      if (hasDue) refresh();
    }
  }, 1000);
  refresh();
}


/******************************************************************
 * IMPORT / EXPORT
 ******************************************************************/
function exportData(){
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  const date = todayStr();
  a.href     = url;
  a.download = `recall-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function autoBackupToLocalStorage(){
  try{
    localStorage.setItem(BACKUP_KEY, JSON.stringify(DATA));
    console.log("Daily backup saved silently to localStorage");
  }catch(err){
    console.error("Auto backup failed:", err);
  }
}

function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if (!parsed || typeof parsed !== "object" || !parsed.decks){
        alert("Invalid backup file — missing deck data.");
        return;
      }
      if (!confirm(`Import backup? This will MERGE with your current data.\n\nDecks in backup: ${Object.keys(parsed.decks||{}).length}\n\nExisting decks with the same ID will be overwritten. Continue?`)) return;
      updateData(d=>{
        for (const [id, deck] of Object.entries(parsed.decks||{})) d.decks[id] = deck;
        for (const [day, st] of Object.entries(parsed.stats||{})){
          if (!d.stats[day]){
            d.stats[day] = st;
          } else {
            d.stats[day].reviewed = Math.max(d.stats[day].reviewed||0, st.reviewed||0);
            d.stats[day].correct  = Math.max(d.stats[day].correct||0,  st.correct||0);
            d.stats[day].wrong    = Math.max(d.stats[day].wrong||0,    st.wrong||0);
          }
        }
      if (parsed.settings){
  d.settings = {
    ...d.settings,
    ...parsed.settings,
    appStartDate: parsed.settings.appStartDate
      ? ((d.settings.appStartDate && d.settings.appStartDate < parsed.settings.appStartDate)
          ? d.settings.appStartDate
          : parsed.settings.appStartDate)
      : d.settings.appStartDate
  };
}
      });
      alert("Import successful! Your data has been merged.");
    }catch(err){
      alert("Failed to parse backup file: " + err.message);
    }
  };
  r.readAsText(file);
}

/******************************************************************
 * NAV + BOOT
 ******************************************************************/
function bindNav(){
  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.onclick = ()=> setScreen(btn.dataset.nav);
  });

  const resetAllBtn = document.getElementById("resetAllBtn");
  if (resetAllBtn) resetAllBtn.onclick = hardResetAll;

const exportBtn = document.getElementById("exportBtn");
if (exportBtn) exportBtn.onclick = exportData;

const restoreBackupBtn = document.getElementById("restoreBackupBtn");
if (restoreBackupBtn){
  restoreBackupBtn.onclick = ()=>{
    const backupRaw = localStorage.getItem(BACKUP_KEY);
    if (!backupRaw){
      alert("No backup found.");
      return;
    }
    if (!confirm("Restore the last local backup? This will replace the current in-browser data.")) return;

    try{
      const parsed = JSON.parse(backupRaw);
      DATA = normalizeData(parsed);
      saveData(DATA);
      render();
      alert("Backup restored.");
    }catch(err){
      alert("Backup restore failed: " + err.message);
    }
  };
}

const importFile = document.getElementById("importFile");
if (importFile) importFile.onchange = (e)=>{ importData(e.target.files?.[0]); e.target.value=""; };

  const modeSel = document.getElementById("studyModeSel");
  if (modeSel) modeSel.onchange = ()=> updateData(d=>{ d.settings.studyMode = modeSel.value; });

  const strictSel = document.getElementById("strictSel");
  if (strictSel) strictSel.onchange = ()=> updateData(d=>{ d.settings.strictness = strictSel.value; });

  const saveGoal = document.getElementById("saveGoal");
  if (saveGoal){
    saveGoal.onclick = ()=>{
      const v = Number(document.getElementById("goalInput")?.value || DEFAULT_DAILY_GOAL);
      updateData(d=>{ d.settings.dailyGoal = Math.min(9999, Math.max(10, v)); });
    };
  }

  const saveMasteredGoal = document.getElementById("saveMasteredGoal");
  if (saveMasteredGoal){
    saveMasteredGoal.onclick = ()=>{
      const v = Number(document.getElementById("masteredGoalInput")?.value ?? 15);
      updateData(d=>{ d.settings.masteredReviewPerDay = Math.min(200, Math.max(0, v)); });
    };
  }

  const masteredHandlingSel = document.getElementById("masteredHandlingSel");
  if (masteredHandlingSel){
    // Set selected value after render
    masteredHandlingSel.value = DATA.settings?.masteredHandling || "mix";
    masteredHandlingSel.onchange = ()=> updateData(d=>{
      d.settings.masteredHandling = masteredHandlingSel.value;
    });
  }
}

setInterval(handleDayRollover, 300000); // check every 5 min instead of 30s
render();
</script>
