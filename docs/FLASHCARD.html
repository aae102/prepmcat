<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RECALL — Smart Flashcards</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.20.3/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <style>
    :root{
      --bg:#0a0b0f; --panel:#111318; --panel2:#181c24; --border:#1e2330;
      --text:#e2e8f0; --muted:#94a3b8; --muted2:#4a5568;
      --purple:#818cf8; --green:#4ade80; --orange:#fb923c; --red:#f87171; --cyan:#22d3ee;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','Helvetica Neue',sans-serif}
    button{cursor:pointer}
    button:hover{opacity:.93}
    button:active{transform:scale(.985)}
    input,textarea,select{color:var(--text)}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple)!important;box-shadow:0 0 0 3px rgba(129,140,248,.07)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
    .mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px)}
    .mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:4px 2px;cursor:pointer}
    .mobile-nav button.active{color:var(--purple)}
    .mobile-nav button .micon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
    .mobile-nav button.active .micon{background:rgba(129,140,248,.15)}
    @media(max-width:768px){
      .sidebar{display:none !important}
      .mobile-nav{display:flex !important}
      .app{display:block !important}
      .main{padding:14px 12px 90px;width:100% !important;max-width:100vw;overflow-x:hidden}
      .studyWrap{padding:12px 10px}
      .flash{padding:20px 12px;min-height:130px}
      .q{font-size:16px}
      .split{flex-direction:column}
      .left{width:100%}
      .grid{grid-template-columns:1fr}
      .rating{flex-wrap:wrap}
      .rBtn{min-width:calc(50% - 4px)}
      .done{padding:24px 14px}
      .studyTop{gap:8px}
      .row{flex-wrap:wrap}
      .stat{min-width:calc(50% - 5px)}
      .progressCard .row{flex-direction:column}
      .card{width:100%}
    }

    .app{display:flex;min-height:100vh}
    .sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}
    .logo{display:flex;align-items:center;gap:10px}
    .logo .mark{color:var(--purple);font-size:22px}
    .logo .word{font-weight:800;letter-spacing:.15em;font-size:14px}
    .nav{display:flex;flex-direction:column;gap:6px}
    .nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:var(--muted);font-size:13px;text-align:left}
    .nav button.active{background:rgba(129,140,248,.13);color:var(--purple)}

    .main{flex:1;padding:28px 34px;overflow:auto}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
    .greeting{font-size:26px;font-weight:700;font-family:'DM Serif Display',Georgia,serif}
    .date{font-size:13px;color:var(--muted);margin-top:4px}
    .tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;font-size:13px;border:1px solid rgba(255,255,255,.08)}
    .tag.orange{color:var(--orange);background:rgba(251,146,60,.13);border-color:rgba(251,146,60,.25)}
    .tag.green{color:var(--green);background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.25)}
    .tag.purple{color:var(--purple);background:rgba(129,140,248,.12);border-color:rgba(129,140,248,.25)}
    .tag.cyan{color:var(--cyan);background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.25)}
    .btnOutline{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:9px;font-size:13px}
    .btnSmall{padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:800}
    .btnDanger{color:var(--red);border-color:rgba(248,113,113,.28)}
    .btnPrimary{background:var(--purple);border:none;border-radius:10px;color:#fff;font-weight:900;padding:10px 18px}
    .section{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--muted2);text-transform:uppercase;margin:22px 0 12px}

    .progressCard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:8px}
    .track{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
    .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--purple),#a78bfa);border-radius:99px;transition:width .35s}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:16px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
    .cardTop{display:flex;justify-content:space-between;align-items:flex-start}
    .cardName{font-size:15px;font-weight:900}
    .pct{font-size:16px;font-weight:900;font-family:'IBM Plex Mono',monospace;color:var(--purple)}
    .meta{font-size:12px;color:var(--muted);margin-top:4px}
    .bar{height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0}
    .bar>div{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:99px;transition:width .35s}
    .bigBtn{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--purple),#a78bfa);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:900;margin-top:12px}

    .row{display:flex;gap:10px;flex-wrap:wrap}
    .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center;flex:1;min-width:120px}
    .stat .v{font-size:22px;font-weight:900;font-family:'IBM Plex Mono',monospace}
    .stat .l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.07em}

    .box{border-radius:11px;padding:12px 14px;font-size:13px;border:1px solid var(--border);background:var(--panel)}
    .box.err{border-color:rgba(248,113,113,.25);background:rgba(220,38,38,.13);color:var(--red)}
    .box.ok{border-color:rgba(74,222,128,.25);background:rgba(22,163,74,.13);color:var(--green)}
    .note{font-size:11px;color:var(--muted2);margin-top:6px}

    .input,.textarea{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:11px 14px;font-size:14px}
    .textarea{resize:vertical;font-size:13px}
    .modeRow{display:flex;gap:8px}
    .modeBtn{flex:1;padding:9px 12px;background:var(--panel);border:1px solid var(--border);border-radius:11px;color:var(--muted);font-size:13px;font-weight:900}
    .modeBtn.active{background:rgba(129,140,248,.10);border-color:rgba(129,140,248,.27);color:var(--purple)}
    .upload{background:var(--panel);border:1px dashed var(--border);border-radius:12px;padding:26px 18px;text-align:center;cursor:pointer;font-size:14px}

    .split{display:flex;gap:18px;min-height:70vh}
    .left{width:260px;display:flex;flex-direction:column;gap:8px}
    .deckItem{padding:12px 14px;border-radius:11px;cursor:pointer;border:1px solid var(--border);background:var(--panel)}
    .deckItem.active{background:rgba(129,140,248,.10);border-color:rgba(129,140,248,.27)}
    .right{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;overflow:auto}
    .filters{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
    .pill{padding:6px 12px;background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px;font-weight:900}
    .pill.active{background:rgba(129,140,248,.10);border-color:rgba(129,140,248,.27);color:var(--purple)}
    .list{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
    .rowCard{display:flex;gap:10px;padding:10px 11px;background:var(--panel2);border-radius:11px;border:1px solid var(--border);align-items:flex-start}
    .mono{font-family:'IBM Plex Mono',monospace}
    .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tiny{font-size:11px;color:var(--muted2)}
    .imgThumb{max-width:78px;max-height:52px;border-radius:8px;border:1px solid rgba(255,255,255,.10);object-fit:cover}

    .calWrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
    .calGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
    .calLabel{font-size:10px;color:var(--muted2);text-align:center;font-weight:900;text-transform:uppercase;padding-bottom:4px}
    .calDay{aspect-ratio:1;border-radius:9px;border:1px solid transparent;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
    .calDay.hit{background:rgba(74,222,128,.15);color:var(--green)}
    .calDay.partial{background:rgba(251,146,60,.15);color:var(--orange)}
    .calDay.missed{background:rgba(248,113,113,.15);color:var(--red)}
    .calDay.nodata{color:var(--muted2)}
    .calDay.today{border-color:var(--purple)}
    .calDay.empty{visibility:hidden}

    .studyWrap{max-width:820px;margin:0 auto;padding:22px 24px;width:100%;display:flex;flex-direction:column;min-height:100vh}
    .studyTop{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .progressZone{flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .reqBadge{font-size:12px;color:var(--orange);background:rgba(217,119,6,.10);border:1px solid rgba(251,146,60,.25);padding:3px 10px;border-radius:999px;font-weight:900}
    .masterBadge{font-size:12px;color:var(--green);background:rgba(74,222,128,.10);border:1px solid rgba(74,222,128,.25);padding:3px 10px;border-radius:999px;font-weight:900}
    .customBadge{font-size:12px;color:var(--cyan);background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.25);padding:3px 10px;border-radius:999px;font-weight:900}
    .cardZone{flex:1;display:flex;flex-direction:column;gap:14px}
    .clozeTag{align-self:flex-start;background:rgba(251,146,60,.07);border:1px solid rgba(251,146,60,.25);color:var(--orange);
      padding:6px 12px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.05em}
    .mcTag{align-self:flex-start;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);color:var(--cyan);
      padding:6px 12px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.05em}
    .flash{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:30px 22px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 0 50px rgba(129,140,248,.10)}
    .q{font-size:20px;line-height:1.55;text-align:center;font-weight:650;font-family:'DM Serif Display',Georgia,serif}
    .imgLarge{max-width:100%;max-height:240px;border-radius:12px;border:1px solid rgba(255,255,255,.10);object-fit:contain}
    .ansInput{background:var(--panel2);border:2px solid var(--border);border-radius:12px;padding:14px 16px;font-size:16px;font-family:'IBM Plex Mono',monospace;width:100%}
    .hint{font-size:12px;color:var(--muted2)}
    .reveal{display:flex;flex-direction:column;gap:12px}
    .banner{padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.1);font-weight:900;font-size:15px;text-align:center}
    .banner.correct{border-color:rgba(74,222,128,.35);background:rgba(22,163,74,.20);color:var(--green)}
    .banner.close{border-color:rgba(251,146,60,.35);background:rgba(217,119,6,.18);color:var(--orange)}
    .banner.wrong{border-color:rgba(248,113,113,.35);background:rgba(220,38,38,.20);color:var(--red)}
    .compare{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
    .ansRow{display:flex;gap:10px;font-size:14px;align-items:flex-start}
    .ansLabel{color:var(--muted2);min-width:70px;flex-shrink:0;font-weight:900}
    .rating{display:flex;gap:8px;flex-wrap:wrap}
    .rBtn{flex:1;min-width:118px;padding:12px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,0.04);font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
    .rBtn span:last-child{opacity:.55;font-size:10px}
    .studyFoot{display:flex;gap:14px;justify-content:center;padding:14px 0;font-size:13px;border-top:1px solid var(--border);margin-top:14px;flex-wrap:wrap}
    .mcOptions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:10px}
    .mcBtn{width:100%;text-align:left;padding:12px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-weight:900}
    .mcBtn:hover{border-color:rgba(129,140,248,.35)}
    .done{max-width:520px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:40px 34px;text-align:center}
    .done .ic{font-size:42px;color:var(--purple);margin-bottom:14px}
    .done .t{font-size:24px;font-weight:900;font-family:'DM Serif Display',Georgia,serif;margin-bottom:8px}
    .done .s{color:var(--muted);margin-bottom:22px;line-height:1.6;font-size:14px}

    /* ── Custom Study ── */
    .customCard{
      display:flex;gap:12px;padding:11px 13px;
      background:var(--panel2);border-radius:11px;
      border:1px solid var(--border);
      align-items:flex-start;cursor:pointer;
      transition:border-color .15s,background .15s;
    }
    .customCard:hover{border-color:rgba(129,140,248,.25)}
    .customCard.selected{
      background:rgba(129,140,248,.07);
      border-color:rgba(129,140,248,.35);
    }
    .customCard input[type=checkbox]{
      width:16px;height:16px;flex-shrink:0;margin-top:2px;
      accent-color:var(--purple);cursor:pointer;
    }
    .customFilters{
      display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
      background:var(--panel);border:1px solid var(--border);
      border-radius:14px;padding:16px 18px;margin-bottom:14px;
    }
    .customFilterGroup{display:flex;flex-direction:column;gap:8px}
    .customFilterLabel{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
    .pillRow{display:flex;gap:6px;flex-wrap:wrap}
    .selectionBar{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      padding:12px 16px;background:var(--panel);
      border:1px solid var(--border);border-radius:12px;
      margin-bottom:12px;
    }
    .customListWrap{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 420px);overflow-y:auto;min-height:200px}
    .deckGroupHeader{
      display:flex;align-items:center;gap:10px;
      padding:8px 13px;margin-top:8px;
      border-radius:9px;
      background:rgba(129,140,248,.05);
      border:1px solid rgba(129,140,248,.15);
      font-size:12px;font-weight:900;color:var(--purple);
      cursor:pointer;
      user-select:none;
    }
    .deckGroupHeader:hover{background:rgba(129,140,248,.10)}
    .deckGroupHeader .selectDeckBtn{
      margin-left:auto;
      font-size:11px;padding:3px 8px;
      background:rgba(129,140,248,.1);
      border:1px solid rgba(129,140,248,.25);
      border-radius:6px;color:var(--purple);
      font-weight:900;
    }
    .startCustomBtn{
      width:100%;padding:16px 0;
      background:linear-gradient(135deg,var(--cyan),#0ea5e9);
      border:none;border-radius:12px;
      color:#0a0b0f;font-size:15px;font-weight:900;
      margin-top:16px;
      transition:opacity .2s;
    }
    .startCustomBtn:disabled{opacity:.35;cursor:default}

        .modalBack{
      position:fixed; inset:0; background:rgba(0,0,0,.6);
      display:flex; align-items:center; justify-content:center;
      padding:18px; z-index:300;
    }
    .modalCard{
      width:min(760px,100%); max-height:90vh; overflow:auto;
      background:var(--panel); border:1px solid var(--border);
      border-radius:18px; padding:18px;
      box-shadow:0 20px 80px rgba(0,0,0,.45);
    }
    .modalHead{
      display:flex; justify-content:space-between; align-items:center;
      gap:10px; flex-wrap:wrap; margin-bottom:12px;
    }
    .modalTitle{
      font-size:18px; font-weight:900;
    }
    .editGrid{
      display:grid; gap:12px;
    }
    .editSection{
      background:var(--panel2);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

<script>
/******************************************************************
 * STORAGE + SETTINGS
 ******************************************************************/
const STORAGE_KEY = "recall_full_final_v1";
const BACKUP_KEY = STORAGE_KEY + "_backup";
const LAST_SAVED_KEY = STORAGE_KEY + "_lastSavedAt";
const DEFAULT_DAILY_GOAL = 150;

const DATA_VERSION = 1;

const INIT = {
  version: DATA_VERSION,
  decks:{},
  stats:{},
 settings:{
  appStartDate:null,
  mutedDecksByDay:{},
  dailyGoal: DEFAULT_DAILY_GOAL,
  studyMode: "mixed_random",
  strictness: "balanced",
  masteredReviewPerDay: 15,
  masteredHandling: "mix",
  perDeckNewQuota: {},
  perDeckReviewQuota: {}
}
};

let DATA = loadData();
let SCREEN = "dashboard";
let CURRENT_DAY = todayStr();

// ── Custom Study State ────────────────────────────────────────
let CUSTOM_SELECTED = new Set();   // card IDs currently checked
let CUSTOM_FILTER_DECK   = "all";  // "all" or a deckId
let CUSTOM_FILTER_STATUS = "all";  // all|unseen|due|mastered|wrong|starred
let CUSTOM_SHUFFLE       = true;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return normalizeData(structuredClone(INIT));

    const parsed = JSON.parse(raw);
    return normalizeData(parsed);
  }catch(err){
    console.error("Primary data load failed:", err);

    try{
      const backupRaw = localStorage.getItem(BACKUP_KEY);
      if (backupRaw){
        const backupParsed = JSON.parse(backupRaw);
        return normalizeData(backupParsed);
      }
    }catch(backupErr){
      console.error("Backup load failed:", backupErr);
    }

    return normalizeData(structuredClone(INIT));
  }
}
function saveData(d){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    localStorage.setItem(LAST_SAVED_KEY, new Date().toISOString());
  }catch(err){
    console.error("Save failed:", err);
  }
}
function updateData(mutator){
  const next = structuredClone(DATA);
  mutator(next);
  normalizeData(next);
  DATA = next;
  saveData(DATA);
  render();
}
function hardResetAll(){
  if (!confirm("Fresh start will wipe ALL decks + stats in this app. Continue?")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch{}
  DATA = normalizeData(structuredClone(INIT));
  saveData(DATA);
  SCREEN = "dashboard";
  CURRENT_DAY = todayStr();
  render();
}

function setScreen(s){
  if (window.__studyInterval){
    clearInterval(window.__studyInterval);
    window.__studyInterval = null;
  }
  if (window.__studyKeyHandler){
    window.removeEventListener("keydown", window.__studyKeyHandler);
    window.__studyKeyHandler = null;
  }
  // Clear custom queue when leaving study
  if (s !== "study"){
    window.__customQueue = null;
    window.__customMode  = false;
  }
  SCREEN = s;
  render();
}

function handleDayRollover(){
  const nowDay = todayStr();
  if (nowDay === CURRENT_DAY) return;
  CURRENT_DAY = nowDay;
  if (SCREEN === "study"){
    alert("New day detected. Study queue refreshed at midnight.");
    setScreen("dashboard");
    return;
  }
  render();
}

/******************************************************************
 * DATE + DUE
 ******************************************************************/
function localDateStr(input=new Date()){
  const d = (input instanceof Date) ? input : new Date(input);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayStr(){ return localDateStr(new Date()); }
function nowMs(){ return Date.now(); }

function normalizeData(d){
  if (!d || typeof d !== "object") d = structuredClone(INIT);

  if (!d.version) d.version = DATA_VERSION;

  if (!d.settings) d.settings = structuredClone(INIT.settings);
  if (!d.settings.appStartDate) d.settings.appStartDate = todayStr();
  if (!d.settings.mutedDecksByDay) d.settings.mutedDecksByDay = {};
  if (!d.settings.dailyGoal) d.settings.dailyGoal = DEFAULT_DAILY_GOAL;
  if (!d.settings.studyMode) d.settings.studyMode = "mixed_random";
  if (!d.settings.strictness) d.settings.strictness = "balanced";
  if (d.settings.masteredReviewPerDay == null) d.settings.masteredReviewPerDay = 15;
  if (!d.settings.masteredHandling) d.settings.masteredHandling = "mix";
  if (!d.settings.perDeckNewQuota) d.settings.perDeckNewQuota = {};
  if (!d.settings.perDeckReviewQuota) d.settings.perDeckReviewQuota = {};

  if (!d.decks || typeof d.decks !== "object") d.decks = {};
  if (!d.stats || typeof d.stats !== "object") d.stats = {};

  for (const deck of Object.values(d.decks)){
    if (!deck.studyOrder) deck.studyOrder = "random";
    if (!Array.isArray(deck.cards)) deck.cards = [];
    deck.cards = deck.cards.map(c=>normalizeCard(c));
  }

  return d;
}

function getDailyGoal(){ return Number(DATA.settings?.dailyGoal || DEFAULT_DAILY_GOAL); }
function getMasteredReviewPerDay(){ return Number(DATA.settings?.masteredReviewPerDay ?? 15); }
function getMutedToday(){ return DATA.settings?.mutedDecksByDay?.[todayStr()] || []; }
function isDeckMuted(deckId){ return getMutedToday().includes(deckId); }

function isDue(card){
  return !card.mastered && (!card.nextReview || localDateStr(card.nextReview) <= todayStr());
}
function isMasteredDue(card){
  return card.mastered && (!card.nextReview || localDateStr(card.nextReview) <= todayStr());
}

/******************************************************************
 * SM-2
 ******************************************************************/
function sm2(card, quality){
  let interval = Number(card.interval ?? 0);
  let easeFactor = Number(card.easeFactor ?? 2.5);
  let repetitions = Number(card.repetitions ?? 0);

  // quality:
  // 0 = Again
  // 1 = Hard
  // 3 = Good
  // 4 = Easy
  // 5 = Mastered

  if (quality === 0){ // Again
    repetitions = 0;
    interval = 1;
    easeFactor = Math.max(1.3, easeFactor - 0.2);
  } else if (quality === 1){ // Hard
    repetitions = Math.max(0, repetitions);
    interval = Math.max(2, Math.round(interval * 1.2) || 2);
    easeFactor = Math.max(1.3, easeFactor - 0.15);
  } else if (quality === 3){ // Good
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 3;
    else if (repetitions === 2) interval = 7;
    else interval = Math.max(interval + 1, Math.round(interval * easeFactor));
    repetitions++;
  } else if (quality === 4){ // Easy
    if (repetitions === 0) interval = 4;
    else if (repetitions === 1) interval = 8;
    else if (repetitions === 2) interval = 14;
    else interval = Math.max(interval + 2, Math.round(interval * (easeFactor + 0.25)));
    repetitions++;
    easeFactor = Math.max(1.3, easeFactor + 0.15);
  } else if (quality === 5){ // Mastered
    repetitions = Math.max(3, repetitions + 1);
    interval = Math.max(14, Math.round(Math.max(interval, 7) * (easeFactor + 0.5)));
    easeFactor = Math.max(1.3, easeFactor + 0.2);
  }

  const nr = new Date();
  nr.setDate(nr.getDate() + interval);

  const mastered = quality === 5 ? true : (quality < 3 ? false : card.mastered);

  return {
    ...card,
    interval,
    easeFactor,
    repetitions,
    nextReview: nr.toISOString(),
    mastered
  };
}

/******************************************************************
 * ANSWER MATCHING
 ******************************************************************/
function normalizeStr(s){
  return (s||"")
    .toLowerCase()
    .replace(/[^a-z0-9\s\+\-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function levenshtein(a,b){
  const dp = Array.from({length:a.length+1}, (_,i)=>Array.from({length:b.length+1},(_,j)=> i===0?j : j===0?i : 0));
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}
function splitAlternatives(s){
  const raw = String(s||"").trim();
  if (!raw) return [];
  return raw.split(/\s*(?:\/|;|\bor\b|,)\s*/gi).map(x=>x.trim()).filter(Boolean);
}
function getAnswerVariants(answer){
  const raw = String(answer||"");
  const variants = new Set();
  const push = (v)=>{ const n = normalizeStr(v); if (n) variants.add(n); };
  const baseForms = [
    raw,
    raw.replace(/^\s*(answer|ans|a)\s*[:.)-]?\s*/i, ""),
    raw.replace(/\([^)]*\)/g, " "),
    raw.replace(/\[[^\]]*\]/g, " "),
    raw.replace(/^\s*(answer|ans|a)\s*[:.)-]?\s*/i, "").replace(/\([^)]*\)|\[[^\]]*\]/g, " "),
  ];
  for (const bf of baseForms){
    push(bf);
    for (const alt of splitAlternatives(bf)) push(alt);
  }
  const base = Array.from(variants);
  for (const v of base) push(v.replace(/^\s*(the|an?)\s+/, ""));
  return Array.from(variants);
}
function tokenize(s){ return normalizeStr(s).split(" ").filter(Boolean); }
function jaccard(aTokens, bTokens){
  const A = new Set(aTokens); const B = new Set(bTokens);
  if (!A.size || !B.size) return 0;
  let inter = 0; for (const t of A) if (B.has(t)) inter++;
  const union = A.size + B.size - inter;
  return union ? inter/union : 0;
}
function normalizedEditSim(a, b){
  if (!a || !b) return 0;
  const d = levenshtein(a,b);
  const m = Math.max(a.length, b.length);
  return m ? (1 - d/m) : 0;
}
function getStrictnessThresholds(){
  const s = DATA.settings?.strictness || "balanced";
  if (s === "lenient") return {correct:0.82, close:0.66};
  if (s === "strict")  return {correct:0.90, close:0.76};
  return {correct:0.86, close:0.72};
}
function checkAnswer(input, answer){
  const inp = normalizeStr(input);
  if (!inp) return "wrong";
  const variants = getAnswerVariants(answer);
  if (!variants.length) return "wrong";
  for (const v of variants){
    if (inp === v) return "correct";
    if (inp.includes(v) && v.length >= 3) return "correct";
    if (v.includes(inp) && inp.length >= Math.floor(v.length * 0.6)) return "correct";
  }
  let best = 0;
  for (const v of variants){
    const aTok = tokenize(inp);
    const bTok = tokenize(v);
    const jac = jaccard(aTok, bTok);
    const ed  = normalizedEditSim(inp, v);
    const w = (bTok.length >= 2) ? (0.7*jac + 0.3*ed) : (0.45*jac + 0.55*ed);
    if (w > best) best = w;
  }
  const th = getStrictnessThresholds();
  if (best >= th.correct) return "correct";
  if (best >= th.close) return "close";
  return "wrong";
}

/******************************************************************
 * CLOZE + MC
 ******************************************************************/
function makeCloze(text){
  const words = (text||"").split(" ");
  if (words.length < 3) return {clozeText:"___", answer:text||""};
  let idx=1, max=0;
  words.forEach((w,i)=>{
    const l = w.replace(/[^a-z]/gi,"").length;
    if (l>max && i>0){ max=l; idx=i; }
  });
  return {clozeText: words.map((w,i)=> i===idx ? "___" : w).join(" "), answer: words[idx]};
}
function decideAdaptiveMode(card){
  return card.adaptivePref || "cloze";
}
function buildMCOptions(currentCard, deckCards, n=4){
  const correct = (currentCard.back||"").trim();
  const pool = deckCards
    .map(c => (c.back||"").trim())
    .filter(b => b && b !== correct && b.length >= 2 && b.length <= 140);
  const picks = [];
  const used = new Set([normalizeStr(correct)]);
  let guard = 0;
  while (picks.length < (n-1) && guard < 500){
    guard++;
    if (!pool.length) break;
    const cand = pool[Math.floor(Math.random()*pool.length)];
    const nk = normalizeStr(cand);
    if (nk && !used.has(nk)){ used.add(nk); picks.push(cand); }
  }
  const opts = [correct, ...picks].slice(0,n);
  for (let i=opts.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return { options: opts, correct };
}

function makeCard({id, front, back, frontImage=null, backImage=null, createdAtIdx=0, importedCloze=false}){
  return {     
    importedCloze: !!importedCloze,
    id: id || String(Date.now()),
    front: front || "",
    back: back || "",
    frontImage,
    backImage,
    createdAtIdx,
    wrongCount: 0,
    interval: 1,
    easeFactor: 2.5,
    repetitions: 0,
    nextReview: null,
    mastered: false,
    seenCount: 0,
    lastSeenOn: null,
    inWrongDeck: false,
    adaptiveThreshold: 3,
    adaptiveMode: "typed",
    adaptivePref: "cloze",
    starred: false
  };
}
function normalizeCard(card){
  if (card.seenCount == null) card.seenCount = 0;
  if (card.lastSeenOn == null) card.lastSeenOn = null;
  if (card.inWrongDeck == null) card.inWrongDeck = false;
  if (card.createdAtIdx == null) card.createdAtIdx = 0;
  if (card.adaptiveThreshold == null) card.adaptiveThreshold = 3;
  if (!card.adaptiveMode) card.adaptiveMode = "typed";
  if (!card.adaptivePref) card.adaptivePref = "cloze";
  if (card.starred == null) card.starred = false;
  return card;
}

/******************************************************************
 * SHUFFLE + QUEUE BUILDING
 ******************************************************************/
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function deckOrderCards(deck, cards){
  const order = deck.studyOrder || "random";
  if (order === "inorder"){
    return cards
      .slice()
      .sort((a,b)=> (a.createdAtIdx ?? 0) - (b.createdAtIdx ?? 0) || String(a.id).localeCompare(String(b.id)));
  }
  return shuffle(cards);
}

function interleaveBuckets(listByDeck){
  const queues = Object.entries(listByDeck)
    .filter(([,cards])=>cards.length)
    .map(([deckId,cards])=>({deckId,cards,i:0}));
  const mode = DATA.settings?.studyMode || "mixed_random";
  const base = (mode === "mixed_random") ? shuffle(queues) : queues;
  const out = [];
  let moved = true;
  while (moved){
    moved = false;
    const cycle = (mode === "mixed_random") ? shuffle(base) : base;
    for (const q of cycle){
      if (q.i < q.cards.length){
        out.push({...q.cards[q.i], deckId:q.deckId});
        q.i++;
        moved = true;
      }
    }
  }
  return (mode === "mixed_random") ? shuffle(out) : out;
}

function buildDailyQueue(decks, limit){
  const wrongByDeck    = {};
  const dueByDeck      = {};
  const unseenByDeck   = {};
  const masteredByDeck = {};

  for (const [id, deck] of Object.entries(decks)){
    if (isDeckMuted(id)) continue;
    const cards = (deck.cards||[]).map(c=>normalizeCard(c));
    const wrong    = cards.filter(c=>!c.mastered && c.inWrongDeck);
    const due      = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)>0 && isDue(c));
    const unseen   = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)===0);
    const mastered = cards.filter(c=>isMasteredDue(c));

   const reviewQuotas = DATA.settings?.perDeckReviewQuota || {};

wrongByDeck[id] = deckOrderCards(deck, wrong);

// due review cap per deck
const dueOrdered = deckOrderCards(deck, due);
const dueCap = Number(reviewQuotas[id] ?? dueOrdered.length);
dueByDeck[id] = dueOrdered.slice(0, Math.max(0, dueCap));

unseenByDeck[id]   = deckOrderCards(deck, unseen);
masteredByDeck[id] = deckOrderCards(deck, mastered);
  }

  const wrongQueue   = interleaveBuckets(wrongByDeck);
  const dueQueue     = interleaveBuckets(dueByDeck);
  const masteredCap   = getMasteredReviewPerDay();
  const masteredQueue = interleaveBuckets(masteredByDeck).slice(0, masteredCap);
 const newSlots = Math.max(0, limit - wrongQueue.length - dueQueue.length - masteredQueue.length);
const cappedByDeck = {};
let remaining = newSlots;

// 1) Quota pass (use user-specified quotas first)
if (remaining > 0){
  const quotas = DATA.settings?.perDeckNewQuota || {};
  for (const deckId of Object.keys(unseenByDeck)){
    if (remaining <= 0) break;
    const q = Number(quotas[deckId] ?? 0);
    if (!q) continue;
    const give = Math.min(q, unseenByDeck[deckId].length, remaining);
    if (give > 0){
      cappedByDeck[deckId] = (cappedByDeck[deckId] || 0) + give;
      remaining -= give;
    }
  }
}

// 2) Fill remainder fairly across any decks still having unseen cards
if (remaining > 0){
  const activeIds = Object.keys(unseenByDeck).filter(id => unseenByDeck[id].length > (cappedByDeck[id] || 0));
  let pool = [...activeIds];
  for (let pass = 0; pass < 6 && pool.length > 0 && remaining > 0; pass++){
    const perDeck = Math.ceil(remaining / pool.length);
    const nextPool = [];
    for (const id of pool){
      const have = unseenByDeck[id].length - (cappedByDeck[id] || 0);
      if (have <= 0) continue;
      const give = Math.min(perDeck, have, remaining);
      cappedByDeck[id] = (cappedByDeck[id] || 0) + give;
      remaining -= give;
      if (unseenByDeck[id].length > (cappedByDeck[id] || 0)) nextPool.push(id);
      if (remaining <= 0) break;
    }
    pool = nextPool;
  }
}

  const slicedByDeck = {};
  for (const [id, count] of Object.entries(cappedByDeck)){
    slicedByDeck[id] = unseenByDeck[id].slice(0, count);
  }

  const unseenQueue = interleaveBuckets(slicedByDeck);
  const masteredHandling = DATA.settings?.masteredHandling || "mix";
  let tail;
  if (masteredHandling === "mute"){
    tail = unseenQueue;
  } else if (masteredHandling === "front"){
    tail = [...masteredQueue, ...unseenQueue];
  } else {
    tail = shuffle([...masteredQueue, ...unseenQueue]);
  }

  return {
    wrongQueue, dueQueue, masteredQueue, unseenQueue,
    perDeckNewSlots: Object.fromEntries(
      Object.entries(slicedByDeck).map(([id,arr])=>[id,arr.length])
    ),
    queue: [...wrongQueue, ...dueQueue, ...tail]
  };
}

/******************************************************************
 * CUSTOM STUDY HELPERS
 ******************************************************************/
function getFilteredCustomCards(){
  const result = [];
  for (const [deckId, deck] of Object.entries(DATA.decks)){
    if (CUSTOM_FILTER_DECK !== "all" && deckId !== CUSTOM_FILTER_DECK) continue;
    for (const rawCard of (deck.cards||[])){
      const c = normalizeCard({...rawCard});
      // status filter
      if (CUSTOM_FILTER_STATUS === "unseen"   && (c.seenCount||0) > 0) continue;
      if (CUSTOM_FILTER_STATUS === "due"      && !isDue(c)) continue;
      if (CUSTOM_FILTER_STATUS === "mastered" && !c.mastered) continue;
      if (CUSTOM_FILTER_STATUS === "wrong"    && !c.inWrongDeck) continue;
      if (CUSTOM_FILTER_STATUS === "starred"  && !c.starred) continue;
      result.push({...c, deckId, deckName: deck.name});
    }
  }
  return result;
}

/******************************************************************
 * IMAGE HELPERS
 ******************************************************************/
function fileToBase64(file){
  return new Promise((resolve)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.readAsDataURL(file);
  });
}
async function clipboardImageToBase64(e){
  const data = e.clipboardData;
  const items = data?.items || [];
  for (const it of items){
    if (it.type && it.type.startsWith("image/")){
      const file = it.getAsFile?.();
      if (file) return await fileToBase64(file);
    }
  }
  const files = data?.files || [];
  for (const file of files){
    if (file?.type?.startsWith("image/")) return await fileToBase64(file);
  }
  return null;
}

 /******************************************************************
 * APKG (ANKI DECK) IMPORT
 ******************************************************************/
async function importAPKG(file){
  const zip = await JSZip.loadAsync(file);

  const dbEntry = zip.file("collection.anki2") || zip.file("collection.anki21");
  if (!dbEntry) throw new Error("APKG missing collection.anki2/collection.anki21");

  const mediaMap = {};
  const mediaEntry = zip.file("media");

  if (mediaEntry){
    try{
      const mediaJson = await mediaEntry.async("string");
      const media = JSON.parse(mediaJson);

      for (const key of Object.keys(media)){
        const fname = media[key];
        const f = zip.file(key);
        if (!f) continue;

        const ext = (fname.split(".").pop() || "").toLowerCase();
        const isImg = ["png","jpg","jpeg","webp","gif","svg"].includes(ext);
        if (!isImg) continue;

        const base64 = await f.async("base64");
        const mime =
          ext === "png" ? "image/png" :
          (ext === "jpg" || ext === "jpeg") ? "image/jpeg" :
          ext === "webp" ? "image/webp" :
          ext === "gif" ? "image/gif" :
          ext === "svg" ? "image/svg+xml" :
          "application/octet-stream";

        const dataUrl = `data:${mime};base64,${base64}`;
        mediaMap[fname] = dataUrl;
        mediaMap[encodeURIComponent(fname)] = dataUrl;
      }
    }catch(err){
      console.warn("Media parse failed:", err);
    }
  }

  function stripSoundTags(s){
    return String(s || "").replace(/\[sound:[^\]]+\]/gi, "").trim();
  }

  function resolveMedia(html){
    let out = String(html || "");

    out = out.replace(/src\s*=\s*["']([^"']+)["']/gi, (m, src)=>{
      let clean = String(src || "").trim();

      if (/^(https?:|data:|blob:)/i.test(clean)) return m;

      clean = clean.replace(/^\.\/+/, "").split("#")[0].split("?")[0].trim();

      let decoded = clean;
      try { decoded = decodeURIComponent(clean); } catch {}

      const dataUrl = mediaMap[decoded] || mediaMap[clean];
      if (dataUrl) return `src="${dataUrl}"`;

      return m;
    });

    out = out.replace(/\[sound:[^\]]+\]/gi, "");
    return out;
  }

  function stripHtmlToText(html){
    const div = document.createElement("div");
    div.innerHTML = String(html || "");
    return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
  }

  function isMostlyImageField(html){
    const s = String(html || "").trim();
    if (!s) return false;

    const textOnly = stripHtmlToText(s);
    if (textOnly) return false;

    return /<img\b|<svg\b|data:image/i.test(s);
  }

  function looksLikeMetaField(fieldName, html){
    const n = String(fieldName || "").toLowerCase().trim();
    const text = stripHtmlToText(html).toLowerCase();

    if (!html || !String(html).trim()) return true;

    if ([
      "thumbnail","image","img","picture","pic",
      "link","url","source",
      "tags","tag",
      "personal notes","missed questions","one by one"
    ].includes(n)) return true;

    if (isMostlyImageField(html)) return true;
    if (/^(https?:\/\/|www\.)/i.test(text)) return true;

    return false;
  }

  function extractFirstClozeAnswer(text){
    const m = String(text || "").match(/\{\{c\d+::(.*?)(?:::(.*?))?\}\}/i);
    return m ? m[1].trim() : "";
  }

  function renderClozePrompt(text){
    return String(text || "").replace(/\{\{c\d+::(.*?)(?:::(.*?))?\}\}/gi, "_____");
  }

  const dbFile = await dbEntry.async("arraybuffer");

  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`
  });

  const db = new SQL.Database(new Uint8Array(dbFile));

  let modelsById = {};
  const notesRes = db.exec("SELECT id, mid, flds FROM notes");
  const colRes = db.exec("SELECT models FROM col");
  const cards = [];

  if (colRes?.[0]?.values?.[0]?.[0]){
    try{
      modelsById = JSON.parse(colRes[0].values[0][0]);
    }catch(err){
      console.warn("Could not parse Anki models:", err);
    }
  }

  if (!notesRes?.[0]?.values?.length){
    return cards;
  }

  for (const row of notesRes[0].values){
    const midRaw = row[1];
    const flds = String(row[2] ?? "");
    const fields = flds.split("\x1f").map(x => resolveMedia(stripSoundTags(x)));

    const model = modelsById[String(midRaw)] || modelsById[midRaw];
    const fieldDefs = Array.isArray(model?.flds) ? model.flds : [];
    const modelType = Number(model?.type ?? 0);
    const modelName = String(model?.name || "").toLowerCase();

    const namedFields = fields.map((value, i) => ({
      index: i,
      name: fieldDefs[i]?.name || `Field ${i + 1}`,
      value
    }));

    // CLOZE NOTES
    if (modelType === 1 || modelName.includes("cloze") || fields.some(v => /\{\{c\d+::/.test(v))){
      const textField =
        namedFields.find(f => String(f.name).toLowerCase() === "text") ||
        namedFields.find(f => /\{\{c\d+::/.test(f.value)) ||
        namedFields[0];

      if (!textField || !textField.value) continue;

      const extraField =
        namedFields.find(f => String(f.name).toLowerCase() === "extra") ||
        namedFields.find(f => !looksLikeMetaField(f.name, f.value) && f.index !== textField.index);

      const originalText = textField.value;
      const question = renderClozePrompt(originalText);
      const answer = extractFirstClozeAnswer(originalText);

      let back = answer;
      if (extraField?.value && !looksLikeMetaField(extraField.name, extraField.value)){
        back += `<br><br>${extraField.value}`;
      }

      if (question && back){
       cards.push({
  front: question,
  back,
  importedCloze: true
});
      }

      continue;
    }

    // BASIC / OTHER NOTES
    const usableFields = namedFields.filter(f => !looksLikeMetaField(f.name, f.value));
    if (!usableFields.length) continue;

    const front = usableFields[0]?.value?.trim() || "";
    const back = usableFields[1]?.value?.trim() || "";

    if (front || back){
      cards.push({ front, back });
    }
  }

  return cards;
}

}

function stripHtmlToText(html){
  const div = document.createElement("div");
  div.innerHTML = String(html || "");
  return div.textContent || div.innerText || "";
}

function cardToAnkiNote(card){
  const frontHtml = normalizeCardHTML(card.front || "");
  const backHtml  = normalizeCardHTML(card.back || "");

  const frontText = stripHtmlToText(frontHtml).trim();
  const backText  = stripHtmlToText(backHtml).trim();

  const hasClozeSyntax = /\{\{c\d+::.+?\}\}/i.test(frontHtml) || /\{\{c\d+::.+?\}\}/i.test(backHtml);

  if (hasClozeSyntax){
    return {
      type: "cloze",
      sfld: stripHtmlToText(frontHtml),
      flds: [
        frontHtml || backHtml,
        backHtml || ""
      ]
    };
  }

  return {
    type: "basic",
    sfld: frontText,
    flds: [frontHtml, backHtml]
  };
}

async function extractLinesFromPDF(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const byY = {};
    for (const item of content.items){
      const y = Math.round(item.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push(item.str);
    }
    const sortedYs = Object.keys(byY).map(Number).sort((a,b)=>b-a);
    for (const y of sortedYs){
      const line = byY[y].join(" ").trim();
      if (line) lines.push(line);
    }
  }
  return lines;
}

function cardsFromLinesLineByLine(lines){
  const cards = [];
  const filtered = lines.filter(l=>l.trim().length > 0);
  for (let i = 0; i+1 < filtered.length; i+=2){
    const front = filtered[i].trim();
    const back = filtered[i+1].trim();
    if (front && back) cards.push({front, back});
  }
  return cards;
}

function parseCardsFromTextSmart(text){
  const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return [];

  // Tab-separated (highest priority)
  const tabCards = [];
  for (const line of lines){
    const parts = line.split(/\t/);
    if (parts.length >= 2){
      const front = parts[0].trim();
      const back = parts.slice(1).join(" ").trim();
      if (front && back) tabCards.push({front, back});
    }
  }
  if (tabCards.length >= Math.floor(lines.length * 0.6)) return tabCards;

  // Q: / A: pattern — handles blank-line-separated blocks
  const qaPattern = /^Q\s*[:.)]\s*(.+)/i;
  const ansPattern = /^A\s*[:.)]\s*(.+)/i;
  const qaCards = [];
  const allLines = text.split(/\n/).map(l=>l.trim()); // keep blanks for block detection
  let i = 0;
  while (i < allLines.length){
    const qm = allLines[i].match(qaPattern);
    if (qm){
      let front = qm[1];
      let back = "";
      i++;
      // collect continuation lines for Q (until A: or blank)
      while (i < allLines.length && !allLines[i].match(ansPattern) && !allLines[i].match(qaPattern)){
        if (allLines[i] === "") { i++; continue; }
        front += " " + allLines[i];
        i++;
      }
      const am = allLines[i]?.match(ansPattern);
      if (am){ back = am[1]; i++; }
      // collect continuation lines for A
      while (i < allLines.length && !allLines[i].match(qaPattern) && allLines[i] !== ""){
        back += " " + allLines[i];
        i++;
      }
      if (front && back) qaCards.push({front: front.trim(), back: back.trim()});
    } else { i++; }
  }
  if (qaCards.length > 0) return qaCards;

  // Separator-based
  const sepCards = [];
  for (const line of lines){
    const m = line.match(/^(.{3,}?)\s*(?:\t| - | \| |: )\s*(.+)$/);
    if (m) sepCards.push({front: m[1].trim(), back: m[2].trim()});
  }
  if (sepCards.length >= Math.floor(lines.length * 0.5)) return sepCards;

  return cardsFromLinesLineByLine(lines);
}

async function extractCardsFromSpreadsheet(file){
  const arrayBuffer = await file.arrayBuffer();
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
  const cards = [];
  for (const row of rows){
    if (!row || row.length < 2) continue;
    const front = String(row[0]||"").trim();
    const back = String(row[1]||"").trim();
    if (front && back) cards.push({front, back});
  }
  return cards;
}

function htmlToText(html){
  const div = document.createElement("div");
  div.innerHTML = String(html || "");
  return (div.textContent || div.innerText || "").replace(/\s+/g," ").trim();
}

function normalizeCardHTML(html){
  // ensure consistent <br> for newlines
  return String(html || "").replace(/\r\n/g, "\n").replace(/\n/g, "<br>");
}

function formatCardHTML(html){
  const normalized = normalizeCardHTML(html);

  // turn **text** into bold
  const withBold = normalized.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");

  return safeHTML(withBold);
}

function safeHTML(html){
  // Lightweight sanitizer (good enough for your offline decks)
  const tpl = document.createElement("template");
  tpl.innerHTML = String(html || "");

  // Remove dangerous tags
  tpl.content.querySelectorAll("script, style, iframe, object, embed").forEach(n => n.remove());

  // Remove inline event handlers + javascript: URLs
  tpl.content.querySelectorAll("*").forEach(el => {
    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();
      const val  = String(attr.value || "");
      if (name.startsWith("on")) el.removeAttribute(attr.name);
      if ((name === "href" || name === "src") && val.trim().toLowerCase().startsWith("javascript:")) {
        el.removeAttribute(attr.name);
      }
    });
  });

  return tpl.innerHTML;
}

function escapeHTML(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

  const selAllBtn = document.getElementById("selectAllVisible");
  if (selAllBtn) selAllBtn.onclick = ()=>{

    filtered.forEach(c=>CUSTOM_SELECTED.add(c.id));
    render();
  };

  // Deselect all
  const deselBtn = document.getElementById("deselectAll");
  if (deselBtn) deselBtn.onclick = ()=>{ CUSTOM_SELECTED.clear(); render(); };

  // Invert selection (among currently visible filtered cards)
  const invertBtn = document.getElementById("invertSelection");
  if (invertBtn) invertBtn.onclick = ()=>{
    const filtered = getFilteredCustomCards();
    for (const c of filtered){
      if (CUSTOM_SELECTED.has(c.id)) CUSTOM_SELECTED.delete(c.id);
      else CUSTOM_SELECTED.add(c.id);
    }
    render();
  };

  // Per-deck "Select All" buttons
  document.querySelectorAll("[data-select-deck]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const dId = btn.dataset.selectDeck;
      const filtered = getFilteredCustomCards().filter(c=>c.deckId===dId);
      const allSel = filtered.every(c=>CUSTOM_SELECTED.has(c.id));
      if (allSel) filtered.forEach(c=>CUSTOM_SELECTED.delete(c.id));
      else filtered.forEach(c=>CUSTOM_SELECTED.add(c.id));
      render();
    };
  });

  // Individual card checkboxes
  document.querySelectorAll("[data-cid]").forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.cid;
      if (cb.checked) CUSTOM_SELECTED.add(id);
      else CUSTOM_SELECTED.delete(id);
      // Lightweight update: just re-render (fast)
      render();
    };
  });

  function startCustomStudy(){
    if (CUSTOM_SELECTED.size === 0){ alert("Select at least one card."); return; }

    // Build queue from selected cards with deckId attached
    const allCards = [];
    for (const [deckId, deck] of Object.entries(DATA.decks)){
      for (const rawCard of (deck.cards||[])){
        if (CUSTOM_SELECTED.has(rawCard.id)){
          allCards.push({...normalizeCard({...rawCard}), deckId});
        }
      }
    }

    window.__customQueue = CUSTOM_SHUFFLE ? shuffle(allCards) : allCards;
    window.__customMode  = true;
    setScreen("study");
  }

  const topBtn = document.getElementById("startCustomStudyTop");
  if (topBtn) topBtn.onclick = startCustomStudy;
  const botBtn = document.getElementById("startCustomStudyBottom");
  if (botBtn) botBtn.onclick = startCustomStudy;
}

 * CALENDAR
 ******************************************************************/
function dayStatus(day){
  const st = DATA.stats[day] || {reviewed:0};
  const reviewed = Number(st.reviewed || 0);
  const goal = getDailyGoal();
  if (!reviewed) return "nodata";
  if (reviewed >= goal) return "hit";
  if (reviewed >= Math.ceil(goal * 0.5)) return "partial";
  return "missed";
}
function calendarHTML(){
  const start = DATA.settings?.appStartDate || todayStr();
  const startDate = new Date(start+"T00:00:00");
  const today = new Date(todayStr()+"T00:00:00");
  const days = [];
  for (let d = new Date(startDate); d <= today; d.setDate(d.getDate()+1)){
    days.push(localDateStr(d));
  }
  const firstDow = new Date(days[0]+"T00:00:00").getDay();
  const labels = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  let hit=0, partial=0, missed=0;
  let grid = labels.map(x=>`<div class="calLabel">${x}</div>`).join("");
  for (let i=0;i<firstDow;i++) grid += `<div class="calDay empty"></div>`;
  for (const ds of days){
    const s = dayStatus(ds);
    if (s === "hit") hit++;
    if (s === "partial") partial++;
    if (s === "missed") missed++;
    const dd = Number(ds.slice(-2));
    const cls = `calDay ${s}${ds===todayStr()?" today":""}`;
    grid += `<div class="${cls}" title="${ds}">${dd}</div>`;
  }
  return `
    ${headerHTML(false)}
    <div class="section">Calendar</div>
    <div class="row" style="margin-bottom:14px">
      ${stat("Started", start, "var(--purple)")}
      ${stat("Hit Goal", hit, "var(--green)")}
      ${stat("Partial", partial, "var(--orange)")}
      ${stat("Missed", missed, "var(--red)")}
    </div>
    <div class="calWrap">
      <div style="font-size:13px;color:var(--muted);font-weight:900;margin-bottom:10px">Tracking from ${start}</div>
      <div class="calGrid">${grid}</div>
      <div class="tiny" style="margin-top:10px;color:var(--muted)">Green=goal · Orange=partial · Red=missed · Gray=no data</div>
    </div>
  `;
}

  rawCards = await importAPKG(files[0]);
  pushMsg("ok", `APKG extracted ${rawCards.length} raw notes`);
}
      if (mode==="text"){
        if (!textContent.trim()) throw new Error("Paste some text");
        rawCards = parseCardsFromTextSmart(textContent);
      }
      if (mode==="manual") rawCards = [];
      const seen = new Set();
      const clean = [];
      for (const c of rawCards){
        const front = (c.front||"").trim();
        const back  = (c.back||"").trim();
        if (!front && !back) continue;
        const k = front+"||"+back;
        if (seen.has(k)) continue;
        seen.add(k);
        clean.push({front: front.slice(0,500), back: back.slice(0,500)});
      }
      const cards = clean.map((c,i)=>makeCard({
        id: `${Date.now()}_${i}`,
        front: c.front,
        back: c.back,
        createdAtIdx: i,
        importedCloze: !!c.importedCloze
      }));
      const deckId = `deck_${Date.now()}`;
      const order = deckOrderSel.value;
      updateData(d=>{
        d.decks[deckId] = { name, studyOrder: order, cards, createdAt: new Date().toISOString() };
      });
      pushMsg("ok", `Created deck "${name}" with ${cards.length} cards`);
      setScreen("manage");
    }catch(e){
      pushMsg("err", e.message || "Error");
    }finally{
      busy = false;
      buildBtn.disabled = false;
      buildBtn.textContent = (mode==="manual") ? "Create Empty Deck" : "Extract & Create Deck";
    }
  }

  modeButtons.forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));
  buildBtn.onclick = buildDeck;
  renderModeArea();
}
