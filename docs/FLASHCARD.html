  <style>
    :root{
      --bg:#0a0b0f; --panel:#111318; --panel2:#181c24; --border:#1e2330;
      --text:#e2e8f0; --muted:#94a3b8; --muted2:#4a5568;
      --purple:#818cf8; --green:#4ade80; --orange:#fb923c; --red:#f87171; --cyan:#22d3ee;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','Helvetica Neue',sans-serif}
    button{cursor:pointer}
    button:hover{opacity:.93}
    button:active{transform:scale(.985)}
    input,textarea,select{color:var(--text)}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple)!important;box-shadow:0 0 0 3px rgba(129,140,248,.07)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
    .mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);z-index:100;padding:6px 0 env(safe-area-inset-bottom,6px)}
    .mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:4px 2px;cursor:pointer}
    .mobile-nav button.active{color:var(--purple)}
    .mobile-nav button .micon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
    .mobile-nav button.active .micon{background:rgba(129,140,248,.15)}
    /* Mobile sidebar overlay */
.mobile-sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
}
.mobile-sidebar-overlay.open{display:block}
.mobile-sidebar-drawer{
  position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:300px;
  background:var(--panel);border-right:1px solid var(--border);
  z-index:201;overflow-y:auto;padding:22px 14px 100px;
  transform:translateX(-100%);transition:transform .22s ease;
}
.mobile-sidebar-drawer.open{transform:translateX(0)}


    @media(max-width:640px){
  .sidebar{display:none}
  .mobile-nav{display:flex}
  .main{padding:14px 12px 90px;overflow-x:hidden;width:100vw}
  .studyWrap{padding:12px 10px}
  .flash{padding:20px 12px;min-height:130px}
  .q{font-size:16px}
  .split{flex-direction:column}
  .left{width:100%}
  .grid{grid-template-columns:1fr}
  .rating{flex-wrap:wrap}
  .rBtn{min-width:calc(50% - 4px);padding:14px 6px;font-size:13px}
  .done{padding:24px 14px}
  .studyTop{gap:8px;flex-wrap:wrap}
  .row{flex-wrap:wrap}
  .stat{min-width:calc(50% - 5px)}
  .app{overflow-x:hidden;width:100vw;max-width:100vw}
  .customFilters{flex-direction:column}
  .customFilterGroup{width:100%}
  .ansInput{font-size:16px}
  .mcGrid{grid-template-columns:1fr}
}


    .app{display:flex;min-height:100vh}

    .mcOptions{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:10px} .mcGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:14px} .mcGridBtn{padding:14px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s;display:flex;gap:10px;align-items:flex-start;line-height:1.4} .mcGridBtn:hover{border-color:rgba(129,140,248,.4);background:rgba(129,140,248,.07)} .mcGridBtn.correct{border-color:rgba(74,222,128,.6)!important;background:rgba(22,163,74,.18)!important;color:var(--green)!important} .mcGridBtn.wrong{border-color:rgba(248,113,113,.6)!important;background:rgba(220,38,38,.18)!important;color:var(--red)!important} .mcGridBtn.reveal{border-color:rgba(74,222,128,.4)!important;background:rgba(22,163,74,.10)!important} .mcGridLetter{font-family:'IBM Plex Mono',monospace;font-weight:900;font-size:14px;flex-shrink:0;opacity:.7}

<body>
  <div id="root"></div>

<script>
/******************************************************************
 * STORAGE + SETTINGS
 ******************************************************************/
const STORAGE_KEY = "recall_full_final_v1";
const DEFAULT_DAILY_GOAL = 150;

const INIT = {
  decks:{},
  stats:{},
  settings:{
    appStartDate:null,
    mutedDecksByDay:{},
    dailyGoal: DEFAULT_DAILY_GOAL,
    studyMode: "mixed_random",
    strictness: "balanced",
  masteredReviewPerDay: 15,
masteredHandling: "mix",
wrongHandling: "front",
  }
};

let DATA = loadData();
let SCREEN = "dashboard";
let CURRENT_DAY = todayStr();

// ── Custom Study State ────────────────────────────────────────
let CUSTOM_SELECTED = new Set();   // card IDs currently checked
let CUSTOM_FILTER_DECK   = "all";  // "all" or a deckId
let CUSTOM_FILTER_STATUS = "all";  // all|unseen|due|mastered|wrong|starred
let CUSTOM_SHUFFLE       = true;
let CUSTOM_BLOCK_COUNT   = 4;      // how many blocks to split selected deck into

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : structuredClone(INIT);
    return normalizeData(parsed);
  }catch{
    return normalizeData(structuredClone(INIT));
  }
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch{}
}
function updateData(mutator){
  const next = structuredClone(DATA);
  mutator(next);
  normalizeData(next);
  DATA = next;
  saveData(DATA);
  render();
}
function hardResetAll(){
  if (!confirm("Fresh start will wipe ALL decks + stats in this app. Continue?")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch{}

/******************************************************************
 * SM-2
 ******************************************************************/
function sm2(card, quality){
  let {interval=1, easeFactor=2.5, repetitions=0} = card;
  if (quality < 3){ repetitions = 0; interval = 1; }
  else{
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetitions++;
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5-quality) * (0.08 + (5-quality)*0.02));
  const nr = new Date();
  nr.setDate(nr.getDate() + interval);
  const mastered = quality === 5 ? true : (quality < 3 ? false : card.mastered);
  return {...card, interval, easeFactor, repetitions, nextReview: nr.toISOString(), mastered};
}

/******************************************************************
 * ANSWER MATCHING
 ******************************************************************/
function normalizeStr(s){
  return (s||"")
    .toLowerCase()
    .replace(/[^a-z0-9\s\+\-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function levenshtein(a,b){
  const dp = Array.from({length:a.length+1}, (_,i)=>Array.from({length:b.length+1},(_,j)=> i===0?j : j===0?i : 0));
  for(let i=1;i<=a.length;i++){
    for(let j=1;j<=b.length;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[a.length][b.length];
}
function splitAlternatives(s){
  const raw = String(s||"").trim();
  if (!raw) return [];
  return raw.split(/\s*(?:\/|;|\bor\b|,)\s*/gi).map(x=>x.trim()).filter(Boolean);
}
function getAnswerVariants(answer){
  const raw = String(answer||"");
  const variants = new Set();
  const push = (v)=>{ const n = normalizeStr(v); if (n) variants.add(n); };
  const baseForms = [
    raw,
    raw.replace(/^\s*(answer|ans|a)\s*[:.)-]?\s*/i, ""),
    raw.replace(/\([^)]*\)/g, " "),
    raw.replace(/\[[^\]]*\]/g, " "),
    raw.replace(/^\s*(answer|ans|a)\s*[:.)-]?\s*/i, "").replace(/\([^)]*\)|\[[^\]]*\]/g, " "),
  ];
  for (const bf of baseForms){
    push(bf);
    for (const alt of splitAlternatives(bf)) push(alt);
  }
  const base = Array.from(variants);
  for (const v of base) push(v.replace(/^\s*(the|an?)\s+/, ""));
  return Array.from(variants);
}
function tokenize(s){ return normalizeStr(s).split(" ").filter(Boolean); }
function jaccard(aTokens, bTokens){
  const A = new Set(aTokens); const B = new Set(bTokens);
  if (!A.size || !B.size) return 0;
  let inter = 0; for (const t of A) if (B.has(t)) inter++;
  const union = A.size + B.size - inter;
  return union ? inter/union : 0;
}
function normalizedEditSim(a, b){
  if (!a || !b) return 0;
  const d = levenshtein(a,b);
  const m = Math.max(a.length, b.length);
  return m ? (1 - d/m) : 0;
}
function getStrictnessThresholds(){
  const s = DATA.settings?.strictness || "balanced";
  if (s === "lenient") return {correct:0.82, close:0.66};
  if (s === "strict")  return {correct:0.90, close:0.76};
  return {correct:0.86, close:0.72};
}
function checkAnswer(input, answer){
  const inp = normalizeStr(input);
  if (!inp) return "wrong";
  const variants = getAnswerVariants(answer);
  if (!variants.length) return "wrong";
  for (const v of variants){
    if (inp === v) return "correct";
    if (inp.includes(v) && v.length >= 3) return "correct";
    if (v.includes(inp) && inp.length >= Math.floor(v.length * 0.6)) return "correct";
  }
  let best = 0;
  for (const v of variants){
    const aTok = tokenize(inp);
    const bTok = tokenize(v);
    const jac = jaccard(aTok, bTok);
    const ed  = normalizedEditSim(inp, v);
    const w = (bTok.length >= 2) ? (0.7*jac + 0.3*ed) : (0.45*jac + 0.55*ed);
    if (w > best) best = w;
  }
  const th = getStrictnessThresholds();
  if (best >= th.correct) return "correct";
  if (best >= th.close) return "close";
  return "wrong";
}

/******************************************************************
 * CLOZE + MC
 ******************************************************************/
function makeCloze(text){
  const words = (text||"").split(" ");
  if (words.length < 3) return {clozeText:"___", answer:text||""};
  let idx=1, max=0;
  words.forEach((w,i)=>{
    const l = w.replace(/[^a-z]/gi,"").length;
    if (l>max && i>0){ max=l; idx=i; }
  });
  return {clozeText: words.map((w,i)=> i===idx ? "___" : w).join(" "), answer: words[idx]};
}
function decideAdaptiveMode(card){
  return card.adaptivePref || "cloze";
}
function buildMCOptions(currentCard, deckCards, n=4){
  const correct = (currentCard.back||"").trim();
  const pool = deckCards
    .map(c => (c.back||"").trim())
    .filter(b => b && b !== correct && b.length >= 2 && b.length <= 140);
  const picks = [];
  const used = new Set([normalizeStr(correct)]);
  let guard = 0;
  while (picks.length < (n-1) && guard < 500){
    guard++;
    if (!pool.length) break;
    const cand = pool[Math.floor(Math.random()*pool.length)];
    const nk = normalizeStr(cand);
    if (nk && !used.has(nk)){ used.add(nk); picks.push(cand); }
  }
  const opts = [correct, ...picks].slice(0,n);
  for (let i=opts.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return { options: opts, correct };
}

/******************************************************************
 * SHUFFLE + QUEUE BUILDING
 ******************************************************************/
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function deckOrderCards(deck, cards){
  const order = deck.studyOrder || "random";
  if (order === "inorder"){
    return cards
      .slice()
      .sort((a,b)=> (a.createdAtIdx ?? 0) - (b.createdAtIdx ?? 0) || String(a.id).localeCompare(String(b.id)));
  }
  return shuffle(cards);
}

function interleaveBuckets(listByDeck){
  const queues = Object.entries(listByDeck)
    .filter(([,cards])=>cards.length)
    .map(([deckId,cards])=>({deckId,cards,i:0}));
  const mode = DATA.settings?.studyMode || "mixed_random";
  const base = (mode === "mixed_random") ? shuffle(queues) : queues;
  const out = [];
  let moved = true;
  while (moved){
    moved = false;
    const cycle = (mode === "mixed_random") ? shuffle(base) : base;
    for (const q of cycle){
      if (q.i < q.cards.length){
        out.push({...q.cards[q.i], deckId:q.deckId});
        q.i++;
        moved = true;
      }
    }
  }
  return (mode === "mixed_random") ? shuffle(out) : out;
}

function buildDailyQueue(decks, limit){
  const wrongByDeck    = {};
  const dueByDeck      = {};
  const unseenByDeck   = {};
  const masteredByDeck = {};

  for (const [id, deck] of Object.entries(decks)){
    if (isDeckMuted(id)) continue;
    const cards = (deck.cards||[]).map(c=>normalizeCard(c));
    const wrong    = cards.filter(c=>!c.mastered && c.inWrongDeck);
    const due      = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)>0 && isDue(c));
    const unseen   = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)===0);
    const mastered = cards.filter(c=>isMasteredDue(c));

    wrongByDeck[id]    = deckOrderCards(deck, wrong);
    dueByDeck[id]      = deckOrderCards(deck, due);
    unseenByDeck[id]   = deckOrderCards(deck, unseen);
    masteredByDeck[id] = deckOrderCards(deck, mastered);
  }

  const wrongQueue   = interleaveBuckets(wrongByDeck);
  const dueQueue     = interleaveBuckets(dueByDeck);
  const masteredCap   = getMasteredReviewPerDay();
  const masteredQueue = interleaveBuckets(masteredByDeck).slice(0, masteredCap);
  const newSlots      = Math.max(0, limit - wrongQueue.length - dueQueue.length - masteredQueue.length);
  const cappedByDeck  = {};

  if (newSlots > 0){
    const activeIds = Object.keys(unseenByDeck).filter(id => unseenByDeck[id].length > 0);
    let remaining   = newSlots;
    let pool        = [...activeIds];
    for (let pass = 0; pass < 5 && pool.length > 0 && remaining > 0; pass++){
      const perDeck = Math.ceil(remaining / pool.length);
      const nextPool = [];
      for (const id of pool){
        const give = Math.min(perDeck, unseenByDeck[id].length, remaining);
        cappedByDeck[id] = (cappedByDeck[id] || 0) + give;
        remaining -= give;
        if (unseenByDeck[id].length > cappedByDeck[id]) nextPool.push(id);
      }
      pool = nextPool;
    }
  }

  const slicedByDeck = {};
  for (const [id, count] of Object.entries(cappedByDeck)){
    slicedByDeck[id] = unseenByDeck[id].slice(0, count);
  }

  const unseenQueue = interleaveBuckets(slicedByDeck);

const masteredHandling = DATA.settings?.masteredHandling || "mix";
const wrongHandling = DATA.settings?.wrongHandling || "front";

let masteredTail;
if (masteredHandling === "mute"){
  masteredTail = [];
} else if (masteredHandling === "front"){
  masteredTail = masteredQueue;
} else {
  masteredTail = masteredQueue;
}

let queue;
if (wrongHandling === "mix_mastered"){
  queue = [
    ...shuffle([...wrongQueue, ...masteredTail]),
    ...dueQueue,
    ...unseenQueue
  ];
} else {
  queue = [
    ...wrongQueue,
    ...dueQueue,
    ...(masteredHandling === "front" ? masteredTail : []),
    ...unseenQueue,
    ...(masteredHandling === "mix" ? shuffle(masteredTail) : [])
  ];
}

return {
  wrongQueue, dueQueue, masteredQueue, unseenQueue,
  perDeckNewSlots: Object.fromEntries(
    Object.entries(slicedByDeck).map(([id,arr])=>[id,arr.length])
  ),
  queue
};
}

  function getDeckCardsInOriginalOrder(deckId){
  const deck = DATA.decks[deckId];
  if (!deck) return [];

  return (deck.cards || [])
    .map(c => normalizeCard({...c}))
    .sort((a,b)=>
      (a.createdAtIdx ?? 0) - (b.createdAtIdx ?? 0) ||
      String(a.id).localeCompare(String(b.id))
    )
    .map(c => ({

      deckId,

    }));
}

function getCardBlocks(deckId, blockCount){
  const cards = getDeckCardsInOriginalOrder(deckId);
  const total = cards.length;
  const count = Math.max(1, Number(blockCount || 1));
  const size = Math.ceil(total / count);

  const blocks = [];

  for (let i = 0; i < count; i++){
    const start = i * size;
    const end = Math.min(start + size, total);
    if (start >= total) break;

    blocks.push({
      blockNumber: i + 1,
      startIndex: start,
      endIndex: end - 1,
      cards: cards.slice(start, end)
    });
  }

  return blocks;
}

/******************************************************************
 * txt + TEXT + SPREADSHEET EXTRACTION
 ******************************************************************/
async function extractLinesFromtxt(file){
  const text = await file.text();
  return text.split(/\n/).map(l=>l.trim()).filter(Boolean);

  const lines = [];
  for (let p = 1; p <= txt.numPages; p++){
    const page = await txt.getPage(p);
    const content = await page.getTextContent();
    const byY = {};
    for (const item of content.items){
      const y = Math.round(item.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push(item.str);
    }
    const sortedYs = Object.keys(byY).map(Number).sort((a,b)=>b-a);
    for (const y of sortedYs){
      const line = byY[y].join(" ").trim();
      if (line) lines.push(line);
    }
  }
  return lines;
}

function cardsFromLinesLineByLine(lines){
  const cards = [];
  const filtered = lines.filter(l=>l.trim().length > 0);
  for (let i = 0; i+1 < filtered.length; i+=2){
    const front = filtered[i].trim();
    const back = filtered[i+1].trim();
    if (front && back) cards.push({front, back});
  }
  return cards;
}

function parseCardsFromTextSmart(text){
  const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const tabCards = [];
  for (const line of lines){
    const parts = line.split(/\t/);
    if (parts.length >= 2){
      const front = parts[0].trim();
      const back = parts.slice(1).join(" ").trim();
      if (front && back) tabCards.push({front, back});
    }
  }
  if (tabCards.length >= Math.floor(lines.length * 0.6)) return tabCards;
  const qaPattern = /^(?:Q(?:uestion)?[\s:.)\-]+)(.+)/i;
  const ansPattern = /^(?:A(?:nswer)?[\s:.)\-]+)(.+)/i;
  const qaCards = [];
  let i = 0;
  while (i < lines.length){
    const qm = lines[i].match(qaPattern);
    if (qm){
      let front = qm[1];
      let back = "";
      i++;
      while (i < lines.length){
        const am = lines[i].match(ansPattern);
        if (am){ back = am[1]; i++; break; }
        else if (lines[i].match(qaPattern)) break;
        else { front += " " + lines[i]; i++; }
      }
      if (front && back) qaCards.push({front: front.trim(), back: back.trim()});
    } else { i++; }
  }
  if (qaCards.length > 0) return qaCards;
  const sepCards = [];
  for (const line of lines){
    const m = line.match(/^(.{3,}?)\s*(?:\t| - | \| |: )\s*(.+)$/);
    if (m) sepCards.push({front: m[1].trim(), back: m[2].trim()});
  }
  if (sepCards.length >= Math.floor(lines.length * 0.5)) return sepCards;
  return cardsFromLinesLineByLine(lines);
}

async function extractCardsFromSpreadsheet(file){
  const arrayBuffer = await file.arrayBuffer();
  const workbook = XLSX.read(arrayBuffer, {type:"array"});
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
  const cards = [];
  for (const row of rows){
    if (!row || row.length < 2) continue;
    const front = String(row[0]||"").trim();
    const back = String(row[1]||"").trim();
    if (front && back) cards.push({front, back});
  }
  return cards;
}

    </div>

function dailyProgressHTML(){
  const today = todayStr();
  const st = DATA.stats[today] || {reviewed:0,correct:0,wrong:0};
  const goal = getDailyGoal();
  const reviewed = Number(st.reviewed || 0);
  const pct = goal ? Math.min(100, Math.round((reviewed/goal)*100)) : 0;
  return `
    <div class="progressCard" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">

          <span class="tag green">✓ ${st.correct||0}</span>
          <span class="tag purple">${pct}%</span>
          <button class="btnSmall" id="resetTodayStats">Reset Today</button>
          <button class="btnSmall" id="unmuteAllDecks">Unmute All</button>
        </div>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>

function mobileNavHTML(){

    {s:"manage",   icon:"▦",label:"Manage"},
    {s:"custom",   icon:"⊕",label:"Custom"},

    {s:"mcmode",   icon:"◈",label:"MC"},
  ];
  return `<nav class="mobile-nav">${items.map(i=>`

function render(){
  const root = document.getElementById("root");
  if (!root) return;

  if (SCREEN === "study"){
    root.innerHTML = `<div class="app" style="background:var(--bg)">${studyHTML()}</div>`;
    bindStudy();
    return;
  }

  const sidebar = `<div class="sidebar">${sidebarHTML()}</div>`;
  let main = "";
  if (SCREEN === "dashboard")    main = dashboardHTML();
  else if (SCREEN === "add")     main = addHTML();
  else if (SCREEN === "manage")  main = manageHTML();
  else if (SCREEN === "custom")  main = customHTML();
  else if (SCREEN === "calendar") main = calendarHTML();
  else if (SCREEN === "mcmode")  main = mcModeHTML();

  root.innerHTML = `<div class="app">${sidebar}<div class="main">${main}</div></div>${mobileNavHTML()}`;
  bindNav();
  if (SCREEN === "dashboard")    bindDashboard();
  else if (SCREEN === "add")     bindAdd();
  else if (SCREEN === "manage")  bindManage();
  else if (SCREEN === "custom")  bindCustom();
  else if (SCREEN === "calendar") bindCalendar();
  else if (SCREEN === "mcmode")  bindMCMode();
}

function stat(label, value, color){
  return `
    <div class="stat">
      <div class="v" style="color:${color}">${value}</div>
      <div class="l">${label}</div>
    </div>
  `;
}

function dashboardHTML(){
  const today = todayStr();
  const todayStats = DATA.stats[today] || {reviewed:0,correct:0,wrong:0};
  const daily = buildDailyQueue(DATA.decks, getDailyGoal());
  const totalDue = daily.queue.length;
  const allCards = Object.values(DATA.decks).flatMap(d=>d.cards||[]);
  const masteredAll = allCards.filter(c=>c.mastered).length;
  const seenAll = allCards.filter(c=>(c.seenCount||0)>0).length;
  const masteredDueTotal = allCards.filter(c=>isMasteredDue(c)).length;

  let subjects = "";
  const deckEntries = Object.entries(DATA.decks);
  if (deckEntries.length){
    subjects += `<div class="section">Subjects</div><div class="grid">`;
    for (const [id, deck] of deckEntries){
      const cards = (deck.cards||[]).map(c=>normalizeCard(c));
      const muted = isDeckMuted(id);
      const wrongCount  = cards.filter(c=>!c.mastered && c.inWrongDeck).length;
      const dueCount    = cards.filter(c=>!c.mastered && !c.inWrongDeck && (c.seenCount||0)>0 && isDue(c)).length;
      const newCount    = daily.perDeckNewSlots?.[id] || 0;
      const masteredDue = cards.filter(c=>isMasteredDue(c)).length;
      const totalToday  = muted ? 0 : wrongCount + dueCount + newCount + masteredDue;
      const mastered = cards.filter(c=>c.mastered).length;
      const seen = cards.filter(c=>(c.seenCount||0)>0).length;
      const pctMaster = cards.length ? Math.round((mastered/cards.length)*100) : 0;
      const pctSeen = cards.length ? Math.round((seen/cards.length)*100) : 0;
      const orderLabel = (deck.studyOrder==="inorder") ? "In-order" : "Random";
      subjects += `
        <div class="card">
          <div class="cardTop">
            <div>
              <div class="cardName">${escapeHTML(deck.name)}</div>
              ${muted ? `<div class="tiny" style="color:var(--orange);margin-top:6px;font-weight:900">Muted today</div>` : ``}
              <div class="tiny" style="margin-top:6px;color:var(--muted)">
                Order: <span style="color:var(--purple);font-weight:900">${orderLabel}</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <div class="pct">${pctMaster}%</div>
              <button class="btnSmall" data-mute-deck="${id}" style="padding:4px 8px">${muted?"Unmute":"Mute"}</button>
            </div>
          </div>
          <div class="meta">${cards.length} cards · <span style="color:var(--green);font-weight:900">${mastered} mastered</span></div>
          <div class="bar"><div style="width:${pctMaster}%"></div></div>
          <div class="meta" style="margin-top:8px">
            <span style="color:var(--cyan);font-weight:900">Seen: ${seen}/${cards.length} (${pctSeen}%)</span>
          </div>
          <div class="meta" style="margin-top:8px;display:flex;flex-direction:column;gap:3px">
            ${totalToday > 0 ? `
              <span style="color:var(--orange);font-weight:900">${totalToday} cards today</span>
              <span class="tiny" style="color:var(--muted2)">
                ${wrongCount>0?`<span style="color:var(--red)">✗${wrongCount} wrong</span> `:''}${dueCount>0?`<span style="color:var(--purple)">↻${dueCount} review</span> `:''}${masteredDue>0?`<span style="color:var(--green)">★${masteredDue} mastered</span> `:''}${newCount>0?`<span style="color:var(--cyan)">+${newCount} new</span>`:''}
              </span>
            ` : `<span style="color:var(--green);font-weight:900">Up to date ✓</span>`}
          </div>
        </div>
      `;
    }
    subjects += `</div>`;
    subjects += `<button class="bigBtn" id="studyAllBtn">Study All Subjects — ${Math.max(0,getDailyGoal()-todayStats.reviewed)} cards remaining today →</button>`;
  }else{
    subjects += `
      <div class="box" style="text-align:center;padding:48px 18px">
        <div style="font-size:44px;color:var(--border);margin-bottom:10px">◈</div>
        <div style="color:var(--muted);margin-bottom:18px;font-weight:900">No decks yet. Upload a txt/Excel to start.</div>
        <button class="btnPrimary" id="goAdd">+ Create First Deck</button>
      </div>
    `;
  }

  let overview = "";
  if (allCards.length){
    overview += `
      <div class="section">Overview</div>
      <div class="row">
        ${stat("Total Cards", allCards.length, "var(--text)")}
        ${stat("Mastered", masteredAll, "var(--green)")}
        ${stat("★ Due Review", masteredDueTotal, "var(--green)")}
        ${stat("Seen ≥1×", seenAll, "var(--cyan)")}
        ${stat("Wrong Deck", daily.wrongQueue.length, "var(--red)")}
        ${stat("Due Reviews", daily.dueQueue.length, "var(--purple)")}
        ${stat("New Today", daily.unseenQueue.length, "var(--orange)")}
        ${stat("Decks", Object.keys(DATA.decks).length, "var(--purple)")}
        ${stat("Correct ✓", todayStats.correct, "var(--cyan)")}
        ${stat("Wrong ✗", todayStats.wrong, "var(--red)")}
      </div>
    `;
  }

  return `${headerHTML(false)}${dailyProgressHTML()}${subjects}${overview}`;
}

function bindDashboard(){
  const a = document.getElementById("studyAllBtn");
  if (a) a.onclick = ()=> setScreen("study");
  const b = document.getElementById("goAdd");
  if (b) b.onclick = ()=> setScreen("add");
  const resetBtn = document.getElementById("resetTodayStats");
  if (resetBtn) resetBtn.onclick = ()=> updateData(d=>{ d.stats[todayStr()] = {reviewed:0,correct:0,wrong:0}; });
const unmuteBtn = document.getElementById("unmuteAllDecks");
if (unmuteBtn) unmuteBtn.onclick = ()=> {
  window.__study = null;
  updateData(d=>{
    const t = todayStr();
    if (!d.settings.mutedDecksByDay) d.settings.mutedDecksByDay = {};
    d.settings.mutedDecksByDay[t] = [];
  });
};
 document.querySelectorAll("[data-mute-deck]").forEach(btn=>{
  btn.onclick = ()=> {
    window.__study = null;
    updateData(d=>{
      const deckId = btn.dataset.muteDeck;
      const t = todayStr();
      if (!d.settings.mutedDecksByDay) d.settings.mutedDecksByDay = {};
      const list = d.settings.mutedDecksByDay[t] || [];
      d.settings.mutedDecksByDay[t] = list.includes(deckId)
        ? list.filter(x=>x!==deckId)
        : [...list, deckId];
    });
  };
});
}

function bindCustom(){
  document.getElementById("backDash").onclick = ()=> setScreen("dashboard");

  const goAddBtn = document.getElementById("goAddFromCustom");
  if (goAddBtn) goAddBtn.onclick = ()=> setScreen("add");

  // Deck filter
  const deckSel = document.getElementById("customDeckFilter");
  if (deckSel) deckSel.onchange = ()=>{ CUSTOM_FILTER_DECK = deckSel.value; render(); };
  // Split into blocks
const blockCountInput = document.getElementById("customBlockCount");
if (blockCountInput){
  blockCountInput.onchange = ()=>{
    CUSTOM_BLOCK_COUNT = Math.max(1, Number(blockCountInput.value || 1));
    render();
  };
}

document.querySelectorAll("[data-study-block]").forEach(btn=>{
  btn.onclick = ()=>{
    if (CUSTOM_FILTER_DECK === "all"){
      alert("Choose one deck first.");
      return;
    }

    const blockNumber = Number(btn.dataset.studyBlock);
    const block = getCardBlocks(CUSTOM_FILTER_DECK, CUSTOM_BLOCK_COUNT)
      .find(b => b.blockNumber === blockNumber);

    if (!block || !block.cards.length){
      alert("No cards in this block.");
      return;
    }

    CUSTOM_SELECTED.clear();
    block.cards.forEach(c => CUSTOM_SELECTED.add(c.id));

    CUSTOM_SHUFFLE = false;

    render();
  };
});

  // Status pills
  document.querySelectorAll("[data-status]").forEach(btn=>{
    btn.onclick = ()=>{ CUSTOM_FILTER_STATUS = btn.dataset.status; render(); };
  });

  // Shuffle toggle
  const shuffleToggle = document.getElementById("shuffleToggle");
  if (shuffleToggle) shuffleToggle.onchange = ()=>{ CUSTOM_SHUFFLE = shuffleToggle.checked; };

  // Select all visible
  const selAllBtn = document.getElementById("selectAllVisible");
  if (selAllBtn) selAllBtn.onclick = ()=>{
    const filtered = getFilteredCustomCards();
    filtered.forEach(c=>CUSTOM_SELECTED.add(c.id));
    render();
  };

  // Deselect all
  const deselBtn = document.getElementById("deselectAll");
  if (deselBtn) deselBtn.onclick = ()=>{ CUSTOM_SELECTED.clear(); render(); };

  // Invert selection (among currently visible filtered cards)
  const invertBtn = document.getElementById("invertSelection");
  if (invertBtn) invertBtn.onclick = ()=>{
    const filtered = getFilteredCustomCards();
    for (const c of filtered){
      if (CUSTOM_SELECTED.has(c.id)) CUSTOM_SELECTED.delete(c.id);
      else CUSTOM_SELECTED.add(c.id);
    }
    render();
  };

  // Per-deck "Select All" buttons
  document.querySelectorAll("[data-select-deck]").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const dId = btn.dataset.selectDeck;
      const filtered = getFilteredCustomCards().filter(c=>c.deckId===dId);
      const allSel = filtered.every(c=>CUSTOM_SELECTED.has(c.id));
      if (allSel) filtered.forEach(c=>CUSTOM_SELECTED.delete(c.id));
      else filtered.forEach(c=>CUSTOM_SELECTED.add(c.id));
      render();
    };
  });

  // Individual card checkboxes
  document.querySelectorAll("[data-cid]").forEach(cb=>{
    cb.onchange = ()=>{
      const id = cb.dataset.cid;
      if (cb.checked) CUSTOM_SELECTED.add(id);
      else CUSTOM_SELECTED.delete(id);
      render();
    };
  });

  function startCustomStudy(){
    if (CUSTOM_SELECTED.size === 0){ alert("Select at least one card."); return; }

    // Build queue from selected cards with deckId attached

        if (CUSTOM_SELECTED.has(rawCard.id)){
          allCards.push({...normalizeCard({...rawCard}), deckId});
        }
      }
    }

    window.__customQueue = CUSTOM_SHUFFLE ? shuffle(allCards) : allCards;
    window.__customMode  = true;
    setScreen("study");
  }

  const topBtn = document.getElementById("startCustomStudyTop");
  if (topBtn) topBtn.onclick = startCustomStudy;
  const botBtn = document.getElementById("startCustomStudyBottom");
  if (botBtn) botBtn.onclick = startCustomStudy;

function dayStatus(day){
  const st = DATA.stats[day] || {reviewed:0};
  const reviewed = Number(st.reviewed || 0);
  const goal = getDailyGoal();
  if (!reviewed) return "nodata";
  if (reviewed >= goal) return "hit";
  if (reviewed >= Math.ceil(goal * 0.5)) return "partial";
  return "missed";
}
function calendarHTML(){
  const start = DATA.settings?.appStartDate || todayStr();
  const startDate = new Date(start+"T00:00:00");
  const today = new Date(todayStr()+"T00:00:00");
  const days = [];
  for (let d = new Date(startDate); d <= today; d.setDate(d.getDate()+1)){
    days.push(localDateStr(d));
  }
  const firstDow = new Date(days[0]+"T00:00:00").getDay();
  const labels = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  let hit=0, partial=0, missed=0;
  let grid = labels.map(x=>`<div class="calLabel">${x}</div>`).join("");

    grid += `<div class="${cls}" title="${ds}">${dd}</div>`;

let MC_DECK_ID = "all";
let MC_STATE = null; // current quiz state

function parseMCTxt(text){
  // Format:
  // Q: question text
  // A- option
  // B- option
  // C- option
  // D- option
  // Answer: B explanation text
  const cards = [];
  const blocks = text.split(/\n\s*\n/).filter(Boolean);
  for (const block of blocks){
    const lines = block.split(/\n/).map(l=>l.trim()).filter(Boolean);
    let question="", options={}, answerKey="", explanation="";
    for (const line of lines){
      const qm = line.match(/^Q[:\.]?\s+(.+)/i);
      if (qm){ question = qm[1]; continue; }
      const om = line.match(/^([A-D])[\-\.\)]\s*(.+)/i);
      if (om){ options[om[1].toUpperCase()] = om[2]; continue; }
      const am = line.match(/^Answer[:\.]?\s*([A-D])[\.\-\)]?\s*(.*)/i);
      if (am){ answerKey = am[1].toUpperCase(); explanation = am[2]; continue; }
    }
    if (question && Object.keys(options).length >= 2 && answerKey){
      cards.push({ question, options, answerKey, explanation });
    }
  }
  return cards;
}

function buildMCFromDeck(deck){
  // Auto-generate MC from regular flashcard back answers
  const cards = (deck.cards||[]).filter(c=>c.front && c.back);
  if (cards.length < 4) return [];
  const result = [];
  for (let i=0; i<cards.length; i++){
    const correct = cards[i];
    const pool = cards.filter((_,j)=>j!==i);
    const shuffled = shuffle(pool).slice(0,3);
    const opts = shuffle([correct, ...shuffled]);
    const letters = ["A","B","C","D"];
    const options = {};
    let answerKey = "";
    opts.forEach((c,idx)=>{
      options[letters[idx]] = c.back;
      if (c.id === correct.id) answerKey = letters[idx];
    });
    result.push({ question: correct.front, options, answerKey, explanation: "" });
  }
  return result;
}

    const doShuffle = document.getElementById("mcShuffle")?.checked ?? true;
    let questions = [];

    if (deckVal.startsWith("mc_")){
      const id = deckVal.replace("mc_","");
      questions = (DATA.decks[id]?.mcCards || []).slice();
    } else if (deckVal === "all"){
      for (const deck of Object.values(DATA.decks)){
        if (deck.mcCards?.length) questions.push(...deck.mcCards);
        else questions.push(...buildMCFromDeck(deck));
      }
    } else {
      const deck = DATA.decks[deckVal];
      if (deck?.mcCards?.length) questions = deck.mcCards.slice();
      else questions = buildMCFromDeck(deck);
    }

    if (!questions.length){ alert("Not enough cards to build MC questions. Need at least 4."); return; }
    if (doShuffle) questions = shuffle(questions);
    questions = questions.slice(0, count);

    MC_STATE = { questions, idx:0, correct:0, answered:false, picked:null, active:true, done:false };
    render();
  };

  // Keyboard: A/B/C/D to pick, Enter/Space for next
  window.__mcKeyHandler = (e)=>{
    if (SCREEN !== "mcmode") return;
    if (!MC_STATE?.active) return;
    if (e.target?.tagName === "INPUT" || e.target?.tagName === "TEXTAREA") return;
    const key = e.key.toUpperCase();
    if (!MC_STATE.answered && ["A","B","C","D"].includes(key)){
      e.preventDefault();
      const btn = document.querySelector(`[data-pick="${key}"]`);
      if (btn) btn.click();
    }
    if (MC_STATE.answered && (e.key === "Enter" || e.code === "Space")){
      e.preventDefault();
      document.getElementById("mcNextBtn")?.click();
    }
  };
  window.addEventListener("keydown", window.__mcKeyHandler);
}

    }
    if (mode==="text"){
      modeArea.innerHTML = `
        <div style="margin-bottom:16px">
          <div class="tiny" style="font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:var(--muted)">Paste Content</div>
          <textarea class="textarea" id="textArea" rows="10" placeholder="Paste Q/A pairs, term-definition lines, or tab-separated content..."></textarea>
        </div>
      `;
      document.getElementById("textArea").oninput = (e)=>{ textContent = e.target.value; };
    }
    if (mode==="manual"){
      modeArea.innerHTML = `<div class="box">Deck created empty — add cards in Manage.</div>`;
    }
  }

  async function buildDeck(){
    if (busy) return;
    const name = document.getElementById("deckName").value.trim();
    if (!name){ pushMsg("err","Enter a deck name"); return; }
    busy = true;
    buildBtn.disabled = true;
    buildBtn.textContent = "Processing…";
    try{
      let rawCards = [];
      if (mode==="txt"){
        if (!files.length) throw new Error("Upload at least one txt");
        for (const f of files){
          pushMsg("ok", `Extracting: ${f.name}`);
          const lines = await extractLinesFromtxt(f);
          rawCards = rawCards.concat(txtLineByLine ? cardsFromLinesLineByLine(lines) : parseCardsFromTextSmart(lines.join("\n")));
        }
      }
      if (mode==="excel"){
        if (!files.length) throw new Error("Upload an Excel/CSV file");
        rawCards = await extractCardsFromSpreadsheet(files[0]);
      }
      if (mode==="text"){
        if (!textContent.trim()) throw new Error("Paste some text");
        rawCards = parseCardsFromTextSmart(textContent);
      }
      if (mode==="manual") rawCards = [];
      const seen = new Set();
      const clean = [];
      for (const c of rawCards){
        const front = (c.front||"").trim();
        const back  = (c.back||"").trim();
        if (!front || !back) continue;
        const k = front+"||"+back;
        if (seen.has(k)) continue;
        seen.add(k);
        clean.push({front: front.slice(0,500), back: back.slice(0,500)});
      }
      const cards = clean.map((c,i)=>makeCard({
        id: `${Date.now()}_${i}`,
        front: c.front,
        back: c.back,
        createdAtIdx: i
      }));
      const deckId = `deck_${Date.now()}`;
      const order = deckOrderSel.value;
      updateData(d=>{
        d.decks[deckId] = { name, studyOrder: order, cards, createdAt: new Date().toISOString() };
      });
      pushMsg("ok", `Created deck "${name}" with ${cards.length} cards`);
      setScreen("manage");
    }catch(e){
      pushMsg("err", e.message || "Error");
    }finally{
      busy = false;
      buildBtn.disabled = false;
      buildBtn.textContent = (mode==="manual") ? "Create Empty Deck" : "Extract & Create Deck";
    }
  }

  modeButtons.forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));
  buildBtn.onclick = buildDeck;
  renderModeArea();
}

function manageHTML(){

function bindManage(){
  document.getElementById("backDash").onclick = ()=> setScreen("dashboard");
  const deckList = document.getElementById("deckList");
  const deckPanel = document.getElementById("deckPanel");
  let selected = null;
  let filter = "all";
  let editingCardId = null;
  let draftFrontImg = null;
  let draftBackImg = null;

  // ── Bulk Add State ──────────────────────────────────────────
  let bulkOpen = false;
  let bulkMode = "text";   // "text" | "file"
  let bulkCards = [];      // parsed preview cards

  function renderDeckList(){
    const entries = Object.entries(DATA.decks);
    if (!entries.length){
      deckList.innerHTML = `<div class="box" style="color:var(--muted)">No decks yet</div>`;
      deckPanel.innerHTML = `<div class="box" style="color:var(--muted)">Create a deck first</div>`;
      return;
    }
    if (!selected) selected = entries[0][0];
    deckList.innerHTML = entries.map(([id, deck])=>{
      const cards = (deck.cards||[]).map(c=>normalizeCard(c));
      const mastered = cards.filter(c=>c.mastered).length;
      const seen = cards.filter(c=>(c.seenCount||0)>0).length;
      const pctSeen = cards.length ? Math.round((seen/cards.length)*100) : 0;
      return `
        <div class="deckItem ${selected===id?'active':''}" data-deck="${id}">
          <div style="font-weight:900">${escapeHTML(deck.name)}</div>
          <div class="tiny" style="color:var(--muted)">${cards.length} cards · ${mastered} mastered</div>
          <div class="tiny" style="color:var(--cyan);margin-top:3px">Seen: ${seen}/${cards.length} (${pctSeen}%)</div>
        </div>
      `;
    }).join("");
    deckList.querySelectorAll("[data-deck]").forEach(el=>{
      el.onclick = ()=>{
        selected = el.dataset.deck;
        editingCardId = null;
        bulkOpen = false;
        bulkCards = [];
        renderDeckList();
        renderPanel();
      };
    });
    renderPanel();
  }

  function renderBulkPanel(container){
    const existingKeys = new Set(
      (DATA.decks[selected]?.cards||[]).map(c=> c.front.trim()+"||"+c.back.trim())
    );
    const newCount = bulkCards.filter(c=>!existingKeys.has(c.front.trim()+"||"+c.back.trim())).length;
    const dupCount = bulkCards.length - newCount;

    const previewRows = bulkCards.map((c,i)=>{
      const isDup = existingKeys.has(c.front.trim()+"||"+c.back.trim());
      return `<div class="bulkPreviewRow${isDup?' dup':''}">
        <span class="bulkNum">${i+1}</span>
        <span class="bulkPreviewF">${escapeHTML(c.front)}</span>
        <span style="color:var(--muted2);flex-shrink:0;font-size:11px">→</span>
        <span class="bulkPreviewB">${escapeHTML(c.back)}</span>
        ${isDup?`<span style="font-size:10px;color:var(--orange);background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.25);border-radius:4px;padding:1px 6px;font-weight:900;flex-shrink:0">dup</span>`:''}
      </div>`;
    }).join("");

    container.innerHTML = `
      <div class="bulkPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span style="font-size:13px;font-weight:900;color:var(--cyan);text-transform:uppercase;letter-spacing:.08em">⊕ Bulk Add Cards to "${escapeHTML(DATA.decks[selected]?.name||'')}"</span>
          <button class="btnSmall" id="closeBulkBtn">✕ Close</button>
        </div>

        <!-- Mode tabs -->
<div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="modeBtn ${bulkMode==='text'?'active':''}" id="bulkTabText" style="max-width:180px">
    ✎ Paste Text
  </button>
  <button class="modeBtn ${bulkMode==='file'?'active':''}" id="bulkTabFile" style="max-width:180px">
    ↑ Upload txt
  </button>
</div> Excel / CSV)</button>
        </div>

        <!-- Input area -->
        ${bulkMode==='text' ? `
          <div>
            <textarea class="textarea" id="bulkTextArea" rows="7"
              placeholder="Paste any format — all are auto-detected:\n\nTerm - Definition\nQ: Question\nA: Answer\nFront[TAB]Back\nFront | Back"></textarea>
            <button class="btnSmall" id="bulkParseBtn"
              style="margin-top:8px;color:var(--purple);border-color:rgba(129,140,248,.3);padding:7px 16px">
              ▶ Preview Cards
            </button>
          </div>
        ` : `
          <div>
            <div class="upload" id="bulkUploadZone" style="padding:18px 14px">
              <div style="font-size:22px;margin-bottom:6px">◉</div>
              <div style="color:var(--muted);font-weight:900">Click to upload txt, .xlsx, or .csv</div>
            </div>
            <input type="file" id="bulkFileInput" accept=".txt,.xlsx,.xls,.csv" style="display:none"/>
          </div>
        `}

        <!-- Preview -->
        ${bulkCards.length ? `
          <div>
            <div style="font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px">
              Preview — ${bulkCards.length} parsed ·
              <span style="color:var(--cyan)">${newCount} new</span> ·
              <span style="color:var(--orange)">${dupCount} duplicate${dupCount!==1?'s':''}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto;
              background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:8px 10px">
              ${previewRows}
            </div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button id="bulkAddNewBtn"
              style="padding:9px 18px;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.35);
                border-radius:9px;color:var(--cyan);font-weight:900;font-size:13px;${newCount===0?'opacity:.4;cursor:default':''}"
              ${newCount===0?'disabled':''}>
              + Add ${newCount} New Card${newCount!==1?'s':''}
            </button>
            <button id="bulkAddAllBtn"
              style="padding:9px 18px;background:transparent;border:1px solid var(--border);
                border-radius:9px;color:var(--muted);font-weight:900;font-size:13px;">
              Add All ${bulkCards.length} (incl. duplicates)
            </button>
            <button class="btnSmall btnDanger" id="bulkClearBtn">Clear</button>
          </div>
        ` : ''}
      </div>
    `;

    // bind close
    container.querySelector("#closeBulkBtn").onclick = ()=>{
      bulkOpen = false; bulkCards = []; renderPanel();
    };

    // bind tabs
    container.querySelector("#bulkTabText").onclick = ()=>{ bulkMode="text"; bulkCards=[]; renderBulkPanel(container); };
    container.querySelector("#bulkTabFile").onclick = ()=>{ bulkMode="file"; bulkCards=[]; renderBulkPanel(container); };

    if (bulkMode==="text"){
      const ta = container.querySelector("#bulkTextArea");
      container.querySelector("#bulkParseBtn").onclick = ()=>{
        const text = (ta?.value||"").trim();
        if (!text){ alert("Paste some text first."); return; }
        const parsed = parseCardsFromTextSmart(text)
          .map(c=>({front:(c.front||"").slice(0,500), back:(c.back||"").slice(0,500)}))
          .filter(c=>c.front && c.back);
        if (!parsed.length){ alert("Could not parse any cards.\n\nTry: Term - Definition, or Q:/A: format, or Tab-separated."); return; }
        bulkCards = parsed;
        renderBulkPanel(container);
      };
    } else {
      const zone = container.querySelector("#bulkUploadZone");
      const fi   = container.querySelector("#bulkFileInput");
      if (zone) zone.onclick = ()=> fi?.click();
      if (fi) fi.onchange = async (e)=>{
        const file = e.target.files?.[0]; if (!file) return;
        if (zone) zone.innerHTML = `<div style="color:var(--muted);font-weight:900">Processing "${escapeHTML(file.name)}"…</div>`;
        try{
          let parsed = [];
          if (file.name.match(/\.txt$/i)){
            const lines = await extractLinesFromtxt(file);
            parsed = parseCardsFromTextSmart(lines.join("\n"));
          } else {
            parsed = await extractCardsFromSpreadsheet(file);
          }
          bulkCards = parsed
            .map(c=>({front:(c.front||"").slice(0,500), back:(c.back||"").slice(0,500)}))
            .filter(c=>c.front && c.back);
          if (!bulkCards.length) alert("No card pairs found in this file.");
        }catch(err){
          alert("Error reading file: " + err.message);
          bulkCards = [];
        }
        renderBulkPanel(container);
      };
    }

    function doCommit(inclDups){
      const existingKeys2 = new Set(
        (DATA.decks[selected]?.cards||[]).map(c=> c.front.trim()+"||"+c.back.trim())
      );
      const toAdd = inclDups
        ? bulkCards
        : bulkCards.filter(c=>!existingKeys2.has(c.front.trim()+"||"+c.back.trim()));
      if (!toAdd.length){ alert("No cards to add."); return; }
      updateData(d=>{
        const dk = d.decks[selected];
        const startIdx = dk.cards.length;
        toAdd.forEach((c,i)=>{
          dk.cards.push(makeCard({
            id: `${Date.now()}_bulk_${i}_${Math.random().toString(36).slice(2)}`,
            front: c.front,
            back: c.back,
            createdAtIdx: startIdx + i
          }));
        });
      });
      const deckName = DATA.decks[selected]?.name || "";
      bulkOpen = false;
      bulkCards = [];
      alert(`✓ Added ${toAdd.length} card${toAdd.length!==1?'s':''} to "${deckName}"`);
      // updateData already called render(), panel is fresh
    }

    const addNewBtn = container.querySelector("#bulkAddNewBtn");
    const addAllBtn = container.querySelector("#bulkAddAllBtn");
    const clearBtn  = container.querySelector("#bulkClearBtn");
    if (addNewBtn) addNewBtn.onclick = ()=> doCommit(false);
    if (addAllBtn) addAllBtn.onclick = ()=> doCommit(true);
    if (clearBtn)  clearBtn.onclick  = ()=>{ bulkCards=[]; renderBulkPanel(container); };
  }

  function renderPanel(){
    if (!selected || !DATA.decks[selected]){
      deckPanel.innerHTML = `<div class="box" style="color:var(--muted)">Select a deck</div>`;
      return;
    }
    const deck = DATA.decks[selected];
    const cardsAll = (deck.cards||[]).map(c=>normalizeCard(c));

      filter==="due" ? isDue(c) :

        draftBackImg = null;
        editingCardId = null;
        renderPanel();
      };
      const frontPaste = deckPanel.querySelector("#frontPaste");
      const backPaste = deckPanel.querySelector("#backPaste");

      frontPaste.onpaste = async (e)=>{
        const b64 = await clipboardImageToBase64(e);
        if (b64){ draftFrontImg = b64; renderPanel(); }
      };
      backPaste.onpaste = async (e)=>{
        const b64 = await clipboardImageToBase64(e);
        if (b64){ draftBackImg = b64; renderPanel(); }
      };
      deckPanel.querySelector("#frontFile").onchange = async (e)=>{
        const file = e.target.files?.[0];
        if (file){ draftFrontImg = await fileToBase64(file); renderPanel(); }
      };
      deckPanel.querySelector("#backFile").onchange = async (e)=>{
        const file = e.target.files?.[0];
        if (file){ draftBackImg = await fileToBase64(file); renderPanel(); }
      };
      deckPanel.querySelector("#clearFrontImg").onclick = ()=>{ draftFrontImg = null; renderPanel(); };
      deckPanel.querySelector("#clearBackImg").onclick  = ()=>{ draftBackImg = null; renderPanel(); };

      deckPanel.querySelector("#saveCard").onclick = ()=>{
        const nf = deckPanel.querySelector("#efront").value.trim();
        const nb = deckPanel.querySelector("#eback").value.trim();
        const pref = deckPanel.querySelector("#prefMode").value;

        if (!nf && !draftFrontImg) { alert("Add front text or image."); return; }
        if (!nb && !draftBackImg) { alert("Add back text or image."); return; }

        updateData(d=>{
          const deckRef = d.decks[selected];
          if (isNew){
            const idx = deckRef.cards.length;
            const nc = makeCard({
              id: String(Date.now()),
              front: nf,
              back: nb,
              frontImage: draftFrontImg,
              backImage: draftBackImg,
              createdAtIdx: idx
            });
            nc.adaptivePref = pref;
            deckRef.cards.push(nc);
          }else{
            const idx = deckRef.cards.findIndex(x=>x.id===c.id);
            if (idx>=0){
              deckRef.cards[idx] = {
                ...deckRef.cards[idx],
                front: nf,
                back: nb,
                frontImage: draftFrontImg,
                backImage: draftBackImg,
                adaptivePref: pref
              };
            }
          }
        });
        draftFrontImg = null;
        draftBackImg = null;
        editingCardId = null;
      };
    }
  }

  renderDeckList();
}

      const c = st.requeue[st.reqIdx];
      st.active = c ? { card: c, source: "requeue", learningIndex: -1 } : null;

    if (mode === "typed" && wrongs >= threshold) mode = decideAdaptiveMode(card);

}

    if (card.frontImage){
      frontImg.src = card.frontImage;
      frontImg.style.display = "block";
    } else {
      frontImg.style.display = "none";
    }

    if (mode === "cloze"){
      const cl = makeCloze(card.back);
      qtext.textContent = cl.clozeText;
    } else {
      qtext.textContent = card.front || "(no front text)";
    }

    if (mode === "mc" && st.phase === "question"){
      typedPane.style.display = "none";
      mcOptions.style.display = "flex";
      const deckCards = getDeckCards(card.deckId);
      st.mc = buildMCOptions(card, deckCards, 4);
      st.mcPicked = null;

      mcOptions.innerHTML = st.mc.options.map((opt,i)=>`
        <button class="mcBtn" data-mc="${i}">
          ${String.fromCharCode(65+i)}. ${escapeHTML(opt)}
        </button>
      `).join("");

      mcOptions.querySelectorAll("[data-mc]").forEach(btn=>{
        btn.onclick = ()=>{
          const pick = st.mc.options[Number(btn.dataset.mc)];
          st.mcPicked = pick;
          st.result = (normalizeStr(pick) === normalizeStr(st.mc.correct)) ? "correct" : "wrong";
          st.phase = "revealed";
          refresh();
        };
      });
    } else {
      mcOptions.style.display = "none";
      typedPane.style.display = (st.phase === "question") ? "block" : "none";
    }

    revealPane.style.display = (st.phase === "revealed") ? "flex" : "none";
    const masteredBtn = document.querySelector('[data-rate="mastered"]');
if (masteredBtn){
  masteredBtn.style.display = (st.active?.source === "requeue") ? "none" : "";
}

    if (st.phase === "question" && mode !== "mc"){
      ansInput.placeholder = (mode==="cloze") ? "Fill in the blank…" : "Type your answer…";
      const isTypingHere = (document.activeElement === ansInput);
      if (!isTypingHere && ansInput.value !== (st.input || "")) ansInput.value = st.input || "";
      if (st.justAdvanced){
        st.justAdvanced = false;
        setTimeout(()=>ansInput.focus(), 0);
      }
    }

    if (st.phase === "revealed"){
      banner.className =
        st.result === "correct" ? "banner correct" :
        st.result === "close" ? "banner close" :
        st.result === "revealed" ? "banner" :
        "banner wrong";

      banner.textContent =
        st.result === "correct" ? "✓ Correct!" :
        st.result === "close" ? "≈ Close — review full answer" :
        st.result === "revealed" ? "👁 Revealed" :
        "✗ Incorrect";

      const you = (mode==="mc")
        ? (st.mcPicked || (st.revealedBySpace ? "(revealed)" : ""))
        : (st.input || (st.revealedBySpace ? "(revealed)" : ""));

      youAns.textContent = you;
      youAns.style.color = (st.result==="wrong") ? "var(--red)" : "var(--text)";

      trueAns.textContent = card.back;

      if (card.backImage){
        backImg.src = card.backImage;
        backImg.style.display = "block";
      } else {
        backImg.style.display = "none";
      }
    }

    sc.textContent = st.sess.correct;
    sw.textContent = st.sess.wrong;
    srq.textContent = st.requeue.length;
    sst.textContent = st.sess.starred;

    if (sleft){
      const already = (DATA.stats[todayStr()]?.reviewed || 0);
      sleft.textContent = Math.max(0, getDailyGoal() - already);
    }

    const sec = Math.floor((nowMs() - st.sessionStartedAt)/1000);
    stimer.textContent = `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
  }

  function doCheckTyped(){
    const card = currentCard();
    if (!card) return;
    const mode = getModeForCard(card);
    if (mode === "mc") return;

    const input = ansInput.value.trim();
    if (!input) return;

    st.input = input;
    const ans = (mode === "cloze") ? makeCloze(card.back).answer : card.back;
    st.result = checkAnswer(input, ans);
    st.phase = "revealed";
    refresh();
  }

  function advance(){
    st.input = "";
    st.result = null;
    st.mc = null;
    st.mcPicked = null;
    st.phase = "question";
    st.revealedBySpace = false;
    st.active = null;
    st.justAdvanced = true;

    if (st.isRequeue){
      if (st.reqIdx >= st.requeue.length){
        st.isRequeue = false;
        st.idx = st.primaryQueue.length;
      }
    } else {
      if (st.idx + 1 < st.primaryQueue.length){
        st.idx++;
      } else if (st.requeue.length){
        st.isRequeue = true;
        st.reqIdx = 0;
      } else {
        st.idx = st.primaryQueue.length;
      }
    }

    pickNextActive();
    refresh();
  }

function rateWithLabel(label, quality){
  const card = currentCard();
  if (!card) return;

  const current = DATA.decks[card.deckId]?.cards?.find(c => c.id === card.id) || card;

  const pressedWrong = label === "wrong";
  const pressedCorrect = label === "correct";
  const pressedMastered = label === "mastered";

  let newCard;

  if (pressedWrong){
    newCard = sm2(current, 0);
    newCard.seenCount = (current.seenCount || 0) + 1;
    newCard.lastSeenOn = todayStr();
    newCard.wrongCount = (current.wrongCount || 0) + 1;
    newCard.inWrongDeck = true;
    newCard.mastered = false;

    const threshold = newCard.adaptiveThreshold ?? 3;
    newCard.adaptiveMode =
      ((newCard.wrongCount || 0) >= threshold) ? decideAdaptiveMode(newCard) : "typed";

    updateData(d => {
      const dk = d.decks[card.deckId];
      const ci = dk?.cards?.findIndex(c => c.id === card.id);
      if (ci >= 0) dk.cards[ci] = newCard;

      const t = st.today;
      if (!d.stats[t]) d.stats[t] = { reviewed: 0, correct: 0, wrong: 0 };
      d.stats[t].reviewed += 1;
      d.stats[t].wrong += 1;
    });

    st.sess.total += 1;
    st.sess.wrong += 1;
    st.sess.requeues += 1;

    // IMPORTANT: do NOT advance.
    // Stay on this same card until Correct or Mastered.
    st.input = "";
    st.result = null;
    st.mc = null;
    st.mcPicked = null;
    st.phase = "question";
    st.revealedBySpace = false;
    st.active = {
      card: { ...newCard, deckId: card.deckId },
      source: st.active?.source || "primary",
      learningIndex: -1
    };

    refresh();
    return;
  }

  if (pressedMastered){
    newCard = sm2(current, 5);
    newCard.seenCount = (current.seenCount || 0) + 1;
    newCard.lastSeenOn = todayStr();
    newCard.inWrongDeck = false;
    newCard.mastered = true;
    newCard.adaptiveMode = "typed";
  }

  else if (pressedCorrect){
    newCard = sm2(current, 3);
    newCard.seenCount = (current.seenCount || 0) + 1;
    newCard.lastSeenOn = todayStr();

    // Correct moves on, but if it was in wrong deck, it stays there.
    // Only Mastered removes it from wrong deck.
    newCard.wrongCount = current.wrongCount || 0;
    newCard.inWrongDeck = current.inWrongDeck || false;
    newCard.mastered = false;

    const threshold = newCard.adaptiveThreshold ?? 3;
    newCard.adaptiveMode =
      ((newCard.wrongCount || 0) >= threshold) ? decideAdaptiveMode(newCard) : "typed";
  }

  else {
    return;
  }

  updateData(d => {
    const dk = d.decks[card.deckId];
    const ci = dk?.cards?.findIndex(c => c.id === card.id);
    if (ci >= 0) dk.cards[ci] = newCard;

    const t = st.today;
    if (!d.stats[t]) d.stats[t] = { reviewed: 0, correct: 0, wrong: 0 };
    d.stats[t].reviewed += 1;
    d.stats[t].correct += 1;
  });

  st.sess.total += 1;
  st.sess.correct += 1;

  // remove from same-session requeue if it exists
  st.requeue = st.requeue.filter(c => c.id !== newCard.id);

  if (st.active?.source === "learning" && st.active.learningIndex >= 0){
    st.learning.splice(st.active.learningIndex, 1);
  }

  if (st.isRequeue){
    st.reqIdx++;
  }

  advance();
}

  checkBtn.onclick = doCheckTyped;
  if (revealBtn) revealBtn.onclick = revealAnswerNeutral;
const skipBtn = document.getElementById("skipBtn");
if (skipBtn) skipBtn.onclick = ()=>{
  if (st.phase !== "question") return;
  const card = currentCard();
  if (card) st.requeue.push({...card});
  st.skipCount = (st.skipCount || 0) + 1;
  advance();
};
  ansInput.oninput = (e)=>{ st.input = e.target.value; };
 ansInput.onkeydown = (e)=>{
  if (e.key === "Enter") doCheckTyped();
  if (e.code === "Space" && ansInput.value === "") {
    e.preventDefault();
    const card = currentCard();
    if (card) st.requeue.push({...card});
    st.skipCount = (st.skipCount || 0) + 1;
    advance();
  }
};
  document.querySelectorAll("[data-rate]").forEach(btn=>{
  btn.onclick = ()=>{
    const id = btn.dataset.rate;
    if (id === "wrong") rateWithLabel("wrong", 0);
    if (id === "correct") rateWithLabel("correct", 3);
    if (id === "mastered") rateWithLabel("mastered", 5);
  };
});
const prevBtn = document.getElementById("prevBtn");
if (prevBtn) prevBtn.onclick = ()=>{
  if (st.phase === "revealed") return; // only from question phase
  if (st.isRequeue){
    if (st.reqIdx > 0) st.reqIdx--;
  } else {
    if (st.idx > 0) st.idx--;
  }
  st.input = "";
  st.result = null;
  st.mc = null;
  st.mcPicked = null;
  st.phase = "question";
  st.revealedBySpace = false;
  st.active = null;
  st.justAdvanced = true;
  pickNextActive();
  refresh();
};
  window.__studyKeyHandler = (e)=>{
    if (SCREEN !== "study") return;

    const card = currentCard();
    if (!card) return;

    const typingInAnswer =
      document.activeElement === ansInput ||
      e.target === ansInput ||
      e.target?.tagName === "INPUT" ||
      e.target?.tagName === "TEXTAREA" ||
      e.target?.isContentEditable;

    if (typingInAnswer) {
      if (e.key === "Enter") {
        e.preventDefault();
        doCheckTyped();
      }
      return;
    }

    if (e.key.toLowerCase() === "s"){
      e.preventDefault();
      updateData(d=>{
        const c = d.decks[card.deckId]?.cards?.find(x=>x.id===card.id);
        if (c) c.starred = !c.starred;
      });
      st.sess.starred += 1;
      refresh();
      return;
    }

    if (e.code === "Space"){
  e.preventDefault();
  if (st.phase === "question"){
    const card = currentCard();
    if (card) st.requeue.push({...card});
    st.skipCount = (st.skipCount || 0) + 1;
    advance();
  }
  return;
}
    
     if (st.phase === "revealed"){
  if (e.key === "1") { e.preventDefault(); rateWithLabel("wrong", 0); return; }
  if (e.key === "2") { e.preventDefault(); rateWithLabel("correct", 3); return; }
  if (e.key === "3") { e.preventDefault(); rateWithLabel("mastered", 5); return; }
}
  };

  window.addEventListener("keydown", window.__studyKeyHandler);

  pickNextActive();
  window.__studyInterval = setInterval(()=>{ refresh(); }, 800);
  refresh();
}

/******************************************************************
 * IMPORT / EXPORT
 ******************************************************************/
 function exportDeck(deckId){
  const deck = DATA.decks[deckId];
  if (!deck) return;
  const cards = (deck.cards || []).filter(c => c.front && c.back);
  const name = deck.name || "deck";

  const fmt = prompt(
    `Export "${name}" (${cards.length} cards)\n\nEnter format:\n  1 = Tab-separated (re-importable into RECALL)\n  2 = Q/A text\n  3 = CSV`,
    "1"
  );
  if (!fmt) return;

  let content = "", ext = "txt", mime = "text/plain";

  if (fmt.trim() === "1"){
    content = cards.map(c => `${c.front}\t${c.back}`).join("\n");
    ext = "txt";
  } else if (fmt.trim() === "2"){
    content = cards.map((c,i) => `Q: ${c.front}\nA: ${c.back}`).join("\n\n");
    ext = "txt";
  } else if (fmt.trim() === "3"){
    const esc = s => `"${String(s).replace(/"/g,'""')}"`;
    content = "Front,Back\n" + cards.map(c => `${esc(c.front)},${esc(c.back)}`).join("\n");
    ext = "csv"; mime = "text/csv";
  } else {
    alert("Invalid choice."); return;
  }

  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${name.replace(/[^a-z0-9]/gi,"_")}.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportData(){
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  const date = todayStr();
  a.href     = url;
  a.download = `recall-backup-${date}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if (!parsed || typeof parsed !== "object" || !parsed.decks){
        alert("Invalid backup file — missing deck data.");
        return;
      }
      if (!confirm(`Import backup? This will MERGE with your current data.\n\nDecks in backup: ${Object.keys(parsed.decks||{}).length}\n\nExisting decks with the same ID will be overwritten. Continue?`)) return;
      updateData(d=>{
        for (const [id, deck] of Object.entries(parsed.decks||{})) d.decks[id] = deck;
        for (const [day, st] of Object.entries(parsed.stats||{})){
          if (!d.stats[day]){
            d.stats[day] = st;
          } else {
            d.stats[day].reviewed = Math.max(d.stats[day].reviewed||0, st.reviewed||0);
            d.stats[day].correct  = Math.max(d.stats[day].correct||0,  st.correct||0);
            d.stats[day].wrong    = Math.max(d.stats[day].wrong||0,    st.wrong||0);
          }
        }
        if (parsed.settings?.appStartDate){
          const cur = d.settings.appStartDate || todayStr();
          d.settings.appStartDate = parsed.settings.appStartDate < cur ? parsed.settings.appStartDate : cur;
        }
      });
      alert("Import successful! Your data has been merged.");
    }catch(err){
      alert("Failed to parse backup file: " + err.message);
    }
  };
  r.readAsText(file);
}

};

if (wrongHandlingSel){

}

// ── Mobile sidebar drawer ──────────────────────────────────
function toggleMobileSidebar(){
  let overlay = document.getElementById("mobileSidebarOverlay");
  if (!overlay){
    // Create overlay + drawer
    overlay = document.createElement("div");
    overlay.id = "mobileSidebarOverlay";
    overlay.className = "mobile-sidebar-overlay";
    overlay.onclick = (e)=>{ if(e.target===overlay) closeMobileSidebar(); };

    const drawer = document.createElement("div");
    drawer.id = "mobileSidebarDrawer";
    drawer.className = "mobile-sidebar-drawer";
    drawer.innerHTML = sidebarHTML();
    overlay.appendChild(drawer);
    document.body.appendChild(overlay);

    // bind the sidebar controls inside drawer
    drawer.querySelectorAll("[data-nav]").forEach(btn=>{
      btn.onclick = ()=>{ closeMobileSidebar(); setScreen(btn.dataset.nav); };
    });
    const resetAllBtn = drawer.querySelector("#resetAllBtn");
    if (resetAllBtn) resetAllBtn.onclick = hardResetAll;
    const exportBtn = drawer.querySelector("#exportBtn");
    if (exportBtn) exportBtn.onclick = exportData;
    const importFile = drawer.querySelector("#importFile");
    if (importFile) importFile.onchange = (e)=>{ importData(e.target.files?.[0]); e.target.value=""; };
    const modeSel = drawer.querySelector("#studyModeSel");
    if (modeSel) modeSel.onchange = ()=>{ window.__study=null; updateData(d=>{ d.settings.studyMode=modeSel.value; }); };
    const strictSel = drawer.querySelector("#strictSel");
    if (strictSel) strictSel.onchange = ()=> updateData(d=>{ d.settings.strictness=strictSel.value; });
    const saveGoal = drawer.querySelector("#saveGoal");
    if (saveGoal) saveGoal.onclick = ()=>{
      const v = Number(drawer.querySelector("#goalInput")?.value || 150);
      updateData(d=>{ d.settings.dailyGoal = Math.min(9999,Math.max(10,v)); });
    };
    const saveMG = drawer.querySelector("#saveMasteredGoal");
    if (saveMG) saveMG.onclick = ()=>{
      const v = Number(drawer.querySelector("#masteredGoalInput")?.value ?? 15);
      updateData(d=>{ d.settings.masteredReviewPerDay = Math.min(200,Math.max(0,v)); });
    };
    const mhSel = drawer.querySelector("#masteredHandlingSel");
    if (mhSel){ mhSel.value = DATA.settings?.masteredHandling||"mix"; mhSel.onchange=()=>updateData(d=>{ d.settings.masteredHandling=mhSel.value; }); }
    const whSel = drawer.querySelector("#wrongHandlingSel");
    if (whSel){ whSel.value = DATA.settings?.wrongHandling||"front"; whSel.onchange=()=>updateData(d=>{ d.settings.wrongHandling=whSel.value; }); }

    // Animate in
    requestAnimationFrame(()=>{
      overlay.classList.add("open");
      drawer.classList.add("open");
    });
  } else {
    closeMobileSidebar();
  }
}

function closeMobileSidebar(){
  const overlay = document.getElementById("mobileSidebarOverlay");
  const drawer  = document.getElementById("mobileSidebarDrawer");
  if (!overlay) return;
  overlay.classList.remove("open");
  drawer?.classList.remove("open");
  setTimeout(()=>{ overlay.remove(); }, 250);
}
