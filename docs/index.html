<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MCAT TRACKER | Ultimate Pro</title>
 <title>MCAT TRACKER | Ultimate Pro</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
    input, select { outline: none; background: transparent; border: none; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 7px; font-weight: 800; text-transform: uppercase; transition: all 0.2s; padding: 0 2px; }
    .nav-item.active { color: #4f46e5; transform: translateY(-2px); }
    .nav-item.inactive { color: #94a3b8; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .todo-check:checked + span { text-decoration: line-through; opacity: 0.5; }
    .login-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    .custom-scroll { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .custom-scroll::-webkit-scrollbar { display: none; }
    @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide { animation: slideIn 0.25s ease-out; }
    .progress-bar { transition: width 0.6s ease; }
    .heat-0 { background: #e2e8f0; }
    .heat-1 { background: #c7d2fe; }
    .heat-2 { background: #818cf8; }
    .heat-3 { background: #4f46e5; }
  </style>
</head>
<body class="pb-24">
  <div id="root"></div>
  <script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { useEffect, useMemo, useRef, useState } from 'https://esm.sh/preact/hooks';
    import htm from 'https://esm.sh/htm';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDSw5TCS2Kw9rfA7bQq21Und8FGcXph2CY",
      authDomain: "aniya-mcat.firebaseapp.com",
      projectId: "aniya-mcat",
      storageBucket: "aniya-mcat.firebasestorage.app",
      messagingSenderId: "480186345968",
      appId: "1:480186345968:web:d6175252b1df30f3555535",
      measurementId: "G-5FRG3GMLJQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const html = htm.bind(h);

    const localISO = (d = new Date()) => {
      const off = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - off).toISOString().split('T')[0];
    };

    const SYLLABUS = {
      "Gen Chem": ["Ch 1: Atomic Structure","Ch 2: Periodic Table","Ch 3: Bonding","Ch 4: Stoichiometry","Ch 5: Kinetics","Ch 6: Equilibrium","Ch 7: Thermochemistry","Ch 8: Gas Phase","Ch 9: Solutions","Ch 10: Acids and Bases","Ch 11: Redox","Ch 12: Electrochemistry"],
      "Orgo": ["Ch 1: Nomenclature","Ch 2: Isomers","Ch 3: Bonding","Ch 4: Analyzing Reactions","Ch 5: Alcohols","Ch 6: Aldehydes I","Ch 7: Aldehydes II","Ch 8: Carboxylic Acids","Ch 9: CA Derivatives","Ch 10: N and P Compounds","Ch 11: Spectroscopy","Ch 12: Separations"],
      "Physics": ["Ch 1: Kinematics","Ch 2: Energy","Ch 3: Thermo","Ch 4: Fluids","Ch 5: Magnetism","Ch 6: Circuits","Ch 7: Waves","Ch 8: Optics","Ch 9: Atomic","Ch 10: Math","Ch 11: Research","Ch 12: Stats"],
      "Biology": ["Ch 1: The Cell","Ch 2: Reproduction","Ch 3: Embryogenesis","Ch 4: Nervous System","Ch 5: Endocrine","Ch 6: Respiratory","Ch 7: Cardiovascular","Ch 8: Immune","Ch 9: Digestive","Ch 10: Homeostasis","Ch 11: Musculoskeletal","Ch 12: Genetics"],
      "Biochem": ["Ch 1: Amino Acids","Ch 2: Enzymes","Ch 3: Protein Analysis","Ch 4: Carbohydrates","Ch 5: Lipids","Ch 6: DNA/Biotech","Ch 7: RNA/Code","Ch 8: Membranes","Ch 9: Metabolism I","Ch 10: Metabolism II","Ch 11: Lipid/AA Metabolism","Ch 12: Bioenergetics"],
      "Psych Soc": ["Ch 1: Biological Bases","Ch 2: Sensation","Ch 3: Learning/Memory","Ch 4: Cognition/Language","Ch 5: Motivation/Emotion","Ch 6: Identity/Personality","Ch 7: Social Interaction","Ch 8: Social Structure","Ch 9: Demographics","Ch 10: Social Stratification"]
    };

    const ACC_SOURCES = ["UWorld","AAMC QPack","AAMC Section Bank","AAMC Independent Question Bank","Jack Westin","Bootcamp","Blueprint","Kaplan QBank","Princeton Review","Altius","Khan Academy","Other"];
    const ACC_CATEGORIES = ["C/P","CARS","B/B","P/S","Bio","Gen Chem","Orgo","Physics","Biochem","Psych","Soc"];
    const ACC_MODES = ["Passage","Discrete"];
    const CARS_SOURCES = ["Jack Westin","AAMC QPack","AAMC Section Bank","Blueprint","Kaplan","Princeton Review","Bootcamp","Other"];

    const SUBJ_COLORS = {
      "Gen Chem":  { bar: "#3b82f6", bg: "bg-blue-500" },
      "Orgo":      { bar: "#a855f7", bg: "bg-purple-500" },
      "Physics":   { bar: "#f97316", bg: "bg-orange-500" },
      "Biology":   { bar: "#22c55e", bg: "bg-green-500" },
      "Biochem":   { bar: "#14b8a6", bg: "bg-teal-500" },
      "Psych Soc": { bar: "#ec4899", bg: "bg-pink-500" }
    };

    const DEFAULT_DATA = {
      topics: {}, chapterAliases: {}, hiddenChapters: {},
      customChapters: {},
      deletedChapters: {},
      activeRotation: ["Biology","Psych Soc","Biochem"],
      psResource: "300 Page Doc",
      cards: [], flScores: [], accuracy: [], carsLog: [],
      dailyChecks: {}, dailyExtras: {}, dailyLog: {},
      extraPick: "",
      blueprintDiagnostic: null
    };

    const App = () => {
      const todayISO = localISO();
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [syllabusCat, setSyllabusCat] = useState('Gen Chem');
      const [showHidden, setShowHidden] = useState(false);
      const [data, setData] = useState(DEFAULT_DATA);
      const [hasLoaded, setHasLoaded] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [authError, setAuthError] = useState('');

      const saveTimer = useRef(null);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);
      const carsChartRef = useRef(null);
      const carsChartInstance = useRef(null);

      const handleAuth = async (e, mode) => {
        e.preventDefault(); setAuthError('');
        const form = e.currentTarget?.tagName === 'FORM' ? e.currentTarget : e.currentTarget?.closest('form');
        try {
          if (mode === 'login') await signInWithEmailAndPassword(auth, form.elements.email.value.trim(), form.elements.password.value);
          else await createUserWithEmailAndPassword(auth, form.elements.email.value.trim(), form.elements.password.value);
        } catch (err) { setAuthError(err.code || err.message); }
      };

      useEffect(() => {
        const unsub = onAuthStateChanged(auth, async (u) => {
          setHasLoaded(false);
          if (!u) { setUser(null); setData(DEFAULT_DATA); return; }
          setUser(u);
          try {
            const snap = await getDoc(doc(db, "users", u.uid));
            if (snap.exists()) setData({ ...DEFAULT_DATA, ...snap.data() });
            else { await setDoc(doc(db, "users", u.uid), DEFAULT_DATA, { merge: true }); setData(DEFAULT_DATA); }
          } catch (err) { console.error(err); }
          finally { setHasLoaded(true); }
        });
        return unsub;
      }, []);

      useEffect(() => {
        if (!user || !hasLoaded) return;
        setIsSyncing(true);
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try { await setDoc(doc(db, "users", user.uid), data); }
          catch (err) { console.error(err); }
          finally { setIsSyncing(false); }
        }, 350);
        return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
      }, [data, user, hasLoaded]);

      const upsertLogItem = (date, item) => {
        setData(prev => {
          const arr = (prev.dailyLog?.[date] || []).filter(x => !(x.type === item.type && x.key === item.key));
          arr.unshift({ id: Date.now(), ...item });
          return { ...prev, dailyLog: { ...(prev.dailyLog || {}), [date]: arr } };
        });
      };
      const removeLogItem = (date, matcher) => {
        setData(prev => ({
          ...prev,
          dailyLog: { ...(prev.dailyLog || {}), [date]: (prev.dailyLog?.[date] || []).filter(x => !matcher(x)) }
        }));
      };

      const chapterKey = (cat, ch) => `${cat}|||${ch}`;
      const getChapterLabel = (cat, ch) => { const a = data.chapterAliases?.[chapterKey(cat, ch)]; return (a && String(a).trim()) ? a : ch; };
      const isHiddenChapter = (cat, ch) => !!data.hiddenChapters?.[chapterKey(cat, ch)];
      const toggleHideChapter = (cat, ch) => {
        const k = chapterKey(cat, ch); const h = { ...(data.hiddenChapters || {}) };
        if (h[k]) delete h[k]; else h[k] = true;
        setData({ ...data, hiddenChapters: h });
      };
      const renameChapterDisplay = (cat, ch) => {
        const k = chapterKey(cat, ch); const cur = data.chapterAliases?.[k] || "";
        const next = prompt("Rename: " + cat + " — " + ch + "\n(blank to reset)", cur);
        if (next === null) return;
        const a = { ...(data.chapterAliases || {}) }; const t = String(next).trim();
        if (!t) delete a[k]; else a[k] = t;
        setData({ ...data, chapterAliases: a });
      };
      const getFullChapterList = (cat) => {
        const base = (SYLLABUS[cat] || []).filter(ch => !data.deletedChapters?.[(cat+"|||"+ch)]);
        const custom = (data.customChapters?.[cat] || []).map(x => x.name);
        return [...base, ...custom];
      };

      const getNextChapter = (cat) => {
        const chs = getFullChapterList(cat).filter(ch => !isHiddenChapter(cat, ch));
        return chs.find(ch => !data.topics?.[(cat + "-" + ch)]) || "Finished! 🎉";
      };
      const handleTopicClick = (cat, ch) => {
        const key = cat + "-" + ch; const t = { ...(data.topics || {}) };
        if (t[key]) delete t[key];
        else t[key] = { date: todayISO, resource: cat === 'Psych Soc' ? data.psResource : 'Standard' };
        setData({ ...data, topics: t });
      };
      const toggleTopicInRotation = (t) => {
        let r = [...(data.activeRotation || [])];
        if (r.includes(t)) r = r.filter(x => x !== t); else r = [...r, t].slice(-3);
        setData({ ...data, activeRotation: r });
      };
      const setTaskCheck = ({ key, label, checked }) => {
        const c = { ...(data.dailyChecks || {}) };
        if (checked) c[key] = true; else delete c[key];
        setData({ ...data, dailyChecks: c });
        if (checked) upsertLogItem(todayISO, { type: 'task', key, label });
        else removeLogItem(todayISO, x => x.type === 'task' && x.key === key);
      };
      const syncCardsLogForDate = (date, cardsArr) => {
        const total = (cardsArr || []).filter(x => x.date === date).reduce((s, x) => s + Number(x.count || 0), 0);
        if (total > 0) upsertLogItem(date, { type: 'cards', key: 'cards', label: "Cards: " + total + " cards" });
        else removeLogItem(date, x => x.type === 'cards' && x.key === 'cards');
      };

      const subjectProgress = useMemo(() => Object.keys(SYLLABUS).map(cat => {
        const chapters = getFullChapterList(cat);
        const total = chapters.length;
        const done = chapters.filter(ch => !!data.topics?.[(cat + "-" + ch)]).length;
        return { cat, done, total, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
      }), [data.topics, data.customChapters, data.deletedChapters]);

      const totalProgress = useMemo(() => {
        const total = subjectProgress.reduce((s, x) => s + x.total, 0);
        const done = subjectProgress.reduce((s, x) => s + x.done, 0);
        return { done, total, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
      }, [subjectProgress]);

      const streak = useMemo(() => {
        let s = 0; const now = new Date();
        const todayStr = localISO(now);
        const todayActive = (data.dailyLog?.[todayStr] || []).length > 0;
        const start = todayActive ? 0 : 1;
        for (let i = start; i < 365; i++) {
          const d = new Date(now); d.setDate(d.getDate() - i);
          if ((data.dailyLog?.[localISO(d)] || []).length > 0) s++;
          else break;
        }
        return s;
      }, [data.dailyLog]);

      const heatmapDays = useMemo(() => {
        const days = []; const now = new Date();
        for (let i = 69; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); days.push(localISO(d)); }
        return days;
      }, []);

      const heatmapWeeks = useMemo(() => {
        const w = [];
        for (let i = 0; i < heatmapDays.length; i += 7) w.push(heatmapDays.slice(i, i + 7));
        return w;
      }, [heatmapDays]);

      const getHeatLevel = (iso) => { const n = (data.dailyLog?.[iso] || []).length; if (n === 0) return 0; if (n === 1) return 1; if (n <= 3) return 2; return 3; };

      const flWithComposite = useMemo(() =>
        (data.flScores || []).map(s => ({ ...s, composite: (Number(s.cp)||0)+(Number(s.cars)||0)+(Number(s.bb)||0)+(Number(s.ps)||0) }))
      , [data.flScores]);

      const flStats = useMemo(() => {
        const cs = flWithComposite.map(s => s.composite).filter(c => c > 0);
        if (!cs.length) return null;
        const sorted = [...flWithComposite].sort((a, b) => new Date(b.date) - new Date(a.date));
        const chronological = [...flWithComposite].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(s=>s.composite).filter(c=>c>0);
        return { best: Math.max(...cs), avg: Math.round(cs.reduce((a,b)=>a+b,0)/cs.length), latest: sorted[0]?.composite, trend: chronological.length >= 2 ? chronological[chronological.length-1] - chronological[0] : 0 };
      }, [flWithComposite]);

      const sortedScores = useMemo(() => [...(data.flScores||[])].sort((a,b)=>new Date(a.date)-new Date(b.date)), [data.flScores]);
      const sortedCarsLog = useMemo(() => [...(data.carsLog||[])].sort((a,b)=>new Date(a.date)-new Date(b.date)), [data.carsLog]);

      const carsStats = useMemo(() => {
        const entries = sortedCarsLog.filter(e => e.total > 0);
        if (!entries.length) return null;
        const pcts = entries.map(e => Math.round((e.correct/e.total)*100));
        return { avg: Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length), best: Math.max(...pcts), latest: pcts[pcts.length-1], total: entries.length };
      }, [sortedCarsLog]);

      const allHiddenChapters = useMemo(() => {
        const r = [];
        Object.keys(SYLLABUS).forEach(cat => getFullChapterList(cat).forEach(ch => { if (isHiddenChapter(cat, ch)) r.push({ cat, ch }); }));
        return r;
      }, [data.hiddenChapters, data.customChapters, data.deletedChapters]);

      useEffect(() => {
        if (!chartRef.current || activeTab !== 'scores') return;
        if (chartInstance.current) chartInstance.current.destroy();
        if (!sortedScores.length) return;
        chartInstance.current = new Chart(chartRef.current, {
          type: 'line',
          data: {
            labels: sortedScores.map(s => (s.date||'').slice(5)),
            datasets: [
              { label: 'C/P',  data: sortedScores.map(s=>s.cp),   borderColor: '#ef4444', tension: 0.3, pointRadius: 4 },
              { label: 'CARS', data: sortedScores.map(s=>s.cars), borderColor: '#f59e0b', tension: 0.3, pointRadius: 4 },
              { label: 'B/B',  data: sortedScores.map(s=>s.bb),   borderColor: '#10b981', tension: 0.3, pointRadius: 4 },
              { label: 'P/S',  data: sortedScores.map(s=>s.ps),   borderColor: '#8b5cf6', tension: 0.3, pointRadius: 4 }
            ]
          },
          options: { maintainAspectRatio: false, plugins: { legend: { labels: { font: { size: 10, weight: 'bold' } } } }, scales: { y: { min: 118, max: 132 } } }
        });
      }, [activeTab, sortedScores]);

      useEffect(() => {
        if (!carsChartRef.current || activeTab !== 'cars') return;
        if (carsChartInstance.current) carsChartInstance.current.destroy();
        const entries = sortedCarsLog.filter(e => e.total > 0);
        if (entries.length < 2) return;
        carsChartInstance.current = new Chart(carsChartRef.current, {
          type: 'line',
          data: {
            labels: entries.map(e => (e.date||'').slice(5)),
            datasets: [{ label: '% Correct', data: entries.map(e => Math.round((e.correct/e.total)*100)), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.08)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#f59e0b' }]
          },
          options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { callback: v => v+'%' } } } }
        });
      }, [activeTab, sortedCarsLog]);

      const deleteCards = (id) => { const row=(data.cards||[]).find(x=>x.id===id); const nc=(data.cards||[]).filter(x=>x.id!==id); setData({...data,cards:nc}); if(row?.date) syncCardsLogForDate(row.date,nc); };
      const deleteFL = (id) => setData({...data,flScores:(data.flScores||[]).filter(x=>x.id!==id)});
      const deleteAcc = (id) => setData({...data,accuracy:(data.accuracy||[]).filter(x=>x.id!==id)});
      const deleteCars = (id) => setData({...data,carsLog:(data.carsLog||[]).filter(x=>x.id!==id)});

      if (!user) return html`
        <div class="min-h-screen login-gradient flex items-center justify-center p-6">
          <div class="glass-card w-full max-w-sm p-8 space-y-6">
            <h1 class="text-3xl font-black text-center text-indigo-600 tracking-tighter italic">USER PORTAL</h1>
            ${authError && html`<p class="text-red-500 text-[10px] font-bold text-center bg-red-50 p-2 rounded-lg">${String(authError).replace('Firebase:','').trim()}</p>`}
            <form onSubmit=${(e)=>handleAuth(e,'login')} class="space-y-4">
              <input name="email" type="email" placeholder="Email" class="w-full p-4 bg-slate-50 rounded-2xl border" required />
              <input name="password" type="password" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl border" required />
              <div class="grid grid-cols-2 gap-3">
                <button type="submit" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px] shadow-xl">Sign In</button>
                <button type="button" onClick=${(e)=>handleAuth(e,'signup')} class="bg-white border-2 border-indigo-600 text-indigo-600 p-4 rounded-2xl font-black uppercase text-[10px]">Sign Up</button>
              </div>
            </form>
          </div>
        </div>`;

      const todaysExtras = data.dailyExtras?.[todayISO] || [];

      return html`
        <div class="min-h-screen">

          <!-- HEADER -->
          <header class="p-4 bg-white border-b sticky top-0 z-40 space-y-2">
            <div class="flex justify-between items-center">
              <div>
                <h1 class="text-xl font-black italic text-indigo-600">MCAT TRACKER</h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${hasLoaded?(isSyncing?'☁️ Syncing...':'✅ Secure'):'⏳ Loading...'}</p>
              </div>
              <div class="flex items-center gap-2">
                ${streak > 0 && html`
                  <div class="flex items-center gap-1 bg-orange-50 border border-orange-200 px-3 py-1.5 rounded-xl">
                    <span class="text-base">🔥</span><span class="text-[11px] font-black text-orange-600">${streak} day streak</span>
                  </div>`}
                <button onClick=${()=>signOut(auth)} class="text-[9px] font-black text-red-400 uppercase bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">Out</button>
              </div>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              ${[
                {href:"https://jackwestin.com/daily/mcat-practice-passages/cars-practice-passages/",label:"JW CARS",cls:"bg-amber-50 text-amber-700 border-amber-200"},
                {href:"https://www.mcatofficialprep.org/",label:"AAMC",cls:"bg-emerald-50 text-emerald-700 border-emerald-200"},
                {href:"https://www.uworld.com/app/index.html#/login/",label:"UWorld",cls:"bg-indigo-50 text-indigo-700 border-indigo-200"},
                {href:"https://www.khanacademy.org/test-prep/mcat",label:"KA",cls:"bg-blue-50 text-blue-700 border-blue-200"},
                
              ].map(l=>html`<a href=${l.href} target="_blank" class=${"shrink-0 text-[9px] font-black uppercase px-3 py-1.5 rounded-lg border whitespace-nowrap "+l.cls}>${l.label}</a>`)}
            </div>
            <div class="mt-2">
  <button
    onClick=${() => window.location.href = "./FLASHCARD.html"}
    class="text-[9px] font-black uppercase bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1.5 rounded-lg"> RECALL </button>
</div>
          </header>

          <main class="p-5 space-y-5 animate-slide">

            <!-- TODAY'S PROTOCOL -->
            <section class="glass-card p-5 bg-slate-900 text-white shadow-2xl relative overflow-hidden">
              <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500 blur-[80px] opacity-20"></div>
              <div class="flex justify-between items-center mb-4 relative z-10">
                <h2 class="text-xs font-black uppercase text-indigo-400 tracking-widest">Today · ${todayISO}</h2>
                <div class="flex space-x-1.5">
                  ${Object.keys(SYLLABUS).map(t=>html`
                    <button onClick=${()=>toggleTopicInRotation(t)}
                      class=${"h-8 px-2 rounded-lg text-[9px] font-black flex items-center justify-center border transition-all "+((data.activeRotation||[]).includes(t)?'bg-indigo-600 border-indigo-500 text-white shadow-lg':'border-slate-700 text-slate-400')}>
                      ${t==='Psych Soc'?'PS':t.slice(0,2)}
                    </button>`)}
                </div>
              </div>
              <div class="space-y-3 relative z-10">
                ${(data.activeRotation||[]).map(topic=>{
                  const checkKey=todayISO+"-content-"+topic, frozenKey=todayISO+"-content-"+topic+"-frozen";
                  const checked=!!data.dailyChecks?.[checkKey], frozen=data.dailyChecks?.[frozenKey]||'';
                  return html`
                    <div class="flex items-start gap-3">
                      <input type="checkbox" checked=${checked} onChange=${()=>{
                        const nc={...(data.dailyChecks||{})},nt={...(data.topics||{})};
                        const chosen=nc[frozenKey]||frozen||getNextChapter(topic);
                        if(chosen==="Finished! 🎉")return;
                        const hk=topic+"-"+chosen;
                        if(!checked){
                          nc[checkKey]=true;nc[frozenKey]=chosen;

                <!-- Blueprint Baseline Card -->

                  <div class="flex items-center justify-between mb-3">
                    <div>
                      <h3 class="text-sm font-black uppercase text-blue-600 tracking-widest">Blueprint Diagnostic</h3>
                      <p class="text-[10px] font-bold text-slate-400 mt-0.5">Your baseline score before studying</p>
                    </div>
                    <a href="https://blueprintprep.com/mcat/practice-exams"
                      class="text-[9px] font-black bg-blue-600 text-white px-3 py-1.5 rounded-xl uppercase whitespace-nowrap shadow">
                      Take Free →
                    </a>
                  </div>
                  <div class="flex gap-3">
                    <div class="flex-1">
                      <p class="text-[9px] font-black uppercase text-slate-400 mb-1">Composite (472–528)</p>
                      <input type="number" min="472" max="528" placeholder="e.g. 499"
                        value=${data.blueprintDiagnostic?.score||''}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xl font-black text-blue-600 text-center"
                        onInput=${e=>{
                          const v=Number(e.target.value);

                    </div>

                        onInput=${e=>{if(data.blueprintDiagnostic) setData({...data,blueprintDiagnostic:{...data.blueprintDiagnostic,date:e.target.value}});}} />
                    </div>
                  </div>
                </div>

                <!-- Readiness Score Engine -->
                ${(()=>{

                  // ── 1. CONTENT % ─────────────────────────────────────────
                  let chDone=0,chTotal=0;
                  Object.keys(SYLLABUS).forEach(cat=>{
                    const chs=getFullChapterList(cat);
                    chTotal+=chs.length;
                    chDone+=chs.filter(ch=>!!data.topics?.[cat+"-"+ch]).length;
                  });
                  const contentPct=chTotal>0?Math.round((chDone/chTotal)*100):0;

                  // ── 2. UWORLD % → AAMC-EQUIVALENT ────────────────────────
                  const uwEntries=(data.accuracy||[]).filter(x=>x.source==='UWorld'&&x.total>0);
                  const uwRaw=uwEntries.length>0
                    ?Math.round(uwEntries.reduce((s,x)=>s+(x.correct/x.total),0)/uwEntries.length*100):null;
                  const uwCalibrated=uwRaw!==null?Math.min(100,Math.round(uwRaw*1.18+8)):null;

                  // ── 3. AAMC % (direct) ────────────────────────────────────
                  const aamcEntries=(data.accuracy||[]).filter(x=>x.source?.includes('AAMC')&&x.total>0);
                  const aamcPct=aamcEntries.length>0
                    ?Math.round(aamcEntries.reduce((s,x)=>s+(x.correct/x.total),0)/aamcEntries.length*100):null;

                  // ── 4. CARS % ─────────────────────────────────────────────
                  const carsEntries=(data.carsLog||[]).filter(x=>x.total>0);
                  const carsPct=carsEntries.length>0
                    ?Math.round(carsEntries.reduce((s,x)=>s+(x.correct/x.total),0)/carsEntries.length*100):null;

                  // ── 5. FULL LENGTH SCORES ─────────────────────────────────
                  // Convert composite (472–528) to 0–100% scale: (score-472)/56*100
                  const flComp=flWithComposite.filter(s=>s.composite>0);
                  const flSorted=[...flComp].sort((a,b)=>new Date(b.date)-new Date(a.date));
                  const flLatest=flSorted[0]||null;
                  // Avg of most recent 3 FLs for stability
                  const flRecent=flSorted.slice(0,3);
                  const flAvgComposite=flRecent.length>0
                    ?Math.round(flRecent.reduce((s,x)=>s+x.composite,0)/flRecent.length):null;
                  const flPct=flAvgComposite!==null
                    ?Math.min(100,Math.max(0,Math.round(((flAvgComposite-472)/56)*100))):null;

                  // ── 6. BLUEPRINT DIAGNOSTIC ──────────────────────────────
                  const bpScore=data.blueprintDiagnostic?.score;
                  const bpPct=bpScore?Math.min(100,Math.max(0,Math.round(((bpScore-472)/56)*100))):null;

                  // ── WEIGHTS (re-normalised when data missing) ─────────────
                  // FL 30% | AAMC 27% | UWorld(calibrated) 20% | CARS 13% | Content 10%
                  const components=[
                    {key:'fl',     label:'Full Lengths', pct:flPct,        weight:0.30, color:'#06b6d4',

                     desc:'Avg of '+(flRecent.length||0)+' most recent FL'+(flRecent.length!==1?'s':'')+' — converted from 472–528 scale'},
                    {key:'aamc',   label:'AAMC',         pct:aamcPct,      weight:0.27, color:'#10b981', rawLabel:null,
                     desc:'QPack / Section Bank / IQB — direct score'},
                    {key:'uworld', label:'UWorld',       pct:uwCalibrated, weight:0.20, color:'#6366f1',
                     rawLabel:uwRaw!==null?('Raw: '+uwRaw+'%'):null,
                     desc:'Harder than AAMC — calibrated to AAMC scale'},
                    {key:'cars',   label:'CARS',         pct:carsPct,      weight:0.13, color:'#f59e0b', rawLabel:null,
                     desc:'Passage accuracy average'},
                    {key:'content',label:'Content',      pct:contentPct,   weight:0.10, color:'#8b5cf6', rawLabel:null,
                     desc:'Chapters completed across all subjects'},
                  ];
                  const available=components.filter(c=>c.pct!==null);
                  const totalW=available.reduce((s,c)=>s+c.weight,0);
                  const readiness=available.length>0
                    ?Math.round(available.reduce((s,c)=>s+(c.pct*(c.weight/totalW)),0)):null;

                  // ── SCORE PREDICTION MAP ──────────────────────────────────
                  const scoreMap=[
                    {min:90,lo:518,hi:524,band:'Elite',         gradient:'from-emerald-500 to-teal-400',   text:'text-emerald-400'},
                    {min:82,lo:514,hi:518,band:'Excellent',     gradient:'from-green-500 to-emerald-400',  text:'text-green-400'},
                    {min:74,lo:510,hi:514,band:'Strong',        gradient:'from-teal-500 to-green-400',     text:'text-teal-400'},
                    {min:65,lo:505,hi:510,band:'Good',          gradient:'from-blue-500 to-teal-400',      text:'text-blue-400'},
                    {min:55,lo:500,hi:505,band:'Developing',    gradient:'from-amber-500 to-yellow-400',   text:'text-amber-400'},
                    {min:45,lo:495,hi:500,band:'Building',      gradient:'from-orange-500 to-amber-400',   text:'text-orange-400'},
                    {min:0, lo:488,hi:495,band:'Foundation',    gradient:'from-red-500 to-orange-400',     text:'text-red-400'},
                  ];
                  const pred=readiness!==null?scoreMap.find(s=>readiness>=s.min):null;

                  const projectedMid=pred?Math.round((pred.lo+pred.hi)/2):null;
                  const improvement=bpScore&&projectedMid?projectedMid-bpScore:null;

                  const missing=components.filter(c=>c.pct===null&&!(c.key==='content'));

                  return html`
                    <!-- Hero Score Card -->
                    <div class="glass-card overflow-hidden">
                      <div class="bg-slate-900 p-6 relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/40 to-purple-900/40"></div>
                        <div class="absolute top-0 right-0 w-48 h-48 bg-indigo-500 blur-[120px] opacity-15 pointer-events-none"></div>
                        <div class="relative z-10">
                          <div class="flex items-start justify-between mb-4">
                            <div>
                              <p class="text-[10px] font-black uppercase text-indigo-400 tracking-widest">Exam Readiness Score</p>
                              <p class="text-[9px] text-slate-500 mt-0.5">Based on ${available.length}/5 data sources</p>
                            </div>
                            ${pred&&html`
                              <div class=${"text-xs font-black uppercase px-3 py-1.5 rounded-xl bg-white/10 "+pred.text}>
                                ${pred.band}
                              </div>`}
                          </div>

                          ${readiness!==null?html`
                            <div class="flex items-end gap-6 mb-5">
                              <div>
                                <div class="text-8xl font-black text-white leading-none tracking-tighter">
                                  ${readiness}<span class="text-4xl text-indigo-400">%</span>
                                </div>
                              </div>
                              <div class="flex-1 pb-1 space-y-1">
                                <p class="text-[9px] font-black uppercase text-slate-500">Predicted Score Range</p>
                                <p class=${"text-3xl font-black "+pred.text}>${pred.lo}–${pred.hi}</p>
                                ${bpScore?html`
                                  <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] font-bold text-slate-400">Baseline: ${bpScore}</span>
                                    ${improvement!==null&&improvement>0?html`
                                      <span class="text-[10px] font-black text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded-lg">
                                        +${improvement} pts 🚀
                                      </span>`:improvement!==null&&improvement===0?html`
                                      <span class="text-[10px] font-black text-slate-400">holding steady</span>
                                    `:improvement!==null&&improvement<0?html`
                                      <span class="text-[10px] font-black text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-lg">
                                        ${improvement} pts from baseline
                                      </span>`:null}
                                  </div>`:null}
                              </div>
                            </div>

                            <!-- FL mini-summary if available -->
                            ${flComp.length>0&&html`
                              <div class="mb-4 p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20">
                                <p class="text-[9px] font-black uppercase text-cyan-400 tracking-widest mb-2">Full Length Summary</p>
                                <div class="flex gap-4">
                                  <div class="text-center">
                                    <p class="text-[8px] font-black uppercase text-slate-500">FLs Logged</p>
                                    <p class="text-lg font-black text-white">${flComp.length}</p>
                                  </div>
                                  ${flLatest&&html`
                                    <div class="text-center">
                                      <p class="text-[8px] font-black uppercase text-slate-500">Latest</p>
                                      <p class="text-lg font-black text-cyan-300">${flLatest.composite}</p>
                                    </div>`}
                                  ${flComp.length>1&&html`
                                    <div class="text-center">
                                      <p class="text-[8px] font-black uppercase text-slate-500">Best</p>
                                      <p class="text-lg font-black text-emerald-300">${Math.max(...flComp.map(x=>x.composite))}</p>
                                    </div>`}
                                  ${flAvgComposite&&html`
                                    <div class="text-center">
                                      <p class="text-[8px] font-black uppercase text-slate-500">3-FL Avg</p>
                                      <p class="text-lg font-black text-white">${flAvgComposite}</p>
                                    </div>`}
                                  ${bpScore&&flLatest&&html`
                                    <div class="text-center">
                                      <p class="text-[8px] font-black uppercase text-slate-500">FL Growth</p>
                                      <p class=${"text-lg font-black "+(flLatest.composite-bpScore>=0?'text-emerald-300':'text-red-300')}>
                                        ${flLatest.composite-bpScore>=0?'+':''}${flLatest.composite-bpScore}
                                      </p>
                                    </div>`}
                                </div>
                              </div>`}

                            <!-- Readiness progress bar -->
                            <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                              <div class=${"h-3 rounded-full progress-bar bg-gradient-to-r "+pred.gradient}
                                style=${"width:"+readiness+"%"}></div>
                            </div>
                            <div class="flex justify-between mt-1">
                              <span class="text-[8px] text-slate-600">0%</span>
                              <span class="text-[8px] text-slate-600">100%</span>
                            </div>
                          `:html`
                            <div class="py-4 text-center">
                              <p class="text-slate-400 font-bold">No data yet</p>
                              <p class="text-slate-500 text-[11px] mt-1">Log accuracy entries or FL scores to generate your readiness score</p>
                            </div>`}
                        </div>
                      </div>

                      <!-- Component Breakdown -->
                      <div class="p-5 space-y-4 divide-y divide-slate-100">
                        ${components.map(c=>html`
                          <div class="pt-4 first:pt-0">
                            <div class="flex justify-between items-start mb-2">
                              <div>
                                <div class="flex items-center gap-1.5">
                                  <span class="text-xs font-black text-slate-800">${c.label}</span>
                                  ${c.key==='uworld'&&html`
                                    <span class="text-[8px] font-black uppercase bg-indigo-100 text-indigo-600 px-1.5 py-0.5 rounded-md">calibrated</span>`}
                                  ${c.key==='fl'&&html`
                                    <span class="text-[8px] font-black uppercase bg-cyan-100 text-cyan-600 px-1.5 py-0.5 rounded-md">scaled</span>`}
                                </div>
                                <p class="text-[9px] font-bold text-slate-400 mt-0.5">${c.desc}</p>
                                ${c.rawLabel&&html`<p class="text-[9px] font-black text-slate-500 mt-0.5">${c.rawLabel}</p>`}
                                ${c.key==='uworld'&&c.rawLabel&&html`<p class="text-[9px] font-black text-indigo-600">→ AAMC-equiv: ${c.pct}%</p>`}
                              </div>
                              <div class="text-right">
                                <span class=${"text-base font-black "+(c.pct===null?'text-slate-300':c.pct>=75?'text-emerald-600':c.pct>=60?'text-amber-500':'text-red-500')}>
                                  ${c.pct===null?'—':c.pct+'%'}
                                </span>
                                <p class="text-[8px] font-black uppercase text-slate-400">${Math.round(c.weight*100)}% wt</p>
                              </div>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                              <div class="h-2 rounded-full progress-bar" style=${"width:"+(c.pct||0)+"%;background:"+c.color}></div>
                            </div>
                          </div>`)}
                      </div>
                    </div>

                    <!-- Score Band Legend -->
                    <div class="glass-card p-5">
                      <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-3">Score Band Guide</p>
                      <div class="space-y-1.5">
                        ${scoreMap.map(s=>html`
                          <div class=${"flex items-center justify-between px-3 py-2 rounded-xl "+(pred?.band===s.band?'bg-indigo-50 border border-indigo-200':'bg-slate-50')}>
                            <div class="flex items-center gap-2">
                              ${pred?.band===s.band&&html`<span class="text-indigo-600 font-black text-xs">▶</span>`}
                              <span class="text-[11px] font-black text-slate-700">${s.band}</span>
                              <span class="text-[9px] font-bold text-slate-400">readiness ≥${s.min}%</span>
                            </div>
                            <span class="text-[11px] font-black text-slate-800">${s.lo}–${s.hi}</span>
                          </div>`)}
                      </div>
                    </div>

                    <!-- UWorld + FL Scale Explainer -->
                    <div class="glass-card p-5 border border-indigo-100 bg-indigo-50/30">
                      <p class="text-[10px] font-black uppercase text-indigo-600 tracking-widest mb-2">Score Scaling Notes</p>
                      <p class="text-[11px] font-bold text-slate-600 leading-relaxed mb-3">
                        <span class="font-black text-slate-800">UWorld</span> is calibrated up (×1.18 + 8) since it's harder than AAMC. 
                        <span class="font-black text-slate-800">FL scores</span> are converted from the 472–528 MCAT scale to a 0–100% readiness scale 
                        using <span class="font-black text-indigo-700">(composite − 472) ÷ 56</span>. The avg of your 3 most recent FLs is used.
                      </p>
                      <div class="grid grid-cols-4 gap-2">
                        ${[[500,50],[505,59],[510,68],[515,77],[518,82],[520,86],[524,93],[528,100]].slice(0,4).map(([score,pct])=>html`
                          <div class="bg-white rounded-xl p-2 text-center border border-indigo-100">
                            <p class="text-[9px] font-black text-slate-400">FL ${score}</p>
                            <p class="text-xs font-black text-indigo-600">${pct}%</p>
                          </div>`)}
                      </div>
                    </div>

                    <!-- Missing data nudges -->
                    ${missing.length>0&&html`
                      <div class="glass-card p-4 border border-amber-200 bg-amber-50/40">
                        <p class="text-[10px] font-black uppercase text-amber-600 tracking-widest mb-2">
                          📊 Add These For a Better Score
                        </p>
                        <div class="space-y-1.5">
                          ${missing.map(c=>html`
                            <div class="flex items-center gap-2">
                              <span class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span>
                              <span class="text-[11px] font-bold text-slate-600">
                                <span class="font-black text-slate-800">${c.label}:</span> ${c.desc}
                              </span>
                            </div>`)}
                        </div>
                      </div>`}
                  `;
                })()}
              </div>`}

          </main>

          <!-- BOTTOM NAV -->
          <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t h-20 flex items-center px-1 z-50">
            ${[
              {key:'home',label:'Home',icon:'H'},
              {key:'cars',label:'CARS',icon:'C'},
              {key:'cards',label:'Cards',icon:'🃏'},
              {key:'scores',label:'Scores',icon:'S'},
              {key:'acc',label:'Acc',icon:'A'},
              {key:'log',label:'Log',icon:'L'},
              {key:'ready',label:'Ready',icon:'🎯'},
              {key:'help',label:'Help',icon:'?'}
            ].map(t=>html`
              <button onClick=${()=>setActiveTab(t.key)} class=${"nav-item "+(activeTab===t.key?'active':'inactive')}>
                <div class=${"w-7 h-7 mb-0.5 rounded-lg flex items-center justify-center text-[11px] font-black "+(activeTab===t.key?'bg-indigo-600 text-white shadow-lg':'bg-slate-100 text-slate-500')}>
                  ${t.icon}
                </div>
                <span class="font-black tracking-tighter">${t.label}</span>
              </button>`)}
          </nav>
        </div>`;
    };

    
    render(html`<${App} />`, document.getElementById('root'));
  </script>
</body>
</html>
