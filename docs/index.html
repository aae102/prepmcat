<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MCAT TRACKER| Ultimate Pro v43</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
    input, select { outline: none; background: transparent; border: none; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; text-transform: uppercase; transition: all 0.2s; }
    .nav-item.active { color: #4f46e5; transform: translateY(-2px); }
    .nav-item.inactive { color: #94a3b8; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .todo-check:checked + span { text-decoration: line-through; opacity: 0.5; }
    .login-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    .custom-scroll { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .custom-scroll::-webkit-scrollbar { display: none; }
    @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slide { animation: slideIn 0.3s ease-out; }
  </style>
</head>

<body class="pb-28">
  <div id="root"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact';
    import { useEffect, useRef, useState } from 'https://esm.sh/preact/hooks';
    import htm from 'https://esm.sh/htm';

    // FIREBASE SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDSw5TCS2Kw9rfA7bQq21Und8FGcXph2CY",
      authDomain: "aniya-mcat.firebaseapp.com",
      projectId: "aniya-mcat",
      storageBucket: "aniya-mcat.firebasestorage.app",
      messagingSenderId: "480186345968",
      appId: "1:480186345968:web:d6175252b1df30f3555535",
      measurementId: "G-5FRG3GMLJQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const html = htm.bind(h);
    const todayISO = new Date().toISOString().split('T')[0];

    const SYLLABUS = {
      "Gen Chem": ["Ch 1: Atomic Structure", "Ch 2: Periodic Table", "Ch 3: Bonding", "Ch 4: Stoichiometry", "Ch 5: Kinetics", "Ch 6: Equilibrium", "Ch 7: Thermochemistry", "Ch 8: Gas Phase", "Ch 9: Solutions", "Ch 10: Acids and Bases", "Ch 11: Redox", "Ch 12: Electrochemistry"],
      "Orgo": ["Ch 1: Nomenclature", "Ch 2: Isomers", "Ch 3: Bonding", "Ch 4: Analyzing Reactions", "Ch 5: Alcohols", "Ch 6: Aldehydes I", "Ch 7: Aldehydes II", "Ch 8: Carboxylic Acids", "Ch 9: CA Derivatives", "Ch 10: N and P Compounds", "Ch 11: Spectroscopy", "Ch 12: Separations"],
      "Physics": ["Ch 1: Kinematics", "Ch 2: Energy", "Ch 3: Thermo", "Ch 4: Fluids", "Ch 5: Magnetism", "Ch 6: Circuits", "Ch 7: Waves", "Ch 8: Optics", "Ch 9: Atomic", "Ch 10: Math", "Ch 11: Research", "Ch 12: Stats"],
      "Biology": ["Ch 1: The Cell", "Ch 2: Reproduction", "Ch 3: Embryogenesis", "Ch 4: Nervous System", "Ch 5: Endocrine", "Ch 6: Respiratory", "Ch 7: Cardiovascular", "Ch 8: Immune", "Ch 9: Digestive", "Ch 10: Homeostasis", "Ch 11: Musculoskeletal", "Ch 12: Genetics"],
      "Biochem": ["Ch 1: Amino Acids", "Ch 2: Enzymes", "Ch 3: Protein Analysis", "Ch 4: Carbohydrates", "Ch 5: Lipids", "Ch 6: DNA/Biotech", "Ch 7: RNA/Code", "Ch 8: Membranes", "Ch 9: Metabolism I", "Ch 10: Metabolism II", "Ch 11: Lipid/AA Metabolism", "Ch 12: Bioenergetics"],
      "Psych Soc": ["Ch 1: Biological Bases", "Ch 2: Sensation", "Ch 3: Learning/Memory", "Ch 4: Cognition/Language", "Ch 5: Motivation/Emotion", "Ch 6: Identity/Personality", "Ch 7: Social Interaction", "Ch 8: Social Structure", "Ch 9: Demographics", "Ch 10: Social Stratification"]
    };

    const PS_RESOURCES = ["300 Page Doc", "86 Page Doc", "Kaplan", "Jack Westin", "Khan Academy", "Other"];

    const App = () => {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [syllabusCat, setSyllabusCat] = useState('Gen Chem');
      const [isSyncing, setIsSyncing] = useState(false);
      const [authError, setAuthError] = useState('');
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      const [data, setData] = useState({
        topics: {},
        activeRotation: ["Biology", "Psych Soc", "Biochem"],
        psResource: "300 Page Doc",
        anki: [],
        flScores: [],
        accuracy: [],
        dailyChecks: {} 
      });

      // LISTEN FOR LOGIN STATE
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (u) => {
          if (u) {
            setUser(u);
            const docRef = doc(db, "users", u.uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) setData(docSnap.data());
          } else {
            setUser(null);
          }
        });
        return unsubscribe;
      }, []);

      // SYNC DATA TO CLOUD
      useEffect(() => {
        if (user) {
          setIsSyncing(true);
          const docRef = doc(db, "users", user.uid);
          setDoc(docRef, data, { merge: true }).then(() => {
             setTimeout(() => setIsSyncing(false), 500);
          });
        }
      }, [data, user]);

      const handleAuth = async (e, mode) => {
        e.preventDefault();
        setAuthError('');
        const email = e.target.email.value;
        const password = e.target.password.value;
        try {
          if (mode === 'login') await signInWithEmailAndPassword(auth, email, password);
          else await createUserWithEmailAndPassword(auth, email, password);
        } catch (err) {
          setAuthError(err.message.replace('Firebase:', ''));
        }
      };

      const renderChart = () => {
        if (!chartRef.current || activeTab !== 'scores') return;
        if (chartInstance.current) chartInstance.current.destroy();
        const sorted = [...data.flScores].sort((a,b) => new Date(a.date) - new Date(b.date));
        if (sorted.length === 0) return;
        chartInstance.current = new Chart(chartRef.current, {
          type: 'line',
          data: {
            labels: sorted.map(s => s.date.slice(5)),
            datasets: [
              { label: 'C/P', data: sorted.map(s => s.cp), borderColor: '#ef4444', tension: 0.3 },
              { label: 'CARS', data: sorted.map(s => s.cars), borderColor: '#f59e0b', tension: 0.3 },
              { label: 'B/B', data: sorted.map(s => s.bb), borderColor: '#10b981', tension: 0.3 },
              { label: 'P/S', data: sorted.map(s => s.ps), borderColor: '#8b5cf6', tension: 0.3 }
            ]
          },
          options: { maintainAspectRatio: false, scales: { y: { min: 118, max: 132 } } }
        });
      };

      useEffect(() => { renderChart(); }, [activeTab, data.flScores]);

      const getNextChapter = (cat) => {
        const chapters = SYLLABUS[cat];
        const next = chapters.find(ch => !data.topics[`${cat}-${ch}`]);
        return next || "Finished! 🎉";
      };

      const toggleTopicInRotation = (t) => {
        let newRot = [...data.activeRotation];
        if (newRot.includes(t)) newRot = newRot.filter(x => x !== t);
        else newRot = [...newRot, t].slice(-3);
        setData({...data, activeRotation: newRot});
      };

      const handleTopicClick = (cat, ch) => {
        const key = `${cat}-${ch}`;
        const current = data.topics[key];
        setData({
          ...data,
          topics: {
            ...data.topics,
            [key]: current ? null : { date: todayISO, resource: cat === 'Psych Soc' ? data.psResource : 'Standard' }
          }
        });
      };

      if (!user) return html`
        <div class="min-h-screen login-gradient flex items-center justify-center p-6">
          <div class="glass-card w-full max-w-sm p-8 space-y-6">
            <h1 class="text-3xl font-black text-center text-indigo-600 tracking-tighter italic">USER PORTAL</h1>
            ${authError && html`<p class="text-red-500 text-[10px] font-bold text-center bg-red-50 p-2 rounded-lg">${authError}</p>`}
            <form onSubmit=${(e)=>handleAuth(e, 'login')} class="space-y-4">
              <input name="email" type="email" placeholder="Email" class="w-full p-4 bg-slate-50 rounded-2xl border" required />
              <input name="password" type="password" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl border" required />
              <div class="grid grid-cols-2 gap-3">
                <button type="submit" class="bg-indigo-600 text-white p-4 rounded-2xl font-black uppercase text-[10px] shadow-xl">Sign In</button>
                <button onClick=${(e)=>handleAuth(e, 'signup')} type="button" class="bg-white border-2 border-indigo-600 text-indigo-600 p-4 rounded-2xl font-black uppercase text-[10px]">Sign Up</button>
              </div>
            </form>
          </div>
        </div>
      `;

      return html`
        <div class="min-h-screen">
          <header class="p-6 bg-white border-b flex justify-between items-center sticky top-0 z-40">
            <div>
              <h1 class="text-xl font-black italic text-indigo-600">ANIYA PRO</h1>
              <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${isSyncing ? '☁️ Syncing...' : '✅ Secure'}</p>
            </div>
            <div class="flex items-center space-x-3">
               <a href="https://jackwestin.com/daily/mcat-practice-passages/cars-practice-passages/" target="_blank" class="text-[9px] font-black bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg uppercase">JW CARS</a>
               <button onClick=${()=>signOut(auth)} class="text-[9px] font-black text-red-400 uppercase">Logout</button>
            </div>
          </header>

          <main class="p-6 space-y-6 animate-slide">
            <section class="glass-card p-6 bg-slate-900 text-white shadow-2xl relative overflow-hidden">
               <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500 blur-[80px] opacity-20"></div>
               <div class="flex justify-between items-center mb-4 relative z-10">
                  <h2 class="text-xs font-black uppercase text-indigo-400 tracking-widest">Today's Protocol</h2>
                  <div class="flex space-x-1">
                    ${Object.keys(SYLLABUS).map(t => html`
                        <button onClick=${() => toggleTopicInRotation(t)} class="w-7 h-7 rounded-lg text-[9px] font-black flex items-center justify-center border transition-all ${data.activeRotation.includes(t)?'bg-indigo-600 border-indigo-500 scale-110 shadow-lg':'border-slate-700 text-slate-500'}">
                            ${t === 'Psych Soc' ? 'PS' : t[0]}
                        </button>
                    `)}
                  </div>
               </div>
               <div class="space-y-3 relative z-10">
                  ${data.activeRotation.map(topic => html`
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" checked=${data.dailyChecks[`${todayISO}-${topic}`]} onChange=${()=>setData({...data, dailyChecks: {...data.dailyChecks, [`${todayISO}-${topic}`]: !data.dailyChecks[`${todayISO}-${topic}`]}})} class="todo-check w-5 h-5 rounded-full accent-indigo-500 border-none" />
                        <span class="text-sm font-bold text-slate-100">${topic}: <span class="text-indigo-300">${getNextChapter(topic)}</span></span>
                    </label>
                  `)}
                  <label class="flex items-center space-x-3 cursor-pointer">
                      <input type="checkbox" checked=${data.dailyChecks[`${todayISO}-cars`]} onChange=${()=>setData({...data, dailyChecks: {...data.dailyChecks, [`${todayISO}-cars`]: !data.dailyChecks[`${todayISO}-cars`]}})} class="todo-check w-5 h-5 rounded-full accent-green-500" />
                      <span class="text-sm font-bold text-slate-100">Daily CARS Passage</span>
                  </label>
               </div>
            </section>

            ${activeTab === 'home' && html`
              <div class="space-y-4">
                <div class="flex space-x-2 custom-scroll no-scrollbar p-1">
                  ${Object.keys(SYLLABUS).map(cat => html`
                    <button onClick=${()=>setSyllabusCat(cat)} class="px-5 py-2.5 rounded-full text-[10px] font-black uppercase whitespace-nowrap shadow-sm transition-all ${syllabusCat===cat?'bg-indigo-600 text-white':'bg-white border text-slate-400'}">
                      ${cat}
                    </button>
                  `)}
                </div>
                <div class="grid grid-cols-1 gap-3 animate-slide">
                  ${SYLLABUS[syllabusCat].map(t => html`
                    <div onClick=${() => handleTopicClick(syllabusCat, t)} class="glass-card p-5 flex justify-between items-center transition-all cursor-pointer hover:border-indigo-300 ${data.topics[`${syllabusCat}-${t}`]?'border-green-400 bg-green-50/50 shadow-inner':''}">
                      <div class="flex flex-col">
                        <span class="text-xs font-black ${data.topics[`${syllabusCat}-${t}`]?'text-green-700':'text-slate-700'}">${t}</span>
                      </div>
                      <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${data.topics[`${syllabusCat}-${t}`]?'bg-green-500 border-green-500':'border-slate-200'}">
                         ${data.topics[`${syllabusCat}-${t}`] && html`<span class="text-white text-[10px]">✓</span>`}
                      </div>
                    </div>
                  `)}
                </div>
              </div>
            `}

            ${activeTab === 'journal' && html`
               <div class="space-y-6 animate-slide">
                  <h2 class="text-2xl font-black tracking-tighter">Daily Audit</h2>
                  ${[...new Set([...Object.values(data.topics).map(v => v?.date), todayISO])].filter(Boolean).sort().reverse().map(date => html`
                    <div class="glass-card p-6 space-y-4 border-l-8 ${date === todayISO ? 'border-indigo-600' : 'border-slate-200'}">
                       <p class="text-xs font-black text-indigo-600 uppercase tracking-widest">${date}</p>
                       <div class="space-y-2">
                          ${Object.entries(data.topics).filter(([k, v]) => v?.date === date).map(([key, info]) => html`
                             <div class="flex items-center space-x-2 bg-white/60 p-2 rounded-lg border border-slate-100">
                                <span class="text-xs font-black text-slate-700">${key.split('-')[1]}</span>
                             </div>
                          `)}
                       </div>
                    </div>
                  `)}
               </div>
            `}

            ${activeTab === 'anki' && html`
              <div class="space-y-4 animate-slide">
                 <h2 class="text-xl font-black">Memory Engine</h2>
                 <button onClick=${() => setData({...data, anki: [{id: Date.now(), date: todayISO, count: 0}, ...data.anki]})} class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black uppercase text-xs shadow-lg">+ Log Cards Matured</button>
                 ${data.anki.map(a => html`
                    <div class="glass-card p-5 flex justify-between items-center">
                        <input type="date" value=${a.date} class="text-xs font-black text-indigo-600" onInput=${e => setData({...data, anki: data.anki.map(x=>x.id===a.id?{...x, date:e.target.value}:x)})} />
                        <input type="number" class="w-16 text-right font-black text-xl" value=${a.count} onInput=${e => setData({...data, anki: data.anki.map(x=>x.id===a.id?{...x, count:Number(e.target.value)}:x)})} />
                    </div>
                 `)}
              </div>
            `}

            ${activeTab === 'scores' && html`
              <div class="space-y-6 animate-slide">
                 <div class="glass-card p-4 h-64 shadow-inner"><canvas ref=${chartRef}></canvas></div>
                 <button onClick=${() => setData({...data, flScores: [{id:Date.now(), date:todayISO, source:'AAMC FL', cp:125, cars:125, bb:125, ps:125}, ...data.flScores]})} class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black uppercase text-xs">+ New Full Length</button>
                 ${data.flScores.map(s => html`
                    <div class="glass-card p-5 space-y-4">
                       <div class="grid grid-cols-4 gap-3">
                          ${['cp','cars','bb','ps'].map(f => html`<div class="bg-slate-50 p-2 rounded-xl text-center"><p class="text-[8px] font-black text-slate-400 uppercase">${f}</p><input type="number" class="w-full text-center font-black" value=${s[f]} onInput=${e=>setData({...data, flScores: data.flScores.map(x=>x.id===s.id?{...x, [f]:Number(e.target.value)}:x)})} /></div>`)}
                       </div>
                    </div>
                 `)}
              </div>
            `}

            ${activeTab === 'acc' && html`
              <div class="space-y-4 animate-slide">
                <button onClick=${() => setData({...data, accuracy: [{id:Date.now(), p:'UWorld', s:'Topic', c:0, t:0}, ...data.accuracy]})} class="w-full bg-indigo-600 text-white p-5 rounded-2xl font-black uppercase text-xs shadow-lg">+ Log Practice Set</button>
                ${data.accuracy.map(r => html`
                  <div class="glass-card p-5 flex items-center justify-between">
                    <input class="text-sm font-black text-slate-700" value=${r.s} onInput=${e=>setData({...data, accuracy: data.accuracy.map(x=>x.id===r.id?{...x, s:e.target.value}:x)})} />
                    <div class="flex items-center space-x-3">
                      <input type="number" class="w-10 text-center font-black text-lg text-indigo-600" value=${r.c} onInput=${e=>setData({...data, accuracy: data.accuracy.map(x=>x.id===r.id?{...x, c:Number(e.target.value)}:x)})} />
                      <span class="text-slate-300">/</span>
                      <input type="number" class="w-10 text-center font-black text-lg" value=${r.t} onInput=${e=>setData({...data, accuracy: data.accuracy.map(x=>x.id===r.id?{...x, t:Number(e.target.value)}:x)})} />
                    </div>
                  </div>
                `)}
              </div>
            `}
          </main>

          <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t h-24 flex items-center px-4 z-50">
            ${['home','journal','anki','scores','acc'].map(t => html`
              <button onClick=${() => setActiveTab(t)} class="nav-item ${activeTab===t?'active':'inactive'}">
                <div class="w-6 h-6 mb-1 rounded-lg flex items-center justify-center ${activeTab===t?'bg-indigo-600 text-white shadow-lg':'bg-slate-100'}">
                   <span class="text-[10px] font-black">${t === 'acc' ? '%' : t[0].toUpperCase()}</span>
                </div>
                <span class="font-black text-[7px] tracking-tighter">${t}</span>
              </button>
            `)}
          </nav>
        </div>
      `;
    };

    render(html`<${App} />`, document.getElementById('root'));
  </script>
</body>
</html>
